<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<meta charset="utf-8">
<title>深夜のグローバルデスク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">

<style>
/* 明るい業務画面。夜勤の状況は時刻とワールドクロックで伝える。 */

:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EDF2F7; --surface-3:#E3EAF2;
  --line:#CBD6E2; --line-soft:#E4EBF2;
  --text:#15202B; --text-2:#46586B; --text-3:#5D7185;
  --accent:#1B5FA8; --accent-hover:#16508F; --accent-soft:#E6EFF9; --accent-line:#A9C6E4;
  --signal:#0E7C7B; --signal-soft:#E0F2F1;
  --good:#157A50; --good-soft:#E3F3EB; --warn:#A96500; --warn-soft:#FBF0DE;
  --crit:#B3352B; --crit-soft:#FBEAE8;
  /* 旧クラスを意味のあるライトトークンへ接続する互換層 */
  --ink:var(--bg); --panel:var(--surface); --panel-2:var(--surface-2); --panel-3:var(--surface-3);
  --dim:var(--text-2); --faint:var(--text-3); --amber:var(--accent); --amber-deep:var(--accent-line);
  --amber-glow:var(--accent-soft); --signal-deep:var(--signal); --crit-glow:var(--crit-soft);
  --display: "IBM Plex Sans", "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;

  --sp: 4px;
}

*{ box-sizing: border-box; }

body{
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

button{ font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible{
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

.mono{ font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- 見出し・ラベル ---------- */

.eyebrow{
  font-family: var(--display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}

.pane-title{
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  margin: 0;
}

/* ============================================================
   トップバー ― 発着案内板を意識した琥珀の帯
   ============================================================ */

.topbar{
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(180deg, #0E1926 0%, #0B131C 100%);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(240,166,72,.18), 0 8px 24px rgba(0,0,0,.4);
}

.topbar-inner{
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 20px;
  flex-wrap: wrap;
}

.brand{
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-right: auto;
}
.brand .mark{
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: .1em;
  color: var(--amber);
  text-transform: uppercase;
}
.brand .sub{
  font-size: 11px;
  color: var(--faint);
  letter-spacing: .06em;
}

.clock{
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.clock .t{
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--amber);
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
}
.clock .z{ font-size: 11px; color: var(--faint); letter-spacing: .04em; }

.kpis{
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
}
.kpi{ display: flex; flex-direction: column; gap: 1px; min-width: 58px; }
.kpi .k{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.kpi .v{
  font-family: var(--mono);
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.kpi .v.warn{ color: var(--warn); }
.kpi .v.crit{ color: var(--crit); }
.kpi .v.good{ color: var(--good); }

.btn-help{
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 2px;
  transition: border-color .15s, color .15s;
}
.btn-help:hover{ border-color: var(--amber-deep); color: var(--amber); }

/* ---------- UTC-12〜UTC+12 ワールドクロック ---------- */

.world-strip{
  position: relative;
  height: 44px;
  overflow: hidden;
  border-top: 1px solid var(--line-soft);
  background: var(--panel);
}
.world-sky{
  position: absolute;
  inset: 0;
  opacity: .72;
  transition: background .25s ease;
}
.world-axis{
  position: absolute;
  inset: 0 20px;
}
.world-axis::after{
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 25px;
  border-top: 1px solid var(--line);
}
.world-zone-label{
  position: absolute;
  bottom: 1px;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  letter-spacing: .04em;
}
.world-zone-label.first{ left: 0; transform: none; }
.world-zone-label.mid{ left: 50%; }
.world-zone-label.last{ right: 0; transform: none; }
.world-jst{
  position: absolute;
  left: 87.5%;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--amber-deep);
  opacity: .75;
}
.world-jst span{
  position: absolute;
  right: 3px;
  bottom: 0;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--amber);
}
.world-pin{
  --stack: 0;
  position: absolute;
  top: calc(2px + var(--stack) * 10px);
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: max-content;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}
.world-pin-dot{
  width: 7px;
  height: 7px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--faint);
  box-shadow: 0 0 0 2px var(--panel);
}
.world-pin.waiting .world-pin-dot{ background: var(--amber); border-color: var(--amber); animation: pinpulse 1.8s ease-in-out infinite; }
.world-pin.active .world-pin-dot{ background: var(--signal); border-color: var(--signal); }
.world-pin.callback{ color: var(--signal); }
.world-pin.callback .world-pin-dot{ background: var(--signal-deep); border-color: var(--signal); }
.world-pin.closed{ color: var(--faint); opacity: .62; }
.world-pin.abandoned{ color: var(--crit); opacity: 1; }
.world-pin.abandoned .world-pin-dot{ background: var(--crit); border-color: var(--crit); }
@keyframes pinpulse{
  0%,100%{ transform: scale(.85); opacity: .62; }
  50%{ transform: scale(1.2); opacity: 1; }
}

/* ============================================================
   コンソール ― 3ペイン
   ============================================================ */

.console{
  display: grid;
  grid-template-columns: 288px minmax(0,1fr) 330px;
  gap: 1px;
  background: var(--line-soft);
  align-items: stretch;
}

/* ============================================================
   深夜オフィス ― 通話前後のフィールド画面
   人物は置かず、灯りと業務用品だけで在席を表す
   ============================================================ */
.office-scene{
  display: none;
  min-height: calc(100vh - 116px);
  padding: 20px;
  background: radial-gradient(circle at 50% 35%, #152433 0, var(--ink) 56%);
}
body.office-view .office-scene{ display: flex; flex-direction: column; gap: 14px; animation: office-in .26s ease both; }
/* ブリーフィング・業務報告・振り返りを開いている間はオフィスも隠す。
   詳細度が同じなので、上の office-view より後ろに置くこと */
body.sheet-open .office-scene{ display: none; }
body.office-view .console{ display: none; }
body.call-view .office-scene{ display: none; }
body.call-view .console{ animation: call-in .22s ease both; }
@keyframes office-in{ from{ opacity:0; transform:scale(1.025); } to{ opacity:1; transform:none; } }
@keyframes call-in{ from{ opacity:0; transform:scale(.975); } to{ opacity:1; transform:none; } }

.office-head{
  max-width: 1120px;
  margin: 0 auto 14px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
}
.office-head h1{ margin:0; font-family:var(--display); font-size:26px; letter-spacing:.1em; color:var(--text); }
.office-head p{ margin:0; color:var(--faint); font-size:12px; }
.office-floor{
  position:relative;
  width:100%;
  max-width:1120px;
  flex:1;
  /* 中の什器は px 配置なので、床が縮んでも重ならない下限を持たせる */
  min-height:520px;
  margin:0 auto;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:3px;
  background-color:#0d1822;
  background-image:linear-gradient(90deg, rgba(36,56,74,.23) 1px, transparent 1px),linear-gradient(rgba(36,56,74,.23) 1px, transparent 1px);
  background-size:42px 42px;
  box-shadow:inset 0 0 90px rgba(0,0,0,.5);
}
.office-floor::after{ content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 48% 46%, transparent 0 24%, rgba(0,0,0,.42) 78%); }
.office-object{
  position:absolute;
  z-index:1;
  border:1px solid var(--line);
  border-radius:2px;
  background:var(--panel);
  color:var(--dim);
  text-align:left;
  font:11px/1.45 var(--body);
}
.office-object b{ display:block; font-family:var(--display); letter-spacing:.11em; color:var(--faint); font-size:11px; }
.office-object small{ display:block; color:var(--dim); font-family:var(--mono); font-size:11px; }
.office-desk{
  width:206px;
  height:134px;
  padding:13px 15px;
  left:50%; top:186px; transform:translateX(-50%);
  border-color:var(--amber-deep);
  background:linear-gradient(145deg, rgba(240,166,72,.18), var(--panel) 65%);
  box-shadow:0 0 0 1px rgba(240,166,72,.14),0 0 34px rgba(240,166,72,.13);
  cursor:pointer;
}
.office-desk:hover{ border-color:var(--amber); }
.office-desk .phone-icon{ position:absolute; right:18px; top:19px; width:52px; height:33px; border:2px solid var(--amber-deep); border-radius:10px 10px 4px 4px; }
.office-desk .phone-icon::before{ content:""; position:absolute; left:8px; right:8px; top:-10px; height:13px; border:3px solid var(--amber); border-bottom:0; border-radius:9px 9px 0 0; }
.office-desk.ringing{ animation: phone-ring 1.2s ease-in-out infinite; border-color:var(--amber); }
.office-desk.ringing::after{ content:""; position:absolute; inset:-13px; border:1px solid var(--amber-deep); border-radius:8px; animation: phone-wave 1.2s ease-out infinite; }
@keyframes phone-ring{ 0%,100%{ box-shadow:0 0 0 1px rgba(240,166,72,.14),0 0 20px rgba(240,166,72,.1); } 50%{ box-shadow:0 0 0 1px rgba(240,166,72,.5),0 0 44px rgba(240,166,72,.3); } }
@keyframes phone-wave{ from{ opacity:.9; transform:scale(.85); } to{ opacity:0; transform:scale(1.22); } }
.office-desk .seat-dot{ position:absolute; width:44px; height:22px; bottom:-31px; left:80px; border:1px solid var(--amber-deep); border-radius:50%; background:var(--amber-glow); }
.office-empty{ width:150px; height:82px; padding:10px; opacity:.52; cursor:default; }
.office-empty::after{ content:""; position:absolute; width:32px; height:15px; left:55px; bottom:-19px; border:1px solid var(--line); border-radius:50%; }
/* 什器は左列・中央・右列の3列に分け、縦位置は px で固定して重なりを避ける */
.office-empty.one{ left:3%; top:150px; }
.office-empty.two{ right:3%; left:auto; top:16px; }
.office-empty.three{ left:3%; top:300px; }
.office-empty.four{ right:3%; left:auto; top:300px; }
.office-sv{ right:3%; top:150px; width:160px; height:90px; padding:11px; }
.office-sv .lamp{ position:absolute; right:14px; top:13px; width:20px; height:24px; border-radius:50% 50% 4px 4px; background:var(--amber); box-shadow:0 0 22px var(--amber); }
.office-sv.busy .lamp{ background:var(--faint); box-shadow:none; }
.office-board{ left:3%; top:16px; width:270px; min-height:112px; padding:12px 14px; background:#d8e4ec; color:#21313d; border-color:#8497a6; }
.office-board b{ color:#3b4d59; }.office-board .notice{ margin-top:7px; color:#943f37; font-weight:700; font-size:12px; }.office-board .blank{ margin-top:7px; color:#596b7a; font-size:11px; }
.office-ship{ right:3%; bottom:16px; width:210px; min-height:102px; padding:11px 13px; }
.office-ship::before{ content:""; position:absolute; right:13px; bottom:13px; width:48px; height:24px; border:1px solid var(--signal-deep); background:repeating-linear-gradient(90deg,var(--signal-deep) 0 3px,transparent 3px 6px); opacity:.7; }
.office-tray{ left:3%; bottom:16px; width:210px; min-height:92px; padding:11px 13px; }
.office-tray::before{ content:""; position:absolute; right:13px; top:14px; width:38px; height:28px; background:var(--amber); transform:rotate(5deg); opacity:.7; box-shadow:-5px 5px 0 var(--signal-deep); }
.office-clock{ left:44%; top:16px; min-width:116px; padding:8px 12px; text-align:center; font-family:var(--mono); font-size:20px; color:var(--amber); }
.office-window{ left:41%; bottom:16px; width:172px; height:96px; overflow:hidden; background:linear-gradient(180deg,#101f33,#07111a); }
.office-window::before{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 18% 72%, var(--amber) 0 1px,transparent 2px),radial-gradient(circle at 42% 34%, var(--signal) 0 1px,transparent 2px),radial-gradient(circle at 76% 62%, var(--amber) 0 1px,transparent 2px); background-size:27px 23px; opacity:.65; }.office-window::after{ content:""; position:absolute; left:50%; top:0; bottom:0; border-left:1px solid var(--line); box-shadow:0 47px 0 var(--line); }
.office-incoming{
  position:absolute; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(500px,calc(100% - 28px)); max-height:calc(100% - 34px); overflow:auto;
  padding:16px; border:1px solid var(--amber-deep); border-radius:3px; background:var(--ink); box-shadow:0 20px 60px rgba(0,0,0,.65);
}
.office-incoming[hidden]{ display:none; }
.office-incoming-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:10px; }.office-incoming-head h2{ margin:0; font-family:var(--display); font-size:18px; letter-spacing:.1em; color:var(--amber); }
.office-incoming-list{ display:flex; flex-direction:column; gap:7px; }.office-incoming .qcard{ min-height:auto; }
.office-fast{ margin-top:12px; width:100%; }
.call-summary .summary-figure{ padding:13px 3px; color:var(--dim); line-height:1.9; }.summary-figure b{ color:var(--text); font-family:var(--mono); font-weight:500; }

@media (max-width:760px){
  .office-scene{ min-height:auto; padding:14px; }.office-floor{ min-height:700px; }.office-desk{ left:50%; top:40%; transform:translateX(-50%); }.office-empty.one{left:5%;top:20%;}.office-empty.two{right:5%;left:auto;top:20%;}.office-empty.three{left:5%;top:67%;}.office-empty.four{right:5%;left:auto;top:67%;}.office-board{left:5%;width:230px;}.office-sv{right:4%;top:7%;width:126px;}.office-clock{right:34%;top:28%;}.office-ship{right:4%;bottom:4%;}.office-tray{left:4%;bottom:4%;}.office-window{display:none;}
}

/* コンソールを操作している間だけ画面の高さに収め、はみ出しは各ペインの中で
   スクロールさせる。ブリーフィング等のシートを開いている間は通常の
   ドキュメントフローに戻す（埋め込み表示でもページごとスクロールできるように） */
@media (min-width: 761px){
  /* overflow は hidden ではなく auto。画面の高さが足りない環境で
     アクション欄が見えなくなるより、ページごとスクロールできたほうがよい */
  body.playing{ display: flex; flex-direction: column; height: 100vh; overflow: auto; }
  body.playing .topbar{ flex: none; }
  body.playing .console{ flex: 1; min-height: 0; }
  body.playing .pane{ overflow-y: auto; }
  body.playing .pane.desk{ overflow: hidden; }
  /* 高さが足りないときに削られるのは会話ログのほう。
     アクション欄は必ず残す（押せない画面を作らない） */
  body.playing .call{ min-height: 0; overflow: hidden; }
  body.playing .transcript{ max-height: none; flex: 1; min-height: 0; }
  body.playing .actions{ flex: none; }
}

/* 縦に余裕のない画面では、補足のヒントと余白を落として操作部を優先する */
@media (min-width: 761px) and (max-height: 680px){
  body.playing .topbar-inner{ padding: 4px 14px; gap: 14px; }
  body.playing .brand .sub{ display: none; }
  body.playing .clock .t{ font-size: 18px; }
  body.playing .kpis{ gap: 11px; }
  body.playing .kpi{ min-width: 46px; }
  body.playing .kpi .k{ font-size: 11px; }
  body.playing .kpi .v{ font-size: 12px; }
  body.playing .world-strip{ height: 28px; }
  body.playing .world-axis{ inset-inline: 14px; }
  body.playing .world-axis::after{ top: 19px; }
  body.playing .world-zone-label,
  body.playing .world-jst span,
  body.playing .world-pin-label{ display: none; }
  body.playing .world-pin{ top: calc(3px + var(--stack) * 8px); }
  body.playing .world-pin-dot{ width: 6px; height: 6px; }
  body.playing .pane{ padding: 9px 10px; gap: 7px; }
  body.playing .pane-head{ padding-bottom: 4px; }
  body.playing .actions .hint-bar{ display: none; }
  body.playing .transcript{ padding: 6px 10px; gap: 7px; }
  body.playing .call-head{ padding: 5px 10px; }
  body.playing .actions{ padding: 7px 10px 8px; gap: 6px; }
  body.playing .act-tab{ padding: 3px 8px; }
  body.playing .opt{ padding: 5px 8px; line-height: 1.4; }
  body.playing .opts{ max-height: min(22vh, 148px); }
}

/* シート表示中はコンソールを隠す */
body.sheet-open .topbar,
body.sheet-open .console,
body.sheet-open .toast-wrap{ display: none; }

.pane{
  background: var(--ink);
  padding: 16px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pane-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}

.count-chip{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  border: 1px solid var(--line);
  padding: 1px 7px;
  border-radius: 2px;
}

/* ---------- 待ち行列 ---------- */

.queue-list{
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
}

.callback-wrap{
  border-top: 1px solid var(--line-soft);
  padding-top: 10px;
}
.callback-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 7px;
}
.callback-list{ display: flex; flex-direction: column; gap: 6px; }
.callback-card{
  width: 100%;
  padding: 8px 10px;
  text-align: left;
  background: rgba(87,199,192,.06);
  border: 1px solid var(--signal-deep);
  border-left: 2px solid var(--signal);
  border-radius: 2px;
}
.callback-card:hover:not(:disabled){ background: rgba(87,199,192,.11); }
.callback-card:disabled{ opacity: .48; cursor: not-allowed; }
.callback-card.overdue{ border-color: var(--crit); background: var(--crit-glow); }
.callback-card b{ display: block; font-size: 12px; font-weight: 500; color: var(--text); }
.callback-card span{ display: block; margin-top: 2px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
.callback-card.overdue span{ color: var(--crit); }

.qcard{
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-left: 2px solid var(--line);
  border-radius: 2px;
  padding: 10px 11px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
  width: 100%;
  transition: border-color .15s, background .15s, transform .1s;
}
.qcard:hover:not(:disabled){
  background: var(--panel-2);
  border-left-color: var(--amber);
}
.qcard:active:not(:disabled){ transform: translateY(1px); }
.qcard:disabled{ opacity: .45; cursor: not-allowed; }
.qcard.urgent{ border-left-color: var(--crit); background: linear-gradient(90deg, var(--crit-glow), var(--panel) 60%); }

.qcard-top{
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.qcard .tid{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  letter-spacing: .06em;
}
.qcard .wait{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}
.qcard .wait.long{ color: var(--warn); }
.qcard .wait.crit{ color: var(--crit); }

.qcard .name{
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
}
.qcard .place{
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--signal);
}
.qcard .snip{
  font-size: 11.5px;
  color: var(--dim);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 忍耐メーター */
.mood{
  height: 3px;
  background: var(--line-soft);
  border-radius: 1px;
  overflow: hidden;
}
.mood i{
  display: block;
  height: 100%;
  background: var(--good);
  transition: width .3s ease, background .3s;
}
.mood i.mid{ background: var(--warn); }
.mood i.low{ background: var(--crit); }

.empty-note{
  color: var(--faint);
  font-size: 12px;
  padding: 18px 4px;
  text-align: center;
  line-height: 1.8;
}

/* ---------- 中央：一件の通話 ---------- */
.call{
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.call.on-hold{
  border-color: var(--amber-deep);
  box-shadow: inset 0 0 0 1px var(--amber-deep);
  background: linear-gradient(180deg, var(--amber-glow), var(--panel) 34%);
}

.call-head{
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 14px;
}
.call-head .cname{ font-size: 15px; font-weight: 700; }
.call-head .ctype{
  font-size: 11px;
  color: var(--amber);
  border: 1px solid var(--amber-deep);
  padding: 0 6px;
  border-radius: 2px;
}
.call-time{
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--signal);
  font-variant-numeric: tabular-nums;
}
.hold-state{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--amber);
  text-transform: uppercase;
}
.call-meta{
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}
.call-meta b{ color: var(--faint); font-weight: 400; }

.transcript{
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 140px;
  max-height: 46vh;
}

.line{ display: flex; flex-direction: column; gap: 3px; max-width: 88%; }
.line .who{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.line .say{
  padding: 9px 12px;
  border-radius: 2px;
  line-height: 1.75;
  font-size: 13.5px;
}
.line.cust{ align-self: flex-start; }
.line.cust .say{
  background: var(--panel-2);
  border-left: 2px solid var(--line);
}
.line.me{ align-self: flex-end; }
.line.me .who{ text-align: right; color: var(--amber-deep); }
.line.me .say{
  background: rgba(240,166,72,.09);
  border-right: 2px solid var(--amber-deep);
}
.line.sys{ align-self: stretch; max-width: 100%; }
.line.sys .who{ color: var(--signal-deep); }
.line.sys .say{
  background: rgba(87,199,192,.06);
  border-left: 2px solid var(--signal-deep);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--signal);
  line-height: 1.7;
}
.line.note .say{
  background: transparent;
  border-left: 2px solid var(--line);
  color: var(--dim);
  font-size: 12px;
  font-style: normal;
}

/* アクション */
.actions{
  border-top: 1px solid var(--line-soft);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.act-tabs{ display: flex; gap: 2px; flex-wrap: wrap; }
.act-tab{
  background: transparent;
  border: 1px solid var(--line-soft);
  border-bottom-color: transparent;
  color: var(--dim);
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 5px 12px;
  border-radius: 2px 2px 0 0;
  transition: color .15s, border-color .15s, background .15s;
}
.act-tab:hover{ color: var(--text); }
.act-tab.on{
  color: var(--amber);
  border-color: var(--line);
  background: var(--panel-2);
}
.act-tab .n{ font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 4px; }

.opts{ display: flex; flex-direction: column; gap: 5px; max-height: min(24vh, 200px); overflow-y: auto; }

.opt{
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  border-radius: 2px;
  padding: 9px 11px;
  text-align: left;
  font-size: 13px;
  line-height: 1.6;
  transition: background .13s, border-color .13s;
}
.opt:hover:not(:disabled){ background: var(--panel-3); border-color: var(--amber-deep); }
.opt:disabled{ opacity: .36; cursor: not-allowed; }
.opt .cost{
  flex: none;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  padding-top: 2px;
  min-width: 42px;
  text-align: right;
}
.opt.used{ opacity: .4; }
.opt.danger:hover:not(:disabled){ border-color: var(--crit); }
.opt.esc:hover:not(:disabled){ border-color: var(--signal); }

.opt-label{ flex: 1; }
.opt-sub{ display: block; font-size: 11px; color: var(--faint); margin-top: 2px; line-height: 1.55; }

.tone-row{
  display: flex;
  gap: 6px;
  padding-top: 2px;
  flex-wrap: wrap;
}
.tone{
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 7px 12px;
  font-size: 12.5px;
  flex: 1;
  min-width: 120px;
  text-align: left;
  line-height: 1.5;
}
.tone:hover{ border-color: var(--amber); background: var(--panel-3); }
.tone .tname{
  display: block;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 1px;
}

.pending-note{
  background: rgba(87,199,192,.07);
  border: 1px solid var(--signal-deep);
  border-radius: 2px;
  padding: 11px 13px;
  font-size: 12.5px;
  color: var(--signal);
  line-height: 1.7;
}

/* TGXの送り状。実在配送会社の意匠は使わず、罫線と帯だけで表現する */
.shipment{ padding:3px 1px 0; }.shipment h3{ margin:0 0 8px; font-family:var(--display); font-size:18px; letter-spacing:.1em; color:var(--amber); }.shipment-address{ margin:0 0 9px; color:var(--dim); font-size:12px; }
.waybill{ padding:12px; border:1px solid var(--signal-deep); background:var(--panel-2); position:relative; overflow:hidden; }.waybill::after{ content:""; display:block; height:16px; margin-top:11px; background:repeating-linear-gradient(90deg,var(--text) 0 2px,transparent 2px 4px,var(--signal) 4px 5px,transparent 5px 8px); opacity:.72; }
.waybill > div{ display:grid; grid-template-columns:70px 1fr; gap:8px; padding:4px 0; border-bottom:1px dotted var(--line); font-size:11px; line-height:1.45; }.waybill b{ font-family:var(--display); letter-spacing:.1em; color:var(--faint); }.waybill span{ color:var(--text); font-family:var(--mono); }.shipment-confirm{ width:100%; margin-top:10px; font-size:15px; padding:9px 12px; }

.hint-bar{
  font-size: 11.5px;
  color: var(--faint);
  line-height: 1.6;
}

/* ---------- 右：診断ボード ---------- */

.board{ overflow-y: auto; }

/* ルーター液晶。顧客の説明を聞くまでは値そのものをDOMに出さない。 */
.device-card{
  margin-bottom: 14px;
  padding: 9px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  box-shadow: inset 0 0 0 1px var(--line-soft);
}
.device-label{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.lcd{
  position: relative;
  min-height: 112px;
  padding: 9px 10px 8px;
  overflow: hidden;
  border: 1px solid var(--signal-deep);
  border-radius: 3px;
  background: var(--panel-2);
  color: var(--signal);
  font-family: var(--mono);
  font-size: 11px;
  box-shadow: inset 0 0 18px var(--ink);
}
.lcd.obscured,
.lcd.missing{
  display: grid;
  place-items: center;
  text-align: center;
  color: var(--dim);
  background: linear-gradient(135deg, var(--panel-2), var(--panel-3));
}
.lcd.obscured::before{
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(110deg, transparent 0 6px, var(--line-soft) 6px 10px);
  opacity: .68;
}
.lcd-placeholder{ position: relative; z-index: 1; line-height: 1.7; }
.lcd-placeholder b{ display: block; color: var(--text); font-weight: 500; }
.lcd-top,
.lcd-status,
.lcd-bottom{ display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lcd-status{ margin-top: 11px; }
.lcd-bottom{ margin-top: 10px; padding-top: 7px; border-top: 1px solid var(--signal-deep); }
.lcd-carrier{ font-size: 12px; font-weight: 600; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.signal-bars{ height: 17px; display: flex; align-items: flex-end; gap: 2px; flex: none; }
.signal-bars i{ display: block; width: 3px; background: var(--line); border-radius: 1px 1px 0 0; }
.signal-bars i:nth-child(1){ height: 5px; }
.signal-bars i:nth-child(2){ height: 8px; }
.signal-bars i:nth-child(3){ height: 12px; }
.signal-bars i:nth-child(4){ height: 16px; }
.signal-bars i.on{ background: var(--signal); }
.lcd-offline{ color: var(--crit); font-weight: 600; }
.lcd-sim-none{ color: var(--crit); font-size: 13px; font-weight: 600; }
.lcd-throttle{
  color: var(--amber);
  border: 1px solid var(--amber-deep);
  padding: 0 4px;
  border-radius: 2px;
  letter-spacing: .08em;
}
.lcd-clients{ color: var(--text); }
.lcd-battery{
  width: 30px;
  height: 11px;
  padding: 1px;
  border: 1px solid var(--signal-deep);
  border-radius: 1px;
  flex: none;
}
.lcd-battery i{ display: block; height: 100%; background: var(--signal); }
.lcd-battery-wrap{ display: flex; align-items: center; gap: 5px; }
.lcd-ssid{ min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }

/* 社内照会に添える単一型のメトリックバー */
.lookup-viz{
  display: block;
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--signal-deep);
}
.lookup-viz-head{ display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
.lookup-viz-head b{ color: var(--signal); font-weight: 500; }
.lookup-viz-track{ display: block; height: 5px; margin: 5px 0 3px; background: var(--line); overflow: hidden; border-radius: 1px; }
.lookup-viz-fill{ display: block; height: 100%; background: var(--signal); }
.lookup-viz-fill.over{ background: var(--crit); }
.lookup-viz-fill.unlimited{ background: repeating-linear-gradient(90deg, var(--signal) 0 8px, var(--signal-deep) 8px 12px); }
.lookup-viz-note{ color: var(--dim); font-size: 11px; }

.cause{
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 6px 6px 6px 8px;
  border-left: 2px solid var(--line-soft);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--dim);
  transition: color .2s, border-color .2s, opacity .2s;
}
.cause .tick{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  flex: none;
  width: 14px;
  text-align: center;
  padding-top: 1px;
}
.cause.out{ opacity: .32; text-decoration: line-through; text-decoration-color: var(--faint); }
.cause.hot{
  color: var(--amber);
  border-left-color: var(--amber);
  background: var(--amber-glow);
}
.cause.hot .tick{ color: var(--amber); }
.cause > span:nth-child(2){ flex: 1; min-width: 0; }
.cause .tier{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--faint);
  flex: none;
  padding-top: 2px;
  white-space: nowrap;
}

.facts{ display: flex; flex-direction: column; gap: 6px; }
.fact{
  font-size: 12px;
  line-height: 1.6;
  color: var(--text);
  padding: 7px 9px;
  background: var(--panel);
  border-left: 2px solid var(--signal-deep);
  border-radius: 2px;
}
.fact .src{
  display: block;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 1px;
}

.mini-list{ display: flex; flex-direction: column; gap: 4px; }
.mini{
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  padding: 4px 0;
  border-bottom: 1px dotted var(--line-soft);
  color: var(--dim);
}
.mini b{ color: var(--text); font-weight: 500; font-family: var(--mono); font-size: 12px; }

/* ============================================================
   オーバーレイ（ブリーフィング／シフト終了／マニュアル）
   ============================================================ */

.overlay{
  background: var(--ink);
  padding: 32px 20px 64px;
  min-height: 100vh;
  display: none;
}
.overlay.on{ display: block; }

.sheet{
  max-width: 720px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--amber);
  border-radius: 2px;
  padding: 32px 36px 36px;
}
.sheet h1{
  font-family: var(--display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .06em;
  margin: 0 0 4px;
  text-wrap: balance;
  line-height: 1.15;
}
.sheet h2{
  font-family: var(--display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--amber);
  margin: 28px 0 10px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line-soft);
}
.sheet p{ margin: 0 0 12px; max-width: 40em; }
.sheet ul{ margin: 0 0 12px; padding-left: 18px; max-width: 40em; }
.sheet li{ margin-bottom: 6px; }
.sheet .lead{ color: var(--dim); font-size: 14.5px; line-height: 1.85; }
.sheet strong{ color: var(--amber); font-weight: 500; }

.btn-primary{
  background: var(--amber);
  border: none;
  color: #17110A;
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 12px 30px;
  border-radius: 2px;
  margin-top: 22px;
  transition: filter .15s, transform .1s;
}
.btn-primary:hover{ filter: brightness(1.1); }
.btn-primary:active{ transform: translateY(1px); }

.btn-ghost{
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dim);
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 11px 22px;
  border-radius: 2px;
  margin-top: 22px;
  margin-left: 10px;
}
.btn-ghost:hover{ border-color: var(--amber-deep); color: var(--amber); }

/* デブリーフ用 */
.score-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 1px;
  background: var(--line-soft);
  border: 1px solid var(--line-soft);
  margin: 14px 0 20px;
}
.score-cell{ background: var(--panel-2); padding: 13px 14px; }
.score-cell .k{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.score-cell .v{
  font-family: var(--mono);
  font-size: 25px;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
}
.score-cell .n{ font-size: 11px; color: var(--faint); line-height: 1.5; }

.rank-badge{
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  border: 1px solid var(--amber-deep);
  background: var(--amber-glow);
  padding: 10px 22px;
  border-radius: 2px;
  margin-bottom: 6px;
}
.rank-badge .r{
  font-family: var(--display);
  font-size: 44px;
  font-weight: 700;
  color: var(--amber);
  line-height: 1;
}
.rank-badge .rt{ font-size: 14px; color: var(--text); }

.review{
  border-left: 2px solid var(--line);
  padding: 10px 0 10px 14px;
  margin-bottom: 10px;
}
.review.win{ border-left-color: var(--good); }
.review.mid{ border-left-color: var(--warn); }
.review.bad{ border-left-color: var(--crit); }
.review .rh{
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  margin-bottom: 3px;
}
.review .rn{ font-weight: 700; font-size: 14px; }
.review .rp{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--signal);
}
.review .rs{
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  margin-left: auto;
}
.review .rb{ font-size: 12.5px; color: var(--dim); line-height: 1.7; }
.review .rb em{ color: var(--amber); font-style: normal; }
.review-csat{ height: 4px; margin: 5px 0 7px; background: var(--line-soft); overflow: hidden; }
.review-csat i{ display: block; height: 100%; background: var(--good); }
.review.mid .review-csat i{ background: var(--warn); }
.review.bad .review-csat i{ background: var(--crit); }
.report-auto{ margin:14px 0; padding:11px 13px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:12px; line-height:1.75; }
.report-list{ display:flex; flex-direction:column; gap:6px; }.report-check{ display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border:1px solid var(--line-soft); background:var(--panel-2); cursor:pointer; font-size:12.5px; line-height:1.6; }.report-check:hover{ border-color:var(--amber-deep); }.report-check input{ margin-top:5px; accent-color:var(--amber); }.report-check span{ flex:1; }.report-check i{ display:block; margin-top:2px; color:var(--faint); font-size:11px; font-style:normal; }.report-check.needed{ border-left:2px solid var(--signal); }.report-miss{ margin-top:8px; padding:7px 9px; border-left:2px solid var(--crit); background:var(--crit-glow); color:var(--text); font-size:11.5px; }

.tbl{ width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th, .tbl td{
  text-align: left;
  padding: 6px 10px 6px 0;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: top;
}
.tbl th{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
  font-weight: 600;
}
.tbl td.num{ font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* トースト */
.toast-wrap{
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  max-width: 340px;
}
.toast{
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 2px solid var(--amber);
  border-radius: 2px;
  padding: 10px 14px;
  font-size: 12.5px;
  line-height: 1.6;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
  animation: slidein .25s ease;
}
.toast.crit{ border-left-color: var(--crit); }
.toast.good{ border-left-color: var(--good); }
.toast.sig{ border-left-color: var(--signal); }
.toast b{ display: block; font-family: var(--display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }

/* ---------- ライト業務画面の仕上げ ---------- */
.topbar{ background:var(--surface); box-shadow:0 1px 0 var(--line-soft),0 5px 16px rgba(21,32,43,.06); }
.brand .mark,.clock .t{ color:var(--accent); }
.world-strip{ background:var(--surface); }

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const CALLBACK_OVERDUE_MIN = 10;
const SHIP_LEVELS = [
  { id:'fast', label:'最速便', eta:'現地翌朝08:00まで', fee:18000, rank:3 },
  { id:'next', label:'翌日便', eta:'現地翌日中', fee:9000, rank:2 },
  { id:'normal', label:'通常便', eta:'2〜3日', fee:4000, rank:1 },
];
const SHIPPING_REMEDIES = new Set(['r_escalate_swap','r_escalate_band','r_transfer_logi','r_second_unit']);
let typeTimer = null;
let typingLine = null;

function typewriterOff(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function pendingTypedLine(t){ return [...t.transcript].reverse().find(x => (x.who === 'cust' || x.who === 'sys') && !x.typed); }
function finishTyping(){
  if (!typingLine) return;
  clearTimeout(typeTimer);
  const line = typingLine;
  line.typed = true;
  typingLine = null;
  document.body.classList.remove('typing');
  document.querySelector('.actions.is-typing')?.classList.remove('is-typing');
  const say = document.querySelector('.line.typing .say');
  if (say){ say.innerHTML = esc(line.text) + (line.viz ? renderLookupViz(line.viz) : ''); say.parentElement.classList.remove('typing'); }
}
function startTyping(t){
  const line = pendingTypedLine(t);
  if (!line) return;
  if (typewriterOff()){ line.typed = true; renderCall(); return; }
  typingLine = line;
  document.body.classList.add('typing');
  const say = document.querySelector('.line.typing .say');
  if (!say) return finishTyping();
  let pos = 0;
  const step = () => {
    if (typingLine !== line) return;
    pos++;
    say.textContent = line.text.slice(0, pos);
    if (pos >= line.text.length){ finishTyping(); return; }
    typeTimer = setTimeout(step, /[、。！？!?]/.test(line.text[pos - 1]) ? 175 : 25);
  };
  typeTimer = setTimeout(step, 25);
}

const state = {
  phase: 'briefing',
  turn: 0,
  clock: SHIFT_START,
  tickets: [],
  focus: null,          // 表示中のチケット
  escLeft: ESCALATIONS,
  callbacksLeft: CALLBACKS,
  cost: 0,
  outageKnown: false,
  holdVisual: false,
  busy: false,
  ui: { tab: 'ask', cause: null, remedy: null, lookup: null, boardExcludedOpen: false },
  officeQueueOpen: false,
  report: null,
};

/* ---------- 時刻 ---------- */

function fmtClock(min){
  const h = Math.floor(min / 60) % 24;
  const m = min % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function localClock(t){
  return fmtClock(((state.clock + t.s.localOffset * 60) % 1440 + 1440) % 1440);
}

function daylightMix(utcOffset){
  const utc = state.clock - 9 * 60;
  const local = ((utc + utcOffset * 60) % 1440 + 1440) % 1440;
  const hour = local / 60;
  const sun = (hour > 6 && hour < 18) ? Math.sin((hour - 6) / 12 * Math.PI) : 0;
  return Math.round(7 + sun * 61);
}

function renderWorldStrip(){
  const strip = $('world-strip');
  if (!strip) return;

  const stops = [];
  for (let i = 0; i <= 48; i++){
    const offset = -12 + i / 2;
    const pos = i / 48 * 100;
    stops.push('color-mix(in srgb, var(--amber) ' + daylightMix(offset) + '%, var(--panel-3)) ' + pos.toFixed(2) + '%');
  }

  const seen = new Map();
  const pins = state.tickets.filter(t => t.state !== 'inbound').map(t => {
    const utcOffset = 9 + t.s.localOffset;
    const pos = clamp((utcOffset + 12) / 24 * 100, 0, 100);
    const key = pos.toFixed(3);
    const stack = seen.get(key) || 0;
    seen.set(key, stack + 1);

    let cls = 'closed';
    if (t.state === 'waiting') cls = 'waiting';
    else if (t.state === 'open') cls = 'active';
    else if (t.state === 'callback') cls = 'callback';
    else if (t.result && t.result.kind === 'abandoned') cls = 'abandoned';

    const status = cls === 'waiting' ? '待ち中' : cls === 'active' ? '通話中' : cls === 'callback' ? '折り返し待ち' : cls === 'abandoned' ? '放棄呼' : '完了';
    return '<span class="world-pin ' + cls + '" style="left:' + pos.toFixed(2) + '%;--stack:' + stack + '" ' +
      'title="' + esc(t.s.city) + ' ' + esc(localClock(t)) + ' ' + status + '" aria-label="' + esc(t.s.city) + ' ' + status + '">' +
      '<i class="world-pin-dot"></i><span class="world-pin-label">' + esc(t.s.id) + '</span></span>';
  }).join('');

  strip.innerHTML =
    '<div class="world-sky" style="background:linear-gradient(90deg,' + stops.join(',') + ')"></div>' +
    '<div class="world-axis">' +
      '<span class="world-zone-label first">UTC−12</span>' +
      '<span class="world-zone-label mid">UTC</span>' +
      '<span class="world-zone-label last">UTC+12</span>' +
      '<span class="world-jst"><span>JST</span></span>' + pins +
    '</div>';
}

/* ---------- 初期化 ---------- */

function newTicket(s){
  return {
    s, state:'inbound', patience:100, arrivedTurn:s.arrive,
    facts:[], asked:new Set(), lookedUp:new Set(), tested:new Set(),
    transcript:[], callMinutes:0, holdMinutes:0,
    callbackCount:0, callbackDue:null, callbackLate:false,
    stayAddress:null, shipment:null,
    misdiagnoses:0, damage:0, wasted:0, result:null, escUsed:false,
  };
}

function resetGame(){
  state.phase = 'briefing';
  state.turn = 0;
  state.clock = SHIFT_START;
  state.tickets = SCENARIOS.map(newTicket);
  state.focus = null;
  state.escLeft = ESCALATIONS;
  state.callbacksLeft = CALLBACKS;
  state.cost = 0;
  state.outageKnown = false;
  state.holdVisual = false;
  state.busy = false;
  state.ui = { tab:'ask', cause:null, remedy:null, lookup:null, boardExcludedOpen:false };
  state.officeQueueOpen = false;
  state.report = null;
}

/* ---------- トースト ---------- */

function toast(title, body, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.innerHTML = '<b>' + esc(title) + '</b>' + esc(body);
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; }, 5200);
  setTimeout(() => el.remove(), 5700);
}

/* ---------- ターン進行 ---------- */

function advance(turns){
  for (let i = 0; i < turns; i++){
    state.turn++;
    state.clock += TURN_MIN;

    // すでに待っている呼だけが、この1分の待ち時間を消費する
    state.tickets.forEach(t => {
      if (t.state === 'waiting') t.patience -= 100 / t.s.abandonAfter;
      else if (t.state === 'callback' && state.clock > t.callbackDue) t.patience -= 100 / CALLBACK_OVERDUE_MIN;

      if (t.patience <= 0 && (t.state === 'waiting' || t.state === 'callback')){
        t.patience = 0;
        t.state = 'closed';
        t.result = { kind:'abandoned', csat:0, label:'放棄呼', firstCallResolved:false };
        toast('放棄呼', '呼び出しに応答できず、切られました', 'crit');
      }
    });

    // この分に到着した呼は、次の1分から待ち時間を消費する
    state.tickets.forEach(t => {
      if (t.state === 'inbound' && t.arrivedTurn <= state.turn){
        t.state = 'waiting';
        t.transcript.push({ who:'cust', text:t.s.opening });
        toast('着信', t.s.name + '（' + t.s.city + '）', t.s.abandonAfter <= 20 ? 'crit' : '');
      }
    });
  }
}

function addFact(t, fact, src){
  t.facts.push({ text:fact.text, src:src, out:fact.out || [], hot:fact.hot || [] });
}

/* ---------- 広域障害の判明（シフトの山場） ---------- */

function triggerOutage(origin){
  if (state.outageKnown) return;
  state.outageKnown = true;
  toast('障害情報', '北東部の広域障害を確認。同一エリアの他チケットにも当てはまります', 'sig');

  state.tickets.forEach(t => {
    if (t === origin) return;
    if (t.s.trueCause !== 'carrier') return;
    if (t.state === 'closed') return;
    t.transcript.push({ who:'sys', text:'[全社通知] 米国北東部 提携キャリアの広域障害を確認。同一エリアからの入電はこの障害による可能性が高い。' });
    addFact(t, { text:'同じエリアで広域障害が確認された', hot:['carrier'], out:['sim','coverage','provision','device_side','device_net'] }, '全社通知');
  });
}

/* ---------- プレイヤーの行動 ---------- */

function pickup(t){
  if (state.focus){ toast('通話中', '通話中です。いまの電話を終えないと次を取れません', 'crit'); return; }
  t.state = 'open';
  t.transcript.push({ who:'note', text:'通話を開始しました。' });
  state.focus = t;
  state.ui = { tab:'ask', cause:null, remedy:null, lookup:null };
  enterCall();
}

function resumeCallback(t){
  if (state.focus){ toast('通話中', '通話中です。いまの電話を終えないと次を取れません', 'crit'); return; }
  if (!t || t.state !== 'callback') return;
  t.callbackLate = t.callbackLate || state.clock > t.callbackDue;
  t.state = 'open';
  t.transcript.push({ who:'note', text:t.callbackLate ? '約束時刻を過ぎて折り返しました。' : '約束時刻内に折り返し、通話を再開しました。' });
  state.focus = t;
  state.ui = { tab:'ask', cause:null, remedy:null, lookup:null };
  enterCall();
}

function spendOnCall(t, minutes, holdMinutes){
  t.callMinutes += minutes;
  t.holdMinutes += holdMinutes || 0;
  advance(minutes);
}

function doAsk(qid){
  const t = state.focus;
  const q = QUESTIONS.find(x => x.id === qid);
  t.asked.add(qid);
  t.transcript.push({ who:'me', text:q.label });

  const r = (t.s.replies || {})[qid];
  if (r){
    t.transcript.push({ who:'cust', text:r.text });
    if (r.fact) addFact(t, r.fact, '聞き取り');
    if (qid === 'q_stay') t.stayAddress = r.text;
  } else {
    t.transcript.push({ who:'cust', text:q.miss });
    t.wasted++;
  }
  if (t.s.techPenalty && !r) t.wasted++;   // 機器が手元にない相手への技術質問は二重に無駄

  spendOnCall(t, 1, 0);
  render();
}

function doLookup(lid, mode){
  const t = state.focus;
  if (!t || state.busy || !['hold','talk'].includes(mode)) return;
  const l = LOOKUPS.find(x => x.id === lid);
  if (!l || t.lookedUp.has(lid)) return;
  const minutes = mode === 'hold' ? 2 : 3;
  const hold = mode === 'hold' ? 2 : 0;

  state.busy = true;
  state.holdVisual = mode === 'hold';
  t.transcript.push({ who:'note', text:mode === 'hold' ? 'お客さまを保留にして社内照会を始めました。' : 'お客さまと話しながら社内照会を始めました。' });
  render();

  setTimeout(() => finishLookup(t, l, minutes, hold), mode === 'hold' ? 420 : 0);
}

function finishLookup(t, l, minutes, hold){
  if (state.focus !== t || t.state !== 'open'){
    state.busy = false;
    state.holdVisual = false;
    return;
  }
  const lid = l.id;
  t.lookedUp.add(lid);

  const r = (t.s.lookups || {})[lid];
  if (r){
    t.transcript.push({ who:'sys', text:r.text, viz:r.viz || null });
    if (r.fact) addFact(t, r.fact, '社内照会');
    if (r.outage) triggerOutage(t);
  } else {
    t.transcript.push({ who:'sys', text:l.miss });
    if (l.missFact) addFact(t, l.missFact, '社内照会');
    else t.wasted++;
  }

  spendOnCall(t, minutes, hold);
  state.busy = false;
  state.holdVisual = false;
  state.ui.lookup = null;
  render();
}

function doTest(tid){
  const t = state.focus;
  const risky = RISKY.find(x => x.id === tid);
  const test = risky || TESTS.find(x => x.id === tid);
  if (!t || !test || t.tested.has(tid)) return;
  t.tested.add(tid);
  t.transcript.push({ who:'me', text:test.label });
  t.transcript.push({ who:'note', text:test.wait + '（所要' + test.turns + '分。通話はつないだままです）' });

  const def = risky ? null : (t.s.tests || {})[tid];
  spendOnCall(t, test.turns, 0);

  if (risky){
    t.transcript.push({ who:'cust', text:risky.result });
    t.transcript.push({ who:'note', text:'【まずい対応】' + risky.note });
    t.damage += risky.damage;
    toast('悪化', t.s.name + ' の状況が悪くなりました', 'crit');
  } else if (def){
    t.transcript.push({ who:'cust', text:def.text });
    if (def.fact) addFact(t, def.fact, '操作の結果');
    if (def.solves) t.transcript.push({ who:'note', text:'この操作で症状が解消しました。原因を確定して案内できます。' });
    toast('結果', t.s.name + ' の操作が終わりました', 'sig');
  } else {
    t.transcript.push({ who:'cust', text:'やってみましたが、変わりませんでした。' });
    t.wasted++;
  }
  render();
}

function doCallback(){
  const t = state.focus;
  if (!t || state.callbacksLeft <= 0 || state.busy) return;
  t.transcript.push({ who:'me', text:'一度お切りして、調べてから折り返します。30分以内にご連絡します。' });
  t.callbackCount++;
  state.callbacksLeft--;
  spendOnCall(t, 1, 0);
  t.callbackDue = state.clock + 30;
  t.state = 'callback';
  state.focus = null;
  state.ui = { tab:'ask', cause:null, remedy:null, lookup:null };
  toast('折り返し', t.s.name + ' と30分以内の折り返しを約束しました', 'sig');
  enterOffice();
}

/* ---------- TGX 国際配送 ---------- */

function shipLevel(id){ return SHIP_LEVELS.find(x => x.id === id); }
function remedyNeedsShipping(id){ return SHIPPING_REMEDIES.has(id); }
function startShipping(remedyId){
  const t = state.focus;
  if (!t) return;
  if (!t.stayAddress){
    t.transcript.push({ who:'note', text:'配送先が未確認です。手配を中断して滞在先を確認します。' });
    spendOnCall(t, 2, 0);
    state.ui = { tab:'ask', cause:null, remedy:null, lookup:null };
    toast('TGX手配中断', '配送先が未確認です', 'crit');
    render();
    return;
  }
  state.ui.shipping = { remedyId, level:null };
  render();
}

function shipmentEta(t, level){
  const local = state.clock + t.s.localOffset * 60;
  const day = Math.floor(local / 1440) * 1440;
  if (level.id === 'fast'){
    let eta = day + 8 * 60;
    if (eta <= local) eta += 1440;
    return eta;
  }
  if (level.id === 'next') return day + 1440 + 18 * 60;
  return local + 60 * 60;
}

function shipmentAwb(t){
  return 'TGX-' + String(Number(t.s.id.slice(1))).padStart(4,'0') + '-' + String(state.clock % 10000).padStart(4,'0');
}

function chooseShipLevel(id){
  const level = shipLevel(id);
  if (!state.ui.shipping || !level) return;
  state.ui.shipping.level = id;
  render();
}

function confirmShipment(){
  const t = state.focus;
  const ship = state.ui.shipping;
  const level = ship && shipLevel(ship.level);
  if (!t || !ship || !level) return;
  const need = shipLevel(t.s.shipNeed);
  const eta = shipmentEta(t, level);
  t.shipment = { remedyId:ship.remedyId, level:level.id, label:level.label, fee:level.fee, awb:shipmentAwb(t), eta, tooSlow:need ? level.rank < need.rank : false };
  state.cost += level.fee;
  t.transcript.push({ who:'me', text:'TGX の追跡番号 ' + t.shipment.awb + ' で手配しました。現地時間の' + fmtClock(eta) + 'までにホテルへお届けします。' });
  state.ui.shipping = null;
  toast('TGX手配', t.s.name + ' 宛てに' + level.label + 'を確定しました', 'sig');
  render();
}

function renderShipping(t){
  const ship = state.ui.shipping;
  const level = ship && shipLevel(ship.level);
  if (!level){
    return '<div class="shipment"><p class="eyebrow">TRANSGLOBE EXPRESS ／ TGX</p><h3>国際配送の手配</h3><p class="shipment-address">届け先：' + esc(t.stayAddress) + '</p><div class="opts">' + SHIP_LEVELS.map(x =>
      '<button class="opt" data-ship-level="' + x.id + '"><span class="opt-label">' + x.label + '<span class="opt-sub">' + x.eta + '</span></span><span class="cost">¥' + x.fee.toLocaleString('ja-JP') + '</span></button>'
    ).join('') + '</div></div>';
  }
  const eta = shipmentEta(t, level), awb = shipmentAwb(t);
  return '<div class="shipment"><p class="eyebrow">TRANSGLOBE EXPRESS ／ TGX</p><h3>送り状を確認</h3><div class="waybill"><div><b>AWB No.</b><span>' + awb + '</span></div><div><b>発送元</b><span>現地デポ（' + esc(t.s.city) + '）</span></div><div><b>届け先</b><span>' + esc(t.stayAddress) + '</span></div><div><b>内容品</b><span>レンタル用モバイルWiFiルーター 1台（返送予定品）</span></div><div><b>サービス</b><span>' + esc(level.label) + ' ／ ' + esc(level.eta) + '</span></div><div><b>到着目安</b><span>現地 ' + fmtClock(eta) + '</span></div></div><button class="btn-primary shipment-confirm" data-ship-confirm="1">TGXへ手配を確定する</button></div>';
}

/* ---------- クローズ判定 ---------- */

function toneLabel(id){ const x = TONES.find(t => t.id === id); return x ? x.name : id; }

function doClose(causeId, remedyId, toneId){
  const t = state.focus;
  const s = t.s;
  const remedy = (REMEDIES[causeId] || []).find(r => r.id === remedyId);

  t.transcript.push({ who:'me', text:'【' + toneLabel(toneId) + '】' + remedy.label });
  spendOnCall(t, 2, 0);

  // ---- 誤診 ----
  if (causeId !== s.trueCause){
    t.misdiagnoses++;
    if (remedy.cost) state.cost += remedy.cost;
    if (remedy.kind === 'escalate'){ state.escLeft--; t.escUsed = true; }

    if (t.misdiagnoses >= 2){
      t.transcript.push({ who:'cust', text:'…もういいです。上の方に代わってもらえますか。' });
      t.transcript.push({ who:'note', text:'上長が引き取り、正しい原因（' + causeName(s.trueCause) + '）で対応を引き継ぎました。' });
      closeTicket(t, { kind:'supervisor', csat:1.5, label:'上長が引き取り' });
      toast('引き取り', t.s.name + ' の対応を上長が引き取りました', 'crit');
    } else {
      t.transcript.push({ who:'cust', text:'言われたとおりにしましたが、やっぱり直りません。まだ繋がらないんですけど。' });
      t.transcript.push({ who:'note', text:'原因の見立てが外れていました。もう一度切り分けをやり直せます。' });
      t.patience -= 20;
      t.state = 'open';
      state.ui = { tab:'ask', cause:null, remedy:null, lookup:null };
      advance(2);
      toast('再入電', t.s.name + ' の症状が解消していません', 'crit');
    }
    render();
    return;
  }

  // ---- 原因は正しい ----
  if (remedy.cost) state.cost += remedy.cost;
  if (remedy.kind === 'escalate'){ state.escLeft--; t.escUsed = true; }

  let bestId = s.best;
  if (s.bestNoOutage && !state.outageKnown) bestId = s.bestNoOutage;

  let base, grade;
  if (remedyId === bestId){ base = 5.0; grade = 'best'; }
  else if ((s.partial || []).includes(remedyId)){ base = 3.5; grade = 'partial'; }
  else { base = 2.2; grade = 'poor'; }

  const wantTone = TYPES[s.type].tone;
  const toneOk = (toneId === wantTone);
  if (!toneOk) base -= 1.0;

  base -= t.damage;
  base -= t.misdiagnoses * 1.2;
  base -= Math.min(0.6, t.wasted * 0.1);
  base -= patiencePenalty(t.patience);
  base -= holdPenalty(t.holdMinutes);
  if (t.callbackCount > 0) base -= t.callbackLate ? 1.5 : 0.5;
  if (t.shipment && t.shipment.remedyId === remedyId && t.shipment.tooSlow) base -= 1.0;

  const csat = clamp(Math.round(base * 10) / 10, 1.0, 5.0);

  t.transcript.push({ who:'cust', text:closingLine(s, grade, toneOk) });
  closeTicket(t, { kind:'closed', csat, grade, toneOk, remedyId, causeId, toneId,
    firstCallResolved:grade === 'best' && t.callbackCount === 0 && t.misdiagnoses === 0, label:gradeLabel(grade) });
  toast('クローズ', t.s.name + ' ／ CSAT ' + csat.toFixed(1), csat >= 4 ? 'good' : (csat >= 3 ? '' : 'crit'));
  render();
}

function holdPenalty(minutes){
  if (minutes <= 0) return 0;
  if (minutes <= 4) return 0.2;
  if (minutes <= 8) return 0.5;
  return 1.0;
}

function patiencePenalty(p){
  if (p >= 80) return 0;
  if (p >= 60) return 0.3;
  if (p >= 40) return 0.7;
  if (p >= 20) return 1.2;
  return 1.8;
}

function gradeLabel(g){
  return g === 'best' ? '解決' : (g === 'partial' ? '暫定対応' : '不適切な対処');
}

function closingLine(s, grade, toneOk){
  if (grade === 'best'){
    if (!toneOk){
      const t = TYPES[s.type].tone;
      if (t === 'warm')      return 'あ…はい。たぶん、繋がったと思います。よく分からないですけど、ありがとうございます。';
      if (t === 'technical') return 'まあ、直ったのでいいですけど。そこまで噛み砕かなくても分かりますよ。';
      return 'ええ、分かりました。分かりましたから、大丈夫です。もう行きますね。';
    }
    return {
      anxious:'繋がりました！ ああ、よかった…。丁寧に聞いてくださって、本当に助かりました。',
      novice:'あら、直りました。ゆっくり教えてくださって助かりましたよ。ありがとうございます。',
      expert:'なるほど、そういうことですか。話が早くて助かりました。ありがとうございます。',
      hurried:'お、繋がった。ありがとう、助かりました。',
    }[s.type];
  }
  if (grade === 'partial') return 'ええと…はい、分かりました。とりあえずそれで様子を見てみます。';
  return 'それ、本当に直るんですか…？ 言われたとおりにはしてみますけど。';
}

function closeTicket(t, result){
  t.state = 'closed';
  t.result = result;
  if (state.focus === t) state.focus = null;
  state.ui = { tab:'ask', cause:null, remedy:null, lookup:null };
  checkShiftEnd();
  if (state.phase === 'office') return;
}

function causeName(id){
  const c = CAUSES.find(x => x.id === id);
  return c ? c.label : id;
}

function checkShiftEnd(){
  const live = state.tickets.some(t => t.state !== 'closed');
  if (!live){ state.phase = 'report'; renderReport(); }
  else { enterOffice(); }
}

/* ============================================================
   描画
   ============================================================ */

function render(){
  if (state.phase === 'office'){ renderOffice(); return; }
  if (state.phase !== 'call') return;
  $('clock').textContent = fmtClock(state.clock);
  renderWorldStrip();
  renderKpis();
  renderQueue();
  renderCall();
  renderBoard();
}

function metrics(){
  const finished = state.tickets.filter(t => t.result);
  const answered = finished.filter(t => t.result.kind !== 'abandoned');
  const abandoned = finished.filter(t => t.result.kind === 'abandoned').length;
  const csats = answered.map(t => t.result.csat);
  const csat = csats.length ? csats.reduce((a,b) => a+b, 0) / csats.length : null;
  const fcrCount = answered.filter(t => t.result.firstCallResolved).length;
  const fcr = answered.length ? fcrCount / answered.length : null;
  const answerRate = (state.tickets.length - abandoned) / state.tickets.length;
  const handled = state.tickets.filter(t => t.callMinutes > 0);
  const aht = handled.length ? handled.reduce((n,t) => n + t.callMinutes, 0) / handled.length : null;
  return { finished, answered, abandoned, csat, fcrCount, fcr, answerRate, aht };
}

function renderKpis(){
  const m = metrics();

  $('kpis').innerHTML = [
    kpi('CSAT', m.csat === null ? '—' : m.csat.toFixed(1), m.csat === null ? '' : (m.csat >= 4 ? 'good' : m.csat >= 3 ? 'warn' : 'crit')),
    kpi('一次解決率', m.fcr === null ? '—' : Math.round(m.fcr * 100) + '%', m.fcr === null ? '' : (m.fcr >= .75 ? 'good' : m.fcr >= .5 ? 'warn' : 'crit')),
    kpi('応答率', Math.round(m.answerRate * 100) + '%', m.answerRate >= .9 ? 'good' : m.answerRate >= .75 ? 'warn' : 'crit'),
    kpi('AHT', m.aht === null ? '—' : m.aht.toFixed(1) + '分', ''),
    kpi('費用', '¥' + state.cost.toLocaleString('ja-JP'), state.cost >= 40000 ? 'crit' : state.cost > 0 ? 'warn' : ''),
  ].join('');
}
function kpi(k, v, cls){
  return '<div class="kpi"><span class="k">' + k + '</span><span class="v ' + cls + '">' + esc(v) + '</span></div>';
}

function renderQueue(){
  const q = state.tickets.filter(t => t.state === 'waiting')
    .sort((a,b) => a.patience - b.patience);
  const callbacks = state.tickets.filter(t => t.state === 'callback');
  const longest = q.length ? Math.max(0, ...q.map(t => state.turn - t.arrivedTurn)) : 0;
  $('queue-count').textContent = q.length + '件';
  $('call-summary').innerHTML = '<b>待ち ' + q.length + '件 ／ 最長 ' + longest + '分</b><br>折り返し待ち <b>' + callbacks.length + '件</b><br><span class="hint-bar">通話中は個別の電話を取れません。保留時間と待ち行列を見比べて判断してください。</span>';
  $('queue-hint').innerHTML = '詳しい着信一覧と折り返しは、終話後にオフィスの自席から確認できます。';
}

function queueCard(t){
  const waited = state.turn - t.arrivedTurn;
  const wcls = t.patience < 35 ? 'crit' : t.patience < 60 ? 'long' : '';
  const mcls = t.patience < 35 ? 'low' : t.patience < 60 ? 'mid' : '';
  return '<button class="qcard ' + (t.patience < 35 ? 'urgent' : '') + '" data-pick="' + t.s.id + '">' +
    '<span class="qcard-top"><span class="tid mono">' + t.s.id + ' / ' + esc(t.s.device) + '</span><span class="wait mono ' + wcls + '">呼び出し ' + waited + '分</span></span>' +
    '<span class="name">' + esc(t.s.name) + '<span class="mono" style="color:var(--faint);font-size:11px"> ' + t.s.age + '</span></span>' +
    '<span class="place">' + esc(t.s.cityEn) + ' <span class="mono" style="text-transform:none;letter-spacing:0;color:var(--faint)">現地 ' + localClock(t) + '</span></span>' +
    '<span class="snip">' + esc(t.s.opening) + '</span><span class="mood"><i class="' + mcls + '" style="width:' + Math.max(0, t.patience) + '%"></i></span></button>';
}

function renderOffice(){
  document.body.classList.add('office-view');
  document.body.classList.remove('call-view');
  $('clock').textContent = fmtClock(state.clock);
  $('office-clock').textContent = fmtClock(state.clock);
  renderWorldStrip(); renderKpis();
  const waiting = state.tickets.filter(t => t.state === 'waiting').sort((a,b) => a.patience - b.patience);
  const callbacks = state.tickets.filter(t => t.state === 'callback').sort((a,b) => a.callbackDue - b.callbackDue);
  const shipments = state.tickets.filter(t => t.shipment).length;
  $('office-phone').classList.toggle('ringing', waiting.length > 0);
  $('office-phone-status').textContent = waiting.length ? '着信 ' + waiting.length + '件' : '着信待ち';
  $('office-sv').classList.toggle('busy', state.escLeft === 0);
  $('office-sv-status').textContent = state.escLeft ? 'ESC枠 ' + state.escLeft + ' / ' + ESCALATIONS : '別件対応中';
  $('office-ship-status').textContent = '手配 ' + shipments + '件 ／ 費用 ¥' + state.tickets.reduce((n,t) => n + (t.shipment ? t.shipment.fee : 0), 0).toLocaleString('ja-JP');
  $('office-tray-status').textContent = callbacks.length ? '折り返し待ち ' + callbacks.length + '件 ／ 最短 ' + fmtClock(callbacks[0].callbackDue) : '折り返し待ち 0件';
  $('office-notice').innerHTML = state.outageKnown ? '<div class="notice">米国北東部：提携キャリアの広域障害<br>復旧見込み 未定</div>' : '<div class="blank">特記事項なし</div>';
  $('office-queue-count').textContent = waiting.length + '件';
  $('office-queue').innerHTML = waiting.length ? waiting.map(queueCard).join('') : '<p class="empty-note">着信はありません。</p>';
  $('office-callback-count').textContent = callbacks.length + ' ／ 残枠' + state.callbacksLeft;
  $('office-callbacks').innerHTML = callbacks.length ? callbacks.map(t => {
    const left = t.callbackDue - state.clock, overdue = left < 0;
    return '<button class="callback-card ' + (overdue ? 'overdue' : '') + '" data-callback-pick="' + t.s.id + '"><b>' + esc(t.s.name) + '</b><span>約束 ' + fmtClock(t.callbackDue) + ' まで（' + (overdue ? '約束超過 ' + Math.abs(left) + '分' : 'あと' + left + '分') + '）</span></button>';
  }).join('') : '<p class="empty-note" style="padding:7px 3px">折り返し待ちはありません。</p>';
  $('office-incoming').hidden = !state.officeQueueOpen;
  $('office-next').disabled = !waiting.length;
}

function enterOffice(){
  state.phase = 'office'; state.officeQueueOpen = false; renderOffice();
}
function enterCall(){
  state.phase = 'call'; state.officeQueueOpen = false;
  document.body.classList.remove('office-view'); document.body.classList.add('call-view'); render();
}

function renderCall(){
  const t = state.focus;
  $('line-state').textContent = t ? '通話中' : '待機';
  $('call').classList.toggle('on-hold', !!(t && state.holdVisual));
  if (!t){
    $('call').innerHTML = '<div class="transcript"><p class="empty-note">' +
      '左の着信キューから電話を取るか、<br>約束した相手へ折り返してください。</p></div>';
    return;
  }

  const ty = TYPES[t.s.type];
  const remaining = CAUSES.length - ruledOut(t).size;
  const guide = !t.facts.length
    ? 'まだ手がかりがありません。まず「聞き取り」から始めてください。'
    : remaining <= 2
      ? '候補が' + remaining + 'つまで絞れています。診断に進めます。'
      : '手がかりをもとに候補を絞り込み中です。聞き取りか社内照会を続けてください。';
  const head =
    '<div class="call-head">' +
      '<span class="cname">' + esc(t.s.name) + '</span>' +
      '<span class="ctype">' + esc(ty.label) + '</span>' +
      (state.holdVisual ? '<span class="hold-state">保留中</span>' : '') +
      '<span class="call-time">通話 ' + String(t.callMinutes).padStart(2,'0') + '分／うち保留 ' + String(t.holdMinutes).padStart(2,'0') + '分</span>' +
      '<span class="call-meta">' +
        '<span><b>チケット</b> ' + t.s.id + '</span>' +
        '<span><b>渡航先</b> ' + esc(t.s.city) + ' 現地 ' + localClock(t) + '</span>' +
        '<span><b>機種</b> ' + esc(t.s.device) + '</span>' +
        '<span><b>プラン</b> ' + esc(t.s.plan) + '</span>' +
        '<span><b>機嫌</b> ' + Math.round(t.patience) + '%</span>' +
      '</span>' +
      '<p class="call-guide">' + guide + '</p>' +
    '</div>';

  const lines = t.transcript.map(l => {
    const who = { cust:'客', me:'あなた', sys:'社内システム', note:'メモ' }[l.who];
    const typing = (l.who === 'cust' || l.who === 'sys') && !l.typed;
    return '<div class="line ' + l.who + (typing ? ' typing' : '') + '"><span class="who">' + who + '</span>' +
      '<span class="say">' + (typing ? '' : esc(l.text) + (l.viz ? renderLookupViz(l.viz) : '')) + '</span></div>';
  }).join('');

  $('call').innerHTML = head + '<div class="transcript" id="transcript">' + lines + '</div>' + renderActions(t);

  const tr = $('transcript');
  if (tr) tr.scrollTop = tr.scrollHeight;
  startTyping(t);
}

function renderActions(t){
  if (state.busy){
    return '<div class="actions"><div class="pending-note">社内照会中です。通話はつながったまま、時間が自動で進みます。</div></div>';
  }
  if (state.ui.shipping) return '<div class="actions">' + renderShipping(t) + '</div>';

  const tab = state.ui.tab;
  const tabs = [
    ['ask', '聞き取り', QUESTIONS.length - t.asked.size],
    ['lookup', '社内照会', LOOKUPS.length - t.lookedUp.size],
    ['test', '操作の依頼', null],
    ['close', '診断して案内する', null],
  ].map(([id, name, n]) =>
    '<button class="act-tab ' + (tab === id ? 'on' : '') + '" data-tab="' + id + '">' + name +
    (n !== null ? '<span class="n">' + n + '</span>' : '') + '</button>'
  ).join('');

  let body = '';
  if (tab === 'ask'){
    body = '<div class="opts">' + QUESTIONS.map(q =>
      '<button class="opt" data-ask="' + q.id + '" ' + (t.asked.has(q.id) ? 'disabled' : '') + '>' +
      '<span class="opt-label">' + esc(q.label) + '</span><span class="cost">1分</span></button>'
    ).join('') + '</div>' +
    '<p class="hint-bar">聞き取りは1回1分。空振りの質問も同じだけ通話が延び、待っている客が切りやすくなります。</p>';
  }
  else if (tab === 'lookup'){
    if (!state.ui.lookup){
      body = '<div class="opts">' + LOOKUPS.map(l =>
        '<button class="opt" data-lookup="' + l.id + '" ' + (t.lookedUp.has(l.id) ? 'disabled' : '') + '>' +
        '<span class="opt-label">' + esc(l.label) + '</span></button>'
      ).join('') + '</div><p class="hint-bar">照会項目を選んだあと、保留にするか話しながら調べるかを選びます。</p>';
    } else {
      const l = LOOKUPS.find(x => x.id === state.ui.lookup);
      body = '<div class="opts"><button class="opt" data-lookup-back="1"><span class="opt-label">← 照会項目の選び直し</span></button>' +
        '<button class="opt" data-lookup-mode="hold"><span class="opt-label">保留にして調べる<span class="opt-sub">相手を待たせるが速い</span></span><span class="cost">2分</span></button>' +
        '<button class="opt" data-lookup-mode="talk"><span class="opt-label">話しながら調べる<span class="opt-sub">相手を待たせないが通話が長引く</span></span><span class="cost">3分</span></button></div>' +
        '<p class="hint-bar">照会: ' + esc(l.label) + '</p>';
    }
  }
  else if (tab === 'test'){

      '<button class="opt" data-test="' + x.id + '" ' + (t.tested.has(x.id) ? 'disabled' : '') + '>' +

    ).join('');
    const risky = RISKY.map(x =>
      '<button class="opt danger" data-test="' + x.id + '" ' + (t.tested.has(x.id) ? 'disabled' : '') + '>' +
      '<span class="opt-label">' + esc(x.label) + '</span><span class="cost">' + x.turns + '分</span></button>'
    ).join('');
    body = '<div class="opts">' + safe +
      '<p class="hint-bar" style="margin:6px 0 2px">— 以下は本体や端末の設定を壊しうる操作です —</p>' +
      risky + '</div>' +
      '<p class="hint-bar">操作が終わるまで通話をつないだまま待ち、所要時間は自動で進みます。</p>';
  }
  else {
    body = renderCloseFlow(t);
  }

  const callback = '<div class="opts"><button class="opt esc" data-callback="1" ' + (state.callbacksLeft <= 0 ? 'disabled' : '') + '>' +
    '<span class="opt-label">一度お切りして、調べてから折り返す<span class="opt-sub">枠を1つ消費。待っている電話を先に捌けるが、一次解決にはならない</span></span>' +
    '<span class="cost">残' + state.callbacksLeft + '枠</span></button></div>';
  return '<div class="actions' + (pendingTypedLine(t) ? ' is-typing' : '') + '">' + callback + '<div class="act-tabs">' + tabs + '</div>' + body + '</div>';
}

function renderCloseFlow(t){
  const ruled = ruledOut(t);
  const hot = hotCauses(t);

  if (!state.ui.cause){
    return '<div class="opts">' + CAUSES.map(c => {
      const out = ruled.has(c.id);
      const isHot = hot.has(c.id);
      return '<button class="opt ' + (out ? 'used' : '') + '" data-cause="' + c.id + '">' +
        '<span class="opt-label">' + (isHot ? '● ' : '') + esc(c.label) +
        '<span class="opt-sub">' + c.tier + (out ? ' ／ 集めた情報とは噛み合いません' : (isHot ? ' ／ 手がかりが指しています' : '')) + '</span></span>' +
        '</button>';
    }).join('') + '</div>' +
    '<p class="hint-bar">原因を選ぶと、その原因に対する対処が出ます。外すと再入電になります。</p>';
  }

  const cause = CAUSES.find(c => c.id === state.ui.cause);
  const list = REMEDIES[state.ui.cause] || [];

  if (!state.ui.remedy){
    return '<div class="opts">' +
      '<button class="opt" data-cause="__back"><span class="opt-label">← 原因の選び直し</span></button>' +
      list.map(r => {
        const blockedEsc = r.kind === 'escalate' && state.escLeft <= 0;
        const blockedOut = r.needsOutage && !state.outageKnown;
        const dis = blockedEsc || blockedOut;
        let sub = r.sub || '';
        if (blockedEsc) sub = 'エスカレーション枠を使い切っています';
        if (blockedOut) sub = '障害の裏付けが取れていないため、この案内はできません';
        return '<button class="opt ' + (r.kind === 'escalate' ? 'esc' : '') + '" data-remedy="' + r.id + '" ' + (dis ? 'disabled' : '') + '>' +
          '<span class="opt-label">' + esc(r.label) + '<span class="opt-sub">' + esc(sub) + '</span></span>' +
          '<span class="cost">' + (r.cost ? '¥' + r.cost.toLocaleString('ja-JP') : '—') + '</span></button>';
      }).join('') + '</div>' +
      '<p class="hint-bar">診断: ' + esc(cause.label) + '</p>';
  }

  if (state.ui.remedy && remedyNeedsShipping(state.ui.remedy) && (!t.shipment || t.shipment.remedyId !== state.ui.remedy)){
    return '<div class="pending-note">配送手配を完了してから、客への案内を選びます。</div>';
  }

  const ty = TYPES[t.s.type];
  return '<div class="tone-row">' + TONES.map(tn =>
    '<button class="tone" data-tone="' + tn.id + '"><span class="tname">' + tn.name + '</span>' + esc(tn.sub) + '</button>'
  ).join('') + '</div>' +
  '<p class="hint-bar">相手は「' + esc(ty.label) + '」タイプです。' + esc(ty.note) + ' 伝え方を選ぶと通話が終わります。</p>';
}

function ruledOut(t){
  const s = new Set();
  t.facts.forEach(f => (f.out || []).forEach(c => s.add(c)));
  return s;
}
function hotCauses(t){
  const s = new Set();
  t.facts.forEach(f => (f.hot || []).forEach(c => s.add(c)));
  return s;
}

function renderLookupViz(v){
  const unlimited = v.max === null;
  const ratio = unlimited ? 72 : clamp(v.value / Math.max(v.max, 1) * 100, 0, 100);
  const over = !unlimited && v.value > v.max;
  const value = v.value.toLocaleString('ja-JP') + (v.unit ? ' ' + v.unit : '');
  const ceiling = unlimited ? '上限なし' : v.max.toLocaleString('ja-JP') + (v.unit ? ' ' + v.unit : '');
  return '<span class="lookup-viz">' +
    '<span class="lookup-viz-head"><span>' + esc(v.label) + '</span><b>' + esc(value) + ' / ' + esc(ceiling) + '</b></span>' +
    '<span class="lookup-viz-track"><i class="lookup-viz-fill ' + (over ? 'over' : unlimited ? 'unlimited' : '') + '" style="width:' + ratio + '%"></i></span>' +
    '<span class="lookup-viz-note">' + esc(v.note || '') + '</span></span>';
}

function renderDevicePanel(t){
  const p = t.s.panel;
  const label = '<div class="device-label"><span>ROUTER DISPLAY</span><span>' + esc(t.s.device) + '</span></div>';

  if (!p){
    return '<div class="device-card">' + label +
      '<div class="lcd missing"><span class="lcd-placeholder"><b>端末未受取</b>本体の画面は確認できません</span></div></div>';

  }

  const bars = [1,2,3,4].map(n => '<i class="' + (p.bars !== null && n <= p.bars ? 'on' : '') + '"></i>').join('');

function renderBoard(){
  const t = state.focus;
  if (!t){
    $('fact-count').textContent = '0';
    $('board').innerHTML = '<p class="empty-note">案件を開くと、ここに原因の候補と<br>集まった手がかりが並びます。</p>';
    return;
  }
  const ruled = ruledOut(t);
  const hot = hotCauses(t);
  $('fact-count').textContent = String(t.facts.length);

  const causeRow = c => {
    const out = ruled.has(c.id) && !hot.has(c.id);
    const isHot = hot.has(c.id);
    return '<div class="cause ' + (out ? 'out' : '') + ' ' + (isHot ? 'hot' : '') + '">' +
      '<span class="tick">' + (out ? '×' : isHot ? '●' : '·') + '</span>' +
      '<span>' + esc(c.label) + '</span>' +
      '<span class="tier">' + c.tier + '</span></div>';
  };
  const remainingCauses = CAUSES.filter(c => !(ruled.has(c.id) && !hot.has(c.id)));
  const excludedCauses = CAUSES.filter(c => ruled.has(c.id) && !hot.has(c.id));
  const causes = remainingCauses.map(causeRow).join('');
  const excluded = excludedCauses.length
    ? '<button class="board-toggle" data-board-excluded="1" aria-expanded="' + !!state.ui.boardExcludedOpen + '">除外済み（' + excludedCauses.length + '件）<span>' + (state.ui.boardExcludedOpen ? '閉じる' : '開く') + '</span></button>' +
      (state.ui.boardExcludedOpen ? '<div class="board-excluded">' + excludedCauses.map(causeRow).join('') + '</div>' : '')
    : '';

  const facts = t.facts.length
    ? t.facts.map(f => '<div class="fact"><span class="src">' + esc(f.src) + '</span>' + esc(f.text) + '</div>').join('')
    : '<p class="empty-note" style="padding:10px 0">まだ手がかりがありません。</p>';

  $('board').innerHTML =
    renderDevicePanel(t) +
    '<p class="eyebrow" style="margin:0 0 6px">残っている候補 ' + remainingCauses.length + ' / ' + CAUSES.length + '</p>' +
    causes + excluded +
    '<p class="eyebrow" style="margin:20px 0 8px">集まった手がかり</p>' +
    '<div class="facts">' + facts + '</div>' +
    '<p class="eyebrow" style="margin:20px 0 8px">この案件のここまで</p>' +
    '<div class="mini-list">' +
      mini('通話時間', t.callMinutes + '分') +
      mini('うち保留', t.holdMinutes + '分') +
      mini('聞き取り', t.asked.size + '回') +
      mini('社内照会', t.lookedUp.size + '回') +
      mini('見立て違い', t.misdiagnoses + '回') +
    '</div>';
}

function scoreReportGroup(options, selected){
  const required = options.filter(x => x.required).map(x => x.id);
  const chosen = selected.filter(id => id !== 'none');
  let points = 0;
  required.forEach(id => { points += chosen.includes(id) ? 1 : -1; });
  chosen.filter(id => !required.includes(id)).forEach(() => { points -= .5; });
  if (selected.includes('none')) points += required.length ? -1 : 1;
  const max = Math.max(1, required.length || 1);
  return { score:clamp(points / max, 0, 1), missed:required.filter(id => !chosen.includes(id)), noise:chosen.filter(id => !required.includes(id)) };
}
