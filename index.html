<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>深夜のグローバルデスク</title>

<style>
/* 明るい業務画面。夜勤の状況は時刻とワールドクロックで伝える。 */

:root{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#EDF2F7; --surface-3:#E3EAF2;
  --line:#CBD6E2; --line-soft:#E4EBF2;
  --text:#15202B; --text-2:#46586B; --text-3:#5D7185;
  --accent:#1B5FA8; --accent-hover:#16508F; --accent-soft:#E6EFF9; --accent-line:#A9C6E4;
  --signal:#0E7C7B; --signal-soft:#E0F2F1;
  --good:#157A50; --good-soft:#E3F3EB; --warn:#A96500; --warn-soft:#FBF0DE;
  --crit:#B3352B; --crit-soft:#FBEAE8;
  /* 旧クラスを意味のあるライトトークンへ接続する互換層 */
  --ink:var(--bg); --panel:var(--surface); --panel-2:var(--surface-2); --panel-3:var(--surface-3);
  --dim:var(--text-2); --faint:var(--text-3); --amber:var(--accent); --amber-deep:var(--accent-line);
  --amber-glow:var(--accent-soft); --signal-deep:var(--signal); --crit-glow:var(--crit-soft);
  --display: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", "Yu Gothic", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", "Yu Gothic", sans-serif;
  --mono: "SFMono-Regular", ui-monospace, Menlo, Monaco, Consolas, monospace;

  --sp: 4px;
}

*{ box-sizing: border-box; }
html{
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}

body{
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  font-synthesis:none;
}

button{
  font-family:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-appearance:none;
  appearance:none;
}
p,li,.say,.opt-label,.command-copy{
  word-break:normal;
  overflow-wrap:break-word;
  line-break:strict;
}
button:focus-visible, [tabindex]:focus-visible{
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}

.mono{ font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- 見出し・ラベル ---------- */

.eyebrow{
  font-family: var(--display);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}

.pane-title{
  font-family: var(--display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  margin: 0;
}

/* ============================================================
   トップバー ― 発着案内板を意識した琥珀の帯
   ============================================================ */

.topbar{
  position: sticky;
  top: 0;
  z-index: 30;
  background: linear-gradient(180deg, #0E1926 0%, #0B131C 100%);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 0 rgba(240,166,72,.18), 0 8px 24px rgba(0,0,0,.4);
}

.topbar-inner{
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 10px 20px;
  flex-wrap: wrap;
}

.brand{
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-right: auto;
}
.brand .mark{
  font-family: var(--display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: .1em;
  color: var(--amber);
  text-transform: uppercase;
}
.brand .sub{
  font-size: 11px;
  color: var(--faint);
  letter-spacing: .06em;
}

.clock{
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.clock .t{
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 500;
  color: var(--amber);
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
}
.clock .z{ font-size: 11px; color: var(--faint); letter-spacing: .04em; }

.btn-help,.btn-balance,.btn-sound{
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dim);
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 2px;
  transition: border-color .15s, color .15s;
}
.btn-help:hover,.btn-balance:hover,.btn-sound:hover{ border-color: var(--amber-deep); color: var(--amber); }

/* ---------- 23:00〜07:00 タイムシフト表 ---------- */

.shift-strip{
  position: relative;
  height: 44px;
  overflow: hidden;
  border-top: 1px solid var(--line-soft);
  background: var(--panel);
}
.shift-sky{
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #102a43 0%, #40566b 56%, #92aebe 100%);
}
.shift-axis{
  position: absolute;
  inset: 0 20px;
}
.shift-axis::after{
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 25px;
  border-top: 1px solid var(--line);
}
.shift-tick{
  position: absolute;
  bottom: 1px;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .04em;
}
.shift-tick.light{ color:#eef4f8; text-shadow:0 1px 1px #102a43; }
.shift-tick.dark{ color:#102a43; text-shadow:0 1px 0 rgba(238,244,248,.42); }
.shift-tick.first{ left: 0; transform: none; }
.shift-tick.last{ right: auto; transform: translateX(-100%); }
.shift-now{
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--amber-deep);
  opacity: .75;
}
.shift-pin{
  --stack: 0;
  position: absolute;
  top: calc(2px + var(--stack) * 10px);
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 3px;
  min-width: max-content;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}
.shift-pin-dot{
  width: 7px;
  height: 7px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--faint);
  box-shadow: 0 0 0 2px var(--panel);
}
.shift-pin.waiting .shift-pin-dot{ background: var(--amber); border-color: var(--amber); animation: pinpulse 1.8s ease-in-out infinite; }
.shift-pin.active .shift-pin-dot{ background: var(--signal); border-color: var(--signal); }
.shift-pin.closed{ color: var(--faint); opacity: .62; }
.shift-pin.abandoned{ color: var(--crit); opacity: 1; }
.shift-pin.abandoned .shift-pin-dot{ background: var(--crit); border-color: var(--crit); }
.shift-now{ will-change:left; }
@keyframes pinpulse{
  0%,100%{ transform: scale(.85); opacity: .62; }
  50%{ transform: scale(1.2); opacity: 1; }
}

/* ============================================================
   コンソール ― 対応デスクと待機状況
   ============================================================ */

.console{
  display: grid;
  grid-template-columns: minmax(0,1fr) 330px;
  gap: 1px;
  background: var(--line-soft);
  align-items: stretch;
}

/* ============================================================
   深夜オフィス ― 通話前後のフィールド画面
   人物は置かず、灯りと業務用品だけで在席を表す
   ============================================================ */
.office-scene{
  display: none;
  min-height: calc(100vh - 116px);
  padding: 20px;
  background: radial-gradient(circle at 50% 35%, #152433 0, var(--ink) 56%);
}
body.office-view .office-scene{ display: flex; flex-direction: column; gap: 14px; animation: office-in .26s ease both; }
/* ブリーフィング・業務報告・振り返りを開いている間はオフィスも隠す。
   詳細度が同じなので、上の office-view より後ろに置くこと */
body.sheet-open .office-scene{ display: none; }
body.office-view .console{ display: none; }
body.call-view .office-scene{ display: none; }
body.call-view .console{ animation: call-in .22s ease both; }
.time-passage-indicator{
  position:fixed;
  left:50%;
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:80;
  display:none;
  transform:translateX(-50%);
  padding:8px 13px;
  border:1px solid var(--accent-line);
  border-radius:999px;
  background:var(--surface);
  color:var(--text-2);
  box-shadow:0 8px 28px rgba(16,42,67,.18);
  font:700 12px/1.4 var(--mono);
  white-space:nowrap;
  pointer-events:none;
}
body.time-advancing .time-passage-indicator{ display:block; }

/* §52: 通話中にも、自分の夜がどこまで来たかを判断できるようタイムシフト表を残す。
   待機状況は、会話とコマンドを画面の外へ押し出さないよう畳み、
   要点の待ち件数は電話の状態とペイン見出しへ出す。
   ペインそのものは消さない。 */
/* §48-7: 選択肢が増えるとページ自体が伸び、会話が画面の外へ押し出されて戻らない
   （原因の一覧は14件あり、それだけで画面1.5個分になる）。選択肢の側をスクロール
   させて、会話とコマンドが同じ画面に残るようにする。 */
body.call-view .call .opts{ max-height: 42vh; overflow-y: auto; }
body.call-view .pane.call-summary > .summary-figure,
body.call-view .pane.call-summary > .hint-bar{ display: none; }
body.call-view .pane.call-summary > .pane-head{ border-bottom: 0; }
@keyframes office-in{ from{ opacity:0; transform:scale(1.025); } to{ opacity:1; transform:none; } }
@keyframes call-in{ from{ opacity:0; transform:scale(.975); } to{ opacity:1; transform:none; } }

.office-head{
  max-width: 1120px;
  margin: 0 auto 14px;
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:12px;
}
.office-head h1{ margin:0; font-family:var(--display); font-size:26px; letter-spacing:.1em; color:var(--text); }
.office-head p{ margin:0; color:var(--faint); font-size:12px; }
.office-time-panel{ width:100%; margin-top:10px; }
.office-primary-clock{ display:flex; align-items:baseline; gap:7px; margin-bottom:6px; color:var(--amber); font-family:var(--mono); }
.office-primary-clock .t{ font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
.office-primary-clock .z{ color:var(--faint); font-size:11px; }
.office-time-panel .shift-strip{ width:100%; border:1px solid var(--line); border-radius:6px; }
body.office-view .topbar .clock{ display:none; }
.office-floor{
  position:relative;
  width:100%;
  max-width:1120px;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:12px;
  min-height:0;
  padding:12px;
  margin:0 auto;
  overflow:visible;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--surface);
}
.office-object{
  position:relative;
  border:1px solid var(--line);
  border-radius:10px;
  padding:13px;
  background:var(--surface-2);
  color:var(--text-2);
  text-align:left;
  font:15px/1.45 var(--body);
}
.office-object b{ display:block; font-family:var(--display); letter-spacing:.08em; color:var(--text-2); font-size:15px; }
.office-object small{ display:block; color:var(--text-3); font-family:var(--mono); font-size:15px; }
.office-wall{
  position:relative;
  z-index:1;
  grid-column:1 / -1;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:3px;
  background:var(--surface);
  transform:rotate(-.4deg);
  transform-origin:center;
}
.slogan-label{
  display:block;
  color:var(--text-3);
  font:700 10px/1.4 var(--display);
  letter-spacing:.14em;
}
.slogan-text{
  display:block;
  margin-top:4px;
  color:var(--text);
  font:800 24px/1.25 var(--display);
  letter-spacing:.08em;
  word-break:normal;
  overflow-wrap:break-word;
}
.office-pixel-frame{ position:relative; overflow:hidden; border:4px solid #102a43; border-radius:4px; background:#07111c; box-shadow:0 5px 0 #8999a8; }
.office-pixel-frame.ringing{ border-color:#e2a447; }
.office-pixel-canvas{ display:block; width:100%; height:auto; aspect-ratio:192 / 168; image-rendering:crisp-edges; image-rendering:pixelated; }
.office-pixel-caption{ display:flex; justify-content:space-between; gap:8px; padding:6px 9px; background:#102a43; color:#eef4f8; font:700 12px/1.4 var(--mono); }
.office-pixel-frame.ringing .office-pixel-caption{ background:#e2a447; color:#07111c; }
.office-status-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.office-board{ grid-column:1 / -1; }
.office-sv .lamp{ position:absolute; right:14px; top:13px; width:20px; height:24px; border-radius:50% 50% 4px 4px; background:var(--amber); box-shadow:0 0 22px var(--amber); }
.office-sv.busy .lamp{ background:var(--faint); box-shadow:none; }
.office-board{ background:#d8e4ec; color:#21313d; border-color:#8497a6; }
.office-board b{ color:#3b4d59; }.office-board .notice{ margin-top:7px; color:#943f37; font-weight:700; font-size:12px; }.office-board .blank{ margin-top:7px; color:#596b7a; font-size:11px; }
.office-ship::before{ content:""; position:absolute; right:13px; bottom:13px; width:48px; height:24px; border:1px solid var(--signal-deep); background:repeating-linear-gradient(90deg,var(--signal-deep) 0 3px,transparent 3px 6px); opacity:.7; }
.office-tray::before{ content:""; position:absolute; right:13px; top:14px; width:38px; height:28px; background:var(--amber); transform:rotate(5deg); opacity:.7; box-shadow:-5px 5px 0 var(--signal-deep); }
.office-call-actions{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.office-call-action{ min-height:66px; padding:10px 14px; border:2px solid var(--accent); border-radius:8px; background:var(--surface); color:var(--text); font:700 18px/1.25 var(--display); text-align:left; box-shadow:0 8px 22px rgba(0,0,0,.18); }
.office-call-action span{ display:block; margin-top:5px; color:var(--text-3); font:600 12px/1.35 var(--mono); }
.office-call-action:hover:not(:disabled),.office-call-action:focus-visible{ background:var(--accent-soft); outline:2px solid var(--accent); outline-offset:2px; }
.office-call-action:disabled{ opacity:.42; cursor:not-allowed; }
.call-summary .summary-figure{ padding:13px 3px; color:var(--dim); line-height:1.9; }.summary-figure b{ color:var(--text); font-family:var(--mono); font-weight:500; }

/* シート表示中はコンソールを隠す */
body.sheet-open .topbar,
body.sheet-open .console{ display: none; }

.pane{
  background: var(--ink);
  padding: 16px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pane-head{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-soft);
}

.count-chip{
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  border: 1px solid var(--line);
  padding: 1px 7px;
  border-radius: 2px;
}

.empty-note{
  color: var(--faint);
  font-size: 12px;
  padding: 18px 4px;
  text-align: center;
  line-height: 1.8;
}

/* ---------- 中央：一件の通話 ---------- */
.call{
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 2px;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}
.call.on-hold{
  border-color: var(--amber-deep);
  box-shadow: inset 0 0 0 1px var(--amber-deep);
  background: linear-gradient(180deg, var(--amber-glow), var(--panel) 34%);
}

.call-head{
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 14px;
}
.call-head .cname{ font-size: 15px; font-weight: 700; }
.call-head .ctype{
  font-size: 11px;
  color: var(--amber);
  border: 1px solid var(--amber-deep);
  padding: 0 6px;
  border-radius: 2px;
}
.call-time{
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--signal);
  font-variant-numeric: tabular-nums;
}
/* §48-7: 電話の状態にまとめた項目。保留だけは待たせている自覚が要るので目立たせる。 */
.call-hold,.call-waiting{
  font-family: var(--mono);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
}
.call-hold{ color: var(--warn); font-weight: 700; }
.hold-state{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--amber);
  text-transform: uppercase;
}
.call-meta{
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}
.call-meta b{ color: var(--faint); font-weight: 400; }
.stress-panel{ position:sticky; top:0; z-index:18; margin:12px 14px 0; padding:13px 14px; border:2px solid currentColor; border-radius:10px; background:var(--surface-2); color:var(--good); box-shadow:0 5px 14px rgba(21,32,43,.12); }
.stress-panel.unknown{ color:var(--text-3); }
.stress-panel.irritated{ color:var(--warn); }.stress-panel.angry,.stress-panel.limit{ color:var(--crit); }
.stress-panel-head{ display:grid; grid-template-columns:1fr auto auto; align-items:baseline; gap:10px; }
.stress-panel-head span{ color:var(--text-2); font:700 13px/1.4 var(--display); letter-spacing:.08em; }
.stress-panel-head b{ font:800 30px/1 var(--mono); font-variant-numeric:tabular-nums; }
.stress-panel-head strong{ min-width:4em; padding:3px 8px; border:1px solid currentColor; border-radius:999px; font:700 13px/1.2 var(--display); text-align:center; }
.stress-track{ display:block; height:16px; margin-top:10px; overflow:hidden; border:1px solid currentColor; border-radius:999px; background:var(--surface-3); }
.stress-fill{ display:block; height:100%; background:currentColor; transition:width .25s ease; }
.stress-panel.alert{ animation:stress-alert .75s ease-in-out infinite alternate; }
@keyframes stress-alert{ from{ box-shadow:0 0 0 rgba(197,65,65,0); } to{ box-shadow:0 0 0 5px rgba(197,65,65,.22),0 0 22px rgba(197,65,65,.28); } }

.transcript{
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 140px;
  max-height: 46vh;
}
.transcript.recent{ flex:none; min-height:124px; max-height:230px; }
.record-view{ min-height:0; }
.record-transcript{ display:flex; flex-direction:column; gap:12px; max-height:48vh; overflow:auto; padding:4px 2px 12px; }
.record-transcript .line{ flex:none; }
.log-view{ min-height:0; }
.log-section{ margin:10px 0; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); }
.log-section h3{ margin:0 0 9px; color:var(--accent); font:700 14px/1.4 var(--display); letter-spacing:.06em; }
.log-section p{ margin:5px 0; }
.log-section ul{ margin:5px 0; padding-left:1.25em; }
.log-customer p{ display:grid; grid-template-columns:minmax(7em,auto) 1fr; gap:10px; }
.log-customer b{ color:var(--text-3); font-size:12px; }

.line{ display: flex; flex-direction: column; gap: 3px; max-width: 88%; }
.line .who{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.line .say{
  padding: 9px 12px;
  border-radius: 2px;
  line-height: 1.75;
  font-size: 13.5px;
}
.line.cust{ align-self: flex-start; }
.line.cust .say{
  background: var(--panel-2);
  border-left: 2px solid var(--line);
}
.line.me{ align-self: flex-end; }
.line.me .who{ text-align: right; color: var(--amber-deep); }
.line.me .say{
  background: rgba(240,166,72,.09);
  border-right: 2px solid var(--amber-deep);
}
.line.sys{ align-self: stretch; max-width: 100%; }
.line.sys .who{ color: var(--signal-deep); }
.line.sys .say{
  background: rgba(87,199,192,.06);
  border-left: 2px solid var(--signal-deep);
  font-family: var(--mono);
  font-size: 12px;
  color: var(--signal);
  line-height: 1.7;
}
.line.note .say{
  background: transparent;
  border-left: 2px solid var(--line);
  color: var(--dim);
  font-size: 12px;
  font-style: normal;
}

/* アクション */
.actions{
  border-top: 1px solid var(--line-soft);
  padding: 12px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hangup-box{ display:flex; align-items:center; justify-content:flex-end; gap:12px; padding-top:10px; border-top:1px solid var(--line-soft); }
.hangup-box p{ flex:1; margin:0; color:var(--text-2); font-size:12px; line-height:1.5; }
.hangup-button{ min-height:44px; padding:9px 16px; border:2px solid var(--crit); border-radius:8px; background:transparent; color:var(--crit); font-weight:800; }
.hangup-button:hover{ background:var(--crit); color:#fff; }
.hangup-confirm{ padding:14px; border:2px solid var(--crit); border-radius:10px; background:var(--surface-2); }
.hangup-confirm > b{ display:block; margin-bottom:12px; color:var(--crit); font-size:16px; }
.hangup-confirm > div{ display:flex; justify-content:flex-end; gap:10px; }

/* コマンド選択式。主コマンドを選び、その先で対象を選ぶ二段階構造。 */
.command-box{
  padding:12px;
  border:3px solid #FFFFFF;
  border-radius:12px;
  outline:2px solid var(--accent);
  background:#102A43;
  box-shadow:0 8px 20px rgba(21,32,43,.16);
  color:#FFFFFF;
}
.command-title{ margin-bottom:10px; }
.command-title span,
.command-panel-head span{
  display:block;
  color:#A9C6E4;
  font:600 11px/1.4 var(--mono);
  letter-spacing:.12em;
}
.command-title b,
.command-panel-head b{
  display:block;
  margin-top:2px;
  color:#FFFFFF;
  font-size:15px;
  letter-spacing:.04em;
}
.command-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.command-choice{
  position:relative;
  display:grid;
  grid-template-columns:24px minmax(0,1fr);
  grid-template-rows:auto auto;
  gap:2px 7px;
  min-height:82px;
  padding:10px;
  border:1px solid #6F96BC;
  border-radius:8px;
  background:#173B5E;
  color:#FFFFFF;
  text-align:left;
}
.command-choice:hover:not(:disabled),
.command-choice:focus-visible{ border-color:#FFFFFF; background:#1F4F7C; }
.command-choice:active:not(:disabled){ transform:translateY(1px); }
.command-choice:disabled{ opacity:.38; cursor:not-allowed; }
.command-no{
  grid-row:1 / 3;
  display:grid;
  place-items:center;
  align-self:start;
  width:24px;
  height:24px;
  border:1px solid #A9C6E4;
  border-radius:50%;
  color:#DCEAF7;
  font:600 12px/1 var(--mono);
}
.command-copy{ min-width:0; }
.command-copy b{ display:block; font-size:18px; line-height:1.25; }
.command-copy small{ display:block; margin-top:3px; color:#D4E2EF; font-size:11px; line-height:1.45; }
.command-meta{ grid-column:2; color:#A9C6E4; font:500 11px/1.4 var(--mono); }
.command-panel-head{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border:2px solid #FFFFFF;
  border-radius:10px;
  outline:2px solid var(--accent);
  background:#102A43;
}
.command-panel-head > div{ min-width:0; }
.command-back{
  flex:none;
  min-height:44px;
  padding:8px 10px;
  border:1px solid #6F96BC;
  border-radius:7px;
  background:#173B5E;
  color:#FFFFFF;
  font-size:13px;
  font-weight:700;
}
.command-back:hover{ border-color:#FFFFFF; background:#1F4F7C; }

.opts{ display: flex; flex-direction: column; gap: 5px; max-height: min(24vh, 200px); overflow-y: auto; }
.opts.ask-groups{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; max-height:none; overflow:visible; }
.ask-group-choice{ min-height:101px; grid-template-columns:minmax(0,1fr); }

.opt{
  display: flex;
  /* 選択肢は縦に潰さない。潰れると説明文や「前提不足」の理由が読めなくなる。 */
  flex: none;
  align-items: flex-start;
  gap: 10px;
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  border-radius: 2px;
  padding: 9px 11px;
  text-align: left;
  font-size: 13px;
  line-height: 1.6;
  transition: background .13s, border-color .13s;
}
.opt:hover:not(:disabled){ background: var(--panel-3); border-color: var(--amber-deep); }
.opt:disabled{ opacity: .36; cursor: not-allowed; }
.opt .cost{
  flex: none;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  padding-top: 2px;
  min-width: 42px;
  text-align: right;
}
.opt.used{ opacity: .4; }
.opt.recommended{ border-color:var(--good); background:var(--good-soft); }
.opt.recommended:hover:not(:disabled){ border-color:var(--good); background:#D5EDDF; }
.opt.danger:hover:not(:disabled){ border-color: var(--crit); }
.opt.esc:hover:not(:disabled){ border-color: var(--signal); }
.opt:disabled.has-block-reason{ opacity:1; border-color:var(--crit); background:var(--crit-soft); }

.opt-label{ flex: 1; }
.opt-sub{ display: block; font-size: 11px; color: var(--faint); margin-top: 2px; line-height: 1.55; }
.remedy-block-reason{ margin-top:6px; padding:6px 8px; border-left:3px solid var(--crit); color:var(--crit); font-weight:700; }
.remedy-block-reason b{ display:inline-block; margin-right:7px; padding:1px 5px; background:var(--crit); color:#fff; font-size:10px; letter-spacing:.08em; }

.tone-row{
  display: flex;
  gap: 6px;
  padding-top: 2px;
  flex-wrap: wrap;
}
.tone{
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 7px 12px;
  font-size: 12.5px;
  flex: 1;
  min-width: 120px;
  text-align: left;
  line-height: 1.5;
}
.tone:hover{ border-color: var(--amber); background: var(--panel-3); }
.tone .tname{
  display: block;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--amber);
  margin-bottom: 1px;
}

.pending-note{
  background: rgba(87,199,192,.07);
  border: 1px solid var(--signal-deep);
  border-radius: 2px;
  padding: 11px 13px;
  font-size: 12.5px;
  color: var(--signal);
  line-height: 1.7;
}

/* TGXの送り状。実在配送会社の意匠は使わず、罫線と帯だけで表現する */
.shipment{ padding:3px 1px 0; }.shipment h3{ margin:0 0 8px; font-family:var(--display); font-size:18px; letter-spacing:.1em; color:var(--amber); }.shipment-address{ margin:0 0 9px; color:var(--dim); font-size:12px; }
.waybill{ padding:12px; border:1px solid var(--signal-deep); background:var(--panel-2); position:relative; overflow:hidden; }.waybill::after{ content:""; display:block; height:16px; margin-top:11px; background:repeating-linear-gradient(90deg,var(--text) 0 2px,transparent 2px 4px,var(--signal) 4px 5px,transparent 5px 8px); opacity:.72; }
.waybill > div{ display:grid; grid-template-columns:70px 1fr; gap:8px; padding:4px 0; border-bottom:1px dotted var(--line); font-size:11px; line-height:1.45; }.waybill b{ font-family:var(--display); letter-spacing:.1em; color:var(--faint); }.waybill span{ color:var(--text); font-family:var(--mono); }.shipment-confirm{ width:100%; margin-top:10px; font-size:15px; padding:9px 12px; }

.hint-bar{
  font-size: 11.5px;
  color: var(--faint);
  line-height: 1.6;
}

/* 照会結果はROUTER DISPLAYと同じ暗い機械画面として見せる */
.line.sys.lookup-result .say{
  width: 100%;
  padding: 0;
  border: 0;
  background: transparent;
}
.system-screen{
  display: block;
  overflow: hidden;
  border: 1px solid var(--signal-deep);
  border-radius: 3px;
  background: var(--panel-2);
  color: var(--signal);
  font-family: var(--mono);
  font-size: 11px;
  box-shadow: inset 0 0 18px var(--ink);
}
.system-screen header{
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--signal-deep);
  font-family: var(--display);
  letter-spacing: .08em;
}
.system-screen header span{ color: var(--dim); font-size: 9px; }
.system-screen header b{ color: var(--text); font-size: 12px; }
.system-screen header em{
  padding: 1px 5px;
  border: 1px solid var(--signal-deep);
  color: var(--signal);
  font-size: 9px;
  font-style: normal;
}
.lookup-system-fields{ padding: 7px 10px; }
.lookup-system-row{
  display: grid;
  grid-template-columns: minmax(82px, .42fr) 1fr;
  gap: 12px;
  padding: 4px 0;
  border-bottom: 1px dotted var(--signal-deep);
}
.lookup-system-row:last-child{ border-bottom: 0; }
.lookup-system-row b{ color: var(--dim); font-weight: 400; }
.lookup-system-row span{ color: var(--signal); min-width: 0; overflow-wrap: anywhere; }
.system-screen footer{
  padding: 5px 10px;
  border-top: 1px solid var(--signal-deep);
  color: var(--dim);
  font-size: 9px;
  letter-spacing: .12em;
  text-align: right;
}
.lookup-system-screen.external{ border-color: var(--amber-deep); }
.lookup-system-screen.external header,
.lookup-system-screen.external footer{ border-color: var(--amber-deep); }
.lookup-system-screen .lookup-system-external{ border-color: var(--amber-deep); color: var(--amber); }

.record-system-screen{ margin-top: 8px; }
.record-system-body{ padding: 2px 10px 8px; }
.record-system-block{ padding: 10px 0; border-bottom: 1px solid var(--signal-deep); }
.record-system-block:last-child{ border-bottom: 0; }
.record-system-block h3{ margin: 0 0 7px; color: var(--signal); font: 600 11px/1.4 var(--display); letter-spacing: .1em; }
.record-system-block p,
.record-system-block li{ color: var(--text); font-size: 11px; line-height: 1.6; }
.record-system-block ul{ margin: 4px 0; padding-left: 1.3em; }
.record-system-screen .log-customer p{ display: grid; grid-template-columns: minmax(110px,.38fr) 1fr; gap: 12px; margin: 0; padding: 4px 0; border-bottom: 1px dotted var(--signal-deep); }
.record-system-screen .log-customer p:last-child{ border-bottom: 0; }
.record-system-screen .log-customer b{ color: var(--dim); font-weight: 400; }
.record-system-screen .log-customer span{ color: var(--signal); }
.record-system-transcript{ display: flex; flex-direction: column; gap: 0; }
.record-system-entry{ display: grid; grid-template-columns: minmax(88px,.28fr) 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px dotted var(--signal-deep); }
.record-system-entry:last-child{ border-bottom: 0; }
.record-system-entry > b{ color: var(--dim); font: 400 10px/1.6 var(--display); letter-spacing: .06em; }
.record-system-entry > span{ min-width: 0; color: var(--text); font: 11px/1.6 var(--mono); overflow-wrap: anywhere; }
.record-system-entry.me > b{ color: var(--amber); }
.record-system-entry.cust > b{ color: var(--signal); }
.record-system-entry.note{ opacity: .78; }
.record-system-entry .lookup-system-screen{ margin: 0; }
.record-denied-message{ padding: 22px 14px; text-align: center; }
.record-denied-message b{ display: block; color: var(--amber); font: 600 13px/1.6 var(--display); }
.record-denied-message p{ margin: 8px 0 0; color: var(--text); font: 12px/1.7 var(--mono); }

/* 社内照会に添える単一型のメトリックバー */
.lookup-viz{
  display: block;
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px solid var(--signal-deep);
}
.lookup-viz-head{ display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
.lookup-viz-head b{ color: var(--signal); font-weight: 500; }
.lookup-viz-track{ display: block; height: 5px; margin: 5px 0 3px; background: var(--line); overflow: hidden; border-radius: 1px; }
.lookup-viz-fill{ display: block; height: 100%; background: var(--signal); }
.lookup-viz-fill.over{ background: var(--crit); }
.lookup-viz-fill.unlimited{ background: repeating-linear-gradient(90deg, var(--signal) 0 8px, var(--signal-deep) 8px 12px); }
.lookup-viz-note{ color: var(--dim); font-size: 11px; }

/* ============================================================
   オーバーレイ（ブリーフィング／シフト終了／マニュアル）
   ============================================================ */

.overlay{
  background: var(--ink);
  padding: 32px 20px 64px;
  min-height: 100vh;
  display: none;
}
.overlay.on{ display: block; }

.sheet{
  max-width: 720px;
  margin: 0 auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--amber);
  border-radius: 2px;
  padding: 32px 36px 36px;
}
.sheet h1{
  font-family: var(--display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .06em;
  margin: 0 0 4px;
  text-wrap: balance;
  line-height: 1.15;
}
.sheet h2{
  font-family: var(--display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--amber);
  margin: 28px 0 10px;
  padding-bottom: 5px;
  border-bottom: 1px solid var(--line-soft);
}
.sheet p{ margin: 0 0 12px; max-width: 40em; }
.sheet ul{ margin: 0 0 12px; padding-left: 18px; max-width: 40em; }
.sheet li{ margin-bottom: 6px; }
.sheet .lead{ color: var(--dim); font-size: 14.5px; line-height: 1.85; }
.sheet strong{ color: var(--amber); font-weight: 500; }
.balance-console{ display:flex; flex-direction:column; gap:12px; }
.balance-flags{ display:grid; gap:10px; margin:10px 0 20px; padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2); }
.balance-flags label{ display:flex; align-items:flex-start; gap:9px; font-weight:700; color:var(--text); cursor:pointer; }
.balance-flags input{ width:18px; height:18px; margin-top:1px; accent-color:var(--accent); }
.balance-flags p{ margin:0; font-size:12px; color:var(--text-3); }
.balance-card{ border:1px solid var(--line); border-radius:10px; background:var(--surface-2); overflow:hidden; }
.balance-card summary{ padding:13px 14px; cursor:pointer; font-weight:700; color:var(--text); }
.balance-card-body{ padding:0 14px 15px; }
.balance-card-body p{ max-width:none; }
.balance-facts{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0; }
.balance-fact{ padding:9px; border-radius:8px; background:var(--surface); font-size:13px; }
.balance-fact b{ display:block; color:var(--text-3); font-size:11px; letter-spacing:.08em; }
.balance-route{ margin:8px 0 0; padding:10px 10px 10px 30px; border-left:4px solid var(--accent); background:var(--accent-soft); }
.balance-route li{ margin:4px 0; }
.balance-table-wrap{ overflow-x:auto; }
.balance-table{ width:100%; min-width:560px; border-collapse:collapse; font-size:13px; }
.balance-table th,.balance-table td{ padding:8px; border:1px solid var(--line); text-align:left; vertical-align:top; }
.artifact-qr-card{
  display:grid;
  grid-template-columns:180px minmax(0,1fr);
  align-items:center;
  gap:18px;
  margin:24px 0;
  padding:16px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--surface-2);
}
.artifact-qr-canvas{
  display:block;
  width:180px;
  height:180px;
  background:#fff;
  image-rendering:crisp-edges;
  image-rendering:pixelated;
}
.artifact-qr-copy b{ display:block; margin-bottom:6px; font-size:18px; color:var(--text); }
.artifact-qr-copy p{ margin-bottom:8px; font-size:14px; line-height:1.55; }
.artifact-qr-url{
  display:block;
  color:var(--text-2);
  font:11px/1.5 var(--mono);
  overflow-wrap:anywhere;
  white-space:normal;
}

.btn-primary{
  background: var(--amber);
  border: none;
  color: #17110A;
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 12px 30px;
  border-radius: 2px;
  margin-top: 22px;
  transition: filter .15s, transform .1s;
}
.btn-primary:hover{ filter: brightness(1.1); }
.btn-primary:active{ transform: translateY(1px); }

.btn-ghost{
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dim);
  font-family: var(--display);
  font-size: 14px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 11px 22px;
  border-radius: 2px;
  margin-top: 22px;
  margin-left: 10px;
}
.btn-ghost:hover{ border-color: var(--amber-deep); color: var(--amber); }

/* デブリーフ用 */
.score-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 1px;
  background: var(--line-soft);
  border: 1px solid var(--line-soft);
  margin: 14px 0 20px;
}
.score-cell{ background: var(--panel-2); padding: 13px 14px; }
.score-cell .k{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--faint);
}
.score-cell .v{
  font-family: var(--mono);
  font-size: 25px;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
}
.score-cell .n{ font-size: 11px; color: var(--faint); line-height: 1.5; }

.rank-badge{
  display: inline-flex;
  align-items: baseline;
  gap: 12px;
  border: 1px solid var(--amber-deep);
  background: var(--amber-glow);
  padding: 10px 22px;
  border-radius: 2px;
  margin-bottom: 6px;
}
.rank-badge .r{
  font-family: var(--display);
  font-size: 44px;
  font-weight: 700;
  color: var(--amber);
  line-height: 1;
}
.rank-badge .rt{ font-size: 14px; color: var(--text); }

.review{
  border-left: 2px solid var(--line);
  padding: 10px 0 10px 14px;
  margin-bottom: 10px;
}
.review.win{ border-left-color: var(--good); }
.review.mid{ border-left-color: var(--warn); }
.review.bad{ border-left-color: var(--crit); }
.review .rh{
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 10px;
  margin-bottom: 3px;
}
.review .rn{ font-weight: 700; font-size: 14px; }
.review .rp{
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--signal);
}
.review .rs{
  font-family: var(--mono);
  font-size: 12px;
  color: var(--dim);
  margin-left: auto;
}
.review .rb{ font-size: 12.5px; color: var(--dim); line-height: 1.7; }
.review .rb em{ color: var(--amber); font-style: normal; }
.review-csat{ height: 4px; margin: 5px 0 7px; background: var(--line-soft); overflow: hidden; }
.review-csat i{ display: block; height: 100%; background: var(--good); }
.review.mid .review-csat i{ background: var(--warn); }
.review.bad .review-csat i{ background: var(--crit); }
.complaint-mailbox{ margin:24px 0; padding:16px; border:2px solid var(--crit); border-radius:10px; background:var(--crit-glow); }
.complaint-mailbox h2{ margin:0 0 4px; color:var(--crit); }
.complaint-mailbox>p{ margin:0 0 12px; color:var(--text-2); font:700 13px/1.4 var(--mono); }
.complaint-email{ margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
.complaint-email b,.complaint-email span{ display:block; }
.complaint-email span{ margin-top:3px; color:var(--crit); font:700 12px/1.4 var(--display); }
/* §51-2: 切る前に「記録が残せない」と気づける枠。取り返せるのは名前だけ。 */
.record-gap{ margin:0 0 10px; padding:12px; border:1px solid var(--warn); border-radius:8px; background:var(--surface-2); }
.record-gap>b{ display:block; margin-bottom:8px; color:var(--warn); font-size:13px; line-height:1.5; }
/* §50-4: お礼は苦情と対になる枠で出す。半分の確率でしか届かないので、届いた夜が分かる。 */
.gratitude-mailbox{ margin:24px 0; padding:16px; border:2px solid var(--good); border-radius:10px; background:var(--good-glow, var(--surface-2)); }
.gratitude-mailbox h2{ margin:0 0 4px; color:var(--good); }
.gratitude-mailbox>p{ margin:0 0 12px; color:var(--text-2); font:700 13px/1.4 var(--mono); }
.gratitude-email{ margin-top:10px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
.gratitude-email b{ display:block; }
.complaint-email p{ margin:8px 0 0; color:var(--text-2); font-size:14px; line-height:1.65; }
.report-auto{ margin:14px 0; padding:11px 13px; border:1px solid var(--line); background:var(--panel-2); color:var(--text); font-family:var(--mono); font-size:12px; line-height:1.75; }
.report-list{ display:flex; flex-direction:column; gap:6px; }.report-check{ display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border:1px solid var(--line-soft); background:var(--panel-2); cursor:pointer; font-size:12.5px; line-height:1.6; }.report-check:hover{ border-color:var(--amber-deep); }.report-check input{ margin-top:5px; accent-color:var(--amber); }.report-check span{ flex:1; }.report-check i{ display:block; margin-top:2px; color:var(--faint); font-size:11px; font-style:normal; }.report-miss{ margin-top:8px; padding:7px 9px; border-left:2px solid var(--crit); background:var(--crit-glow); color:var(--text); font-size:11.5px; }
.career-briefing{ display:flex; flex-direction:column; gap:3px; margin:12px 0 18px; padding:12px 14px; border-left:4px solid var(--amber); background:var(--panel-2); }
.career-briefing b{ color:var(--text); font:700 16px/1.4 var(--display); }.career-briefing span{ color:var(--dim); font-size:12px; }
.audio-diagnostic{ margin:12px 0 18px; padding:14px; border:1px solid var(--accent-line); border-radius:10px; background:var(--accent-soft); }
.audio-diagnostic b{ display:block; color:var(--text); font:800 16px/1.4 var(--display); }

.line{ max-width:82%; }.line .say{ position:relative; border:1px solid var(--line); border-radius:12px 12px 12px 3px; }.line.cust .say::after{ content:""; position:absolute; left:-1px; bottom:-7px; border-width:7px 8px 0 0; border-style:solid; border-color:var(--surface-2) transparent transparent transparent; }.line.me .say{ border-radius:12px 12px 3px 12px; }.line.me .say::after{ content:""; position:absolute; right:-1px; bottom:-7px; border-width:7px 0 0 8px; border-style:solid; border-color:var(--accent-soft) transparent transparent transparent; }.line.sys .say{ border:1px solid var(--signal); background:var(--signal-soft); color:var(--text-2); }.line.note .say{ border:1px solid var(--line-soft); background:var(--surface-2); }

/* ============================================================
   スマホ専用UI
   PCでもスマホ幅の試遊画面として表示し、ゲーム本体は常に一画面一機能にする。
   ============================================================ */
html{ min-height:100%; background:#DDE6EF; }
body{
  width:min(100%,480px);
  min-height:100dvh;

}
body.playing{ display:block; height:auto; min-height:100dvh; overflow:auto; }
.topbar{ position:relative; }
.topbar-inner{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto auto auto auto;
  gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
}
.brand{ min-width:0; margin:0; }
.brand .mark{ font-size:22px; letter-spacing:.06em; white-space:nowrap; }

.clock{ gap:4px; }

.btn-help::after{ content:"?"; font:700 22px/1 var(--display); }
.btn-balance::after{ content:"調"; font:700 17px/1 var(--display); }

.btn-sound[aria-pressed="false"]{ border-color:var(--crit); color:var(--crit); }
.topbar-inner > .btn-sound{ grid-row:1; grid-column:3; align-self:center; justify-self:end; z-index:2; }
.topbar-inner > .btn-balance{ grid-row:1; grid-column:4; align-self:center; justify-self:end; z-index:2; }
.topbar-inner > .btn-help{ grid-row:1; grid-column:5; align-self:center; justify-self:end; z-index:2; }
.shift-strip{ height:52px; }
.shift-axis{ inset-inline:14px; }
.shift-tick{ font-size:12px; }
.shift-pin-label{ display:none; }

.console{ display:flex; flex-direction:column; min-height:calc(100dvh - 170px); background:var(--bg); }

}

body.playing .opts{ max-height:none; overflow:visible; }

.office-scene{ min-height:calc(100dvh - 170px); padding:16px 14px calc(24px + env(safe-area-inset-bottom)); }

.office-head{ display:block; margin:0; }

.sheet{
  width:100%;
  max-width:none;
  min-height:100dvh;

.sheet.briefing-sheet{ display:flex; flex-direction:column; height:100dvh; min-height:0; overflow:hidden; padding-bottom:0; }
.briefing-scroll{ min-height:0; overflow-y:auto; padding-bottom:18px; }
.briefing-actions{ flex:none; padding:12px 0 calc(16px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -8px 18px rgba(21,32,43,.08); }

   ただし通話では直近の顧客発話も判断材料なので、操作のすぐ上に必ず残す。 */
@media (max-height:760px){
  /* transform を持つアニメーション祖先は fixed の基準面を本文に変えるため、
     縮んだ画面では入場アニメーションを使わない。 */
  body.office-view .office-scene,body.call-view .console{ animation:none; }
  body.office-view .office-call-actions{
    position:fixed; z-index:45; left:0; right:0; bottom:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));

  }
  body.office-view .office-call-action{ min-height:58px; padding:7px 10px; font-size:16px; }

  body.call-view .call{ isolation:isolate; }
  /* コマンド4つと終話を収める高さを予約する。会話はこの領域の上に出すので、

  body.call-view{ --short-call-actions-height:calc(212px + env(safe-area-inset-bottom)); }
  body.call-view .transcript.recent{
    position:fixed; z-index:101; isolation:isolate; left:0; right:0;
    bottom:var(--short-call-actions-height);
    display:flex; height:clamp(84px,18dvh,120px); min-height:0; max-height:none;
    overflow:auto; padding:8px 12px; gap:6px;
    background:var(--surface); border-top:1px solid var(--line);
    box-shadow:0 -8px 20px rgba(21,32,43,.12);
  }
  body.call-view .transcript.recent .line{ max-width:100%; }
  body.call-view .transcript.recent .line .who{ font-size:11px; }
  body.call-view .transcript.recent .line .say{ padding:7px 9px; font-size:15px; line-height:1.4; }
  body.call-view .actions{
    position:fixed; z-index:100; isolation:isolate; left:0; right:0; bottom:0;
    height:var(--short-call-actions-height); max-height:calc(100dvh - 106px); overflow:auto;
    padding:8px 12px calc(10px + env(safe-area-inset-bottom));

    box-shadow:0 -8px 20px rgba(21,32,43,.16);

  body.call-view .hangup-button{ min-height:42px; }
}
@media (max-width:480px){
  body{ width:100%; box-shadow:none; }
  .artifact-qr-card{ display:none; }
  /* 375px級ではロゴと3操作を優先する。時刻は下のシフト帯で読めるため、
     ここでは時計を畳んでロゴの実文字が操作へ食い込まないようにする。 */
  .topbar-inner{ grid-template-columns:minmax(0,1fr) auto auto auto; }

  .topbar-inner > .btn-balance{ grid-column:3; }
  .topbar-inner > .btn-help{ grid-column:4; }
}

function customerCallCost(t){ return (t.inboundMinutes || 0) * CALL_RATE_PER_MIN; }
function totalCost(){ return state.cost + state.tickets.reduce((n,t) => n + callCost(t), 0); }
function pendingTypedLine(t){ return t.transcript.find(x => (x.who === 'cust' || x.who === 'front' || x.who === 'sys') && !x.typed); }

function ticketLocalMinute(t){
  const utc = state.clock - 9 * 60;
  return ((utc + t.s.localOffset * 60) % 1440 + 1440) % 1440;
}
function isLateLocalTime(t){
  const minute = ticketLocalMinute(t);
  return minute >= 22 * 60 || minute < 6 * 60;
}

function hotelRoom(t){
  const match = String(t.stayAddress || '').match(/(?:room\s*)?(\d{3,4})(?:号室)?/i);
  return match ? match[1] : null;
}

function hotelContactKnown(t){
  return Boolean(t && t.asked && t.asked.has('q_stay') && t.stayAddress && t.stayHotelName);
}

function defaultUi(tab = 'command'){
  return { tab, cause:null, remedy:null, lookup:null, askGroup:null };
}

const state = {
  phase: 'briefing',
  turn: 0,
  clock: SHIFT_START,
  tickets: [],
  focus: null,          // 表示中のチケット
  escLeft: ESCALATIONS,
  cost: 0,
  outageKnown: false,
  outageRegion: null,
  holdVisual: false,
  busy: false,
  ui: defaultUi(),
  desk: null,           // 折り返し待ちのあいだ、デスク端末で調べている案件
  slogan: '',
  report: null,
  career: null,
  careerUpdate: null,
  endingReplay: false,
  endingType: 'career',
  officeEvents: [],
  handoverMeetingComplete: false,
  deviceVerificationMinutes: 0,
  verifiedDevices: 0,
  random: Math.random,
};

function rollLuck(){
  return state.random() < GAME_FLAGS.luckRate;
}

function shuffleScenarios(scenarios, random){
  const shuffled = scenarios.slice();
  for (let i = shuffled.length - 1; i > 0; i--){
    const j = Math.floor(random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function dailyTicketCount(random, flags = GAME_FLAGS){
  if (flags.dailyTickets !== null){
    if (!Number.isInteger(flags.dailyTickets) || flags.dailyTickets < 2 || flags.dailyTickets > 5){
      throw new Error('dailyTickets は null または2〜5の整数で指定してください');
    }
    return flags.dailyTickets;
  }
  return 2 + Math.floor(random() * 4);
}

function handoverTicketCount(random, flags = GAME_FLAGS){
  if (flags.handoverTickets !== null && flags.handoverTickets !== undefined){
    if (!Number.isInteger(flags.handoverTickets) || flags.handoverTickets < 0 || flags.handoverTickets > 2){
      throw new Error('handoverTickets は null または0〜2の整数で指定してください');
    }
    return flags.handoverTickets;
  }
  const roll = random();
  if (roll < HANDOVER_ZERO_RATE) return 0;
  if (roll < HANDOVER_ZERO_RATE + HANDOVER_ONE_RATE) return 1;
  return 2;
}

function scenarioLocalMinute(scenario, place){
  const absolute = SHIFT_START + scenario.arrive + place.localOffset * 60;
  return ((absolute % 1440) + 1440) % 1440;
}

function placeAllowedForScenario(scenario, place){
  const constraint = PLACE_CONSTRAINTS[scenario.trueCause];
  if (constraint === 'china_only') return place.cityEn === 'SHANGHAI';
  if (constraint === 'deep_night'){
    const minute = scenarioLocalMinute(scenario, place);
    return minute >= 22 * 60 || minute < 4 * 60;
  }
  return true;
}

function scenarioNeedsSharedRegion(scenario){
  return ['carrier'].includes(scenario.trueCause);
}

function assignScenarioPlaces(scenarios, random){
  const shuffledPlaces = shuffleScenarios(PLACE_POOL, random);
  const carrierCount = scenarios.filter(scenarioNeedsSharedRegion).length;
  const candidatesFor = scenario => shuffledPlaces.filter(place => {
    if (!placeAllowedForScenario(scenario, place)) return false;
    if (!scenarioNeedsSharedRegion(scenario) || carrierCount < 2) return true;
    return place.regionGroup && shuffledPlaces.filter(item => item.regionGroup === place.regionGroup).length >= carrierCount;
  });
  const ordered = scenarios.slice().sort((a,b) => candidatesFor(a).length - candidatesFor(b).length);
  const assigned = new Map();
  const used = new Set();
  const visit = index => {
    if (index === ordered.length) return true;
    const scenario = ordered[index];
    const sharedCarrierRegion = [...assigned.entries()].find(([id]) => {
      const other = scenarios.find(item => item.id === id);
      return other && scenarioNeedsSharedRegion(other);
    });
    for (const place of candidatesFor(scenario)){
      if (used.has(place.sourceScenarioId)) continue;
      if (scenarioNeedsSharedRegion(scenario) && carrierCount >= 2 && sharedCarrierRegion && place.regionGroup !== sharedCarrierRegion[1].regionGroup) continue;
      assigned.set(scenario.id, place);
      used.add(place.sourceScenarioId);
      if (visit(index + 1)) return true;
      assigned.delete(scenario.id);
      used.delete(place.sourceScenarioId);
    }
    return false;
  };
  if (!visit(0)) throw new Error('土地の割り当て条件を満たせません');
  return assigned;
}

function replaceScenarioTemplates(value, replacements){
  if (typeof value === 'string') return value.replace(/\{(city|country|carrier|region|wrongCountry|spouse|hotel|alternateHotel)\}/g, (_, key) => replacements[key]);
  if (Array.isArray(value)) return value.map(item => replaceScenarioTemplates(item, replacements));
  if (!value || typeof value !== 'object') return value;
  return Object.fromEntries(Object.entries(value).map(([key,item]) => [key,replaceScenarioTemplates(item,replacements)]));
}

function scenarioWithIdentityAndPlace(scenario, identity, place, wrongCountry){
  const replacements = {
    city:place.city,
    country:place.country,
    carrier:place.carrier,
    region:place.regionName,
    wrongCountry,
    hotel:place.hotelName,
    alternateHotel:place.alternateHotelName,
    /* §47: 配偶者の呼び方は客の性別で決まる。女性客なら「夫」、男性客なら「妻」。 */
    spouse:identity.gender === 'female' ? '夫' : '妻',
  };
  const assigned = replaceScenarioTemplates(scenario, replacements);
  return Object.assign(assigned, identity, {
    country:place.country,
    city:place.city,
    cityEn:place.cityEn,
    localOffset:place.localOffset,
    carrierName:place.carrier,
    regionGroup:place.regionGroup,
    regionName:place.regionName,
    hotelName:place.hotelName,
    alternateHotelName:place.alternateHotelName,
    placeSourceScenarioId:place.sourceScenarioId,
    wrongCountry,
  });
}

/* §47: 名前は14案件の並べ替えではなく、性別つきの候補48名から引く。
   性別を先に決め、その性別の候補のうち案件の年齢の幅と重なるものだけを対象にする。
   年齢は「案件の幅」と「名前の幅」が重なった範囲から引くので、71歳の「結衣」も
   24歳の「和子」も出ない。同じシフトで同じ名前は二度出ない。 */
function drawScenarioIdentities(scenarios, random){
  const usedNames = new Set();
  return scenarios.map(scenario => {
    const range = scenario.ageRange;
    const candidatesFor = want => NAME_POOL.filter(entry =>
      entry.gender === want && !usedNames.has(entry.name) &&
      entry.ageBand[0] <= range[1] && range[0] <= entry.ageBand[1]);
    const wanted = random() < 0.5 ? 'female' : 'male';
    /* その性別の候補が尽きたら、もう一方の性別から引く。台詞は {spouse} で追随する。 */
    const candidates = candidatesFor(wanted).length ? candidatesFor(wanted) : candidatesFor(wanted === 'female' ? 'male' : 'female');
    if (!candidates.length) throw new Error('名前の候補がありません: ' + scenario.id);
    const entry = candidates[Math.floor(random() * candidates.length)];
    usedNames.add(entry.name);
    const low = Math.max(range[0], entry.ageBand[0]);
    const high = Math.min(range[1], entry.ageBand[1]);
    return { name:entry.name, nameEn:entry.nameEn, age:low + Math.floor(random() * (high - low + 1)), gender:entry.gender };
  });
}

function assignScenarioIdentities(scenarios, random, flags = GAME_FLAGS){
  const identities = flags.shuffleIdentity ? drawScenarioIdentities(scenarios, random) : scenarios.map(scenario => ({name:scenario.name,nameEn:scenario.nameEn,age:scenario.age,gender:scenario.gender}));
  const assignedPlaces = flags.shuffleIdentity ? assignScenarioPlaces(scenarios, random) : new Map(scenarios.map(scenario => {
    const place = PLACE_POOL.find(item => item.sourceScenarioId === scenario.id);
    return [scenario.id, place];
  }));
  const wrongCountryOrder = shuffleScenarios(PLACE_POOL, random);
  return scenarios.map((scenario,index) => {
    const place = assignedPlaces.get(scenario.id);
    const wrongPlace = wrongCountryOrder.find(item => item.country !== place.country);
    return scenarioWithIdentityAndPlace(scenario, identities[index], place, wrongPlace.country);
  });
}

function prepareDailyScenarios(scenarios, random, flags = GAME_FLAGS){
  const count = dailyTicketCount(random, flags);
  const ordered = flags.shuffleArrival ? shuffleScenarios(scenarios, random) : scenarios.slice();
  const arrivalSlots = drawInboundArrivalTurns(count, random);
  const selected = ordered.slice(0, count).map((scenario, index) =>
    Object.assign({}, scenario, { arrive:arrivalSlots[index] })
  );
  return assignScenarioIdentities(selected, random, flags);
}

function drawHandoverCallbackTurns(count, inboundTurns, random){
  const candidates = [];
  for (let minute = 30; minute <= LAST_INBOUND_TURN; minute += 30){
    if (inboundTurns.every(turn => Math.abs(turn - minute) >= MIN_INBOUND_GAP)) candidates.push(minute);
  }
  const selected = shuffleScenarios(candidates, random).slice(0, count).sort((a,b) => a - b);
  if (selected.length !== count || selected.slice(1).some((turn,index) => turn - selected[index] < MIN_INBOUND_GAP)){
    throw new Error('引き継ぎの折り返し時刻を安全に割り当てられません');
  }
  return selected;
}

function prepareShiftScenarios(scenarios, random, flags = GAME_FLAGS){
  const inboundCount = dailyTicketCount(random, flags);
  const handoverCount = handoverTicketCount(random, flags);
  const total = inboundCount + handoverCount;
  const ordered = flags.shuffleArrival ? shuffleScenarios(scenarios, random) : scenarios.slice();
  const arrivalSlots = drawInboundArrivalTurns(inboundCount, random);
  const callbackTurns = drawHandoverCallbackTurns(handoverCount, arrivalSlots, random);
  const timed = ordered.slice(0, total).map((scenario,index) => index < inboundCount
    ? Object.assign({}, scenario, { workOrigin:'inbound', arrive:arrivalSlots[index] })
    : Object.assign({}, scenario, { workOrigin:'handover', arrive:callbackTurns[index - inboundCount], handoverCallbackTurn:callbackTurns[index - inboundCount] })
  );
  return assignScenarioIdentities(timed, random, flags);
}

/* §52: 圧縮した乱数を並べてから最小間隔を足す。これなら最後は06:00まで、
   各着信は20分以上離れ、案件定義の arrive には依存しない。 */
function drawInboundArrivalTurns(count, random){
  const freeMinutes = LAST_INBOUND_TURN - (count - 1) * MIN_INBOUND_GAP;
  const compressed = Array.from({ length:count }, () => Math.floor(random() * (freeMinutes + 1))).sort((a,b) => a - b);
  return compressed.map((minute,index) => minute + index * MIN_INBOUND_GAP);
}

/* ---------- キャリア記録 ---------- */

function freshCareerRecord(){
  return {
    version:CAREER_VERSION,
    shifts:[],
    stage:'probation',
    badges:[],
    solvedScenarios:[],
    ending:false,
    secretEnding:false,
    totals:{ days:0, averageCsat:0, complaints:0 },
  };
}

function normalizeCareerRecord(value){
  if (!value || typeof value !== 'object') return value;
  const next = JSON.parse(JSON.stringify(value));
  // v1公開済み記録には§28の2項目がないため、その場合だけ安全な初期値を補う。
  if (next.version === CAREER_VERSION && next.solvedScenarios === undefined) next.solvedScenarios = [];
  if (next.version === CAREER_VERSION && next.secretEnding === undefined) next.secretEnding = false;
  return next;
}

function validCareerRecord(value){
  if (!value || value.version !== CAREER_VERSION || !Array.isArray(value.shifts)) return false;
  if (!Object.prototype.hasOwnProperty.call(CAREER_STAGES, value.stage) || !Array.isArray(value.badges) || !Array.isArray(value.solvedScenarios) || typeof value.ending !== 'boolean' || typeof value.secretEnding !== 'boolean') return false;
  if (!value.totals || !Number.isInteger(value.totals.days) || value.totals.days < 0 || !Number.isFinite(value.totals.averageCsat) || !Number.isInteger(value.totals.complaints) || value.totals.complaints < 0) return false;
  const badgeIds = new Set(CAREER_BADGES.map(badge => badge.id));
  const scenarioIds = new Set(SCENARIOS.map(scenario => scenario.id));
  if (value.badges.some(id => !badgeIds.has(id)) || new Set(value.badges).size !== value.badges.length) return false;
  if (value.solvedScenarios.some(id => !scenarioIds.has(id)) || new Set(value.solvedScenarios).size !== value.solvedScenarios.length) return false;
  return value.shifts.every(shift => shift && typeof shift.endedAt === 'string' && !Number.isNaN(Date.parse(shift.endedAt)) &&
    Number.isInteger(shift.tickets) && shift.tickets >= 2 && shift.tickets <= 7 && /^[SABCDE]$/.test(shift.grade) &&
    shift.scores && ['csat','fcr','answer','cost','report'].every(key => Number.isFinite(shift.scores[key])) &&
    Number.isInteger(shift.complaints) && shift.complaints >= 0);
}

function careerWithFlags(record, flags = GAME_FLAGS){
  const next = JSON.parse(JSON.stringify(record));
  if (flags.careerStage !== null && Object.prototype.hasOwnProperty.call(CAREER_STAGES, flags.careerStage)) next.stage = flags.careerStage;
  if (Array.isArray(flags.unlockedBadges)){
    const known = new Set(CAREER_BADGES.map(badge => badge.id));
    next.badges = [...new Set(flags.unlockedBadges.filter(id => known.has(id)))];
  }
  if (Array.isArray(flags.solvedScenarios)){
    const known = new Set(SCENARIOS.map(scenario => scenario.id));
    next.solvedScenarios = [...new Set(flags.solvedScenarios.filter(id => known.has(id)))];
  }
  return next;
}

function solvedScenarioIdsFromTickets(tickets){
  return [...new Set(tickets.filter(ticket => {
    const result = ticket && ticket.result;
    return result && result.kind === 'closed';
  }).map(ticket => ticket.s.id))];
}

function careerEndingQueue(career){
  const queue = [];
  if (career.solvedScenarios.length === SCENARIOS.length && !career.ending) queue.push('career');
  if (career.badges.length === CAREER_BADGES.length && !career.secretEnding) queue.push('secret');
  return queue;
}

function gradeAtLeast(grade, minimum){
  const order = { E:0, D:1, C:2, B:3, A:4, S:5 };
  return Object.prototype.hasOwnProperty.call(order, grade) && order[grade] >= order[minimum];
}

function promotedCareerStage(stage, totalDays, recentShifts){
  const recent3 = recentShifts.slice(-3);
  if (stage === 'probation' && totalDays >= 3 && recent3.length === 3 && recent3.every(shift => gradeAtLeast(shift.grade, 'C'))) return 'employed';
  if (stage === 'employed' && totalDays >= 6 && recent3.length === 3 && recent3.every(shift => gradeAtLeast(shift.grade, 'B'))) return 'lead';
  return stage;
}

function earnedBadgeIds(career, shift, context){
  const resultKinds = context.resultKinds || [];
  const candidates = [];
  if ((context.maxStresses || []).length === shift.tickets && context.maxStresses.every(value => value <= 70)) candidates.push('quiet_night');
  if (context.redials === 0 && context.abandoned === 0) candidates.push('no_redial');
  if (context.noRefundsOrShipments) candidates.push('frugal');
  if (context.allResolved) candidates.push('all_first');
  if (resultKinds.includes('complaint') && resultKinds.includes('hangup')) candidates.push('storm');
  if (context.allRefunded) candidates.push('money_talks');
  if (career.totals.days >= 5) candidates.push('ten_nights');
  if (career.shifts.length >= 2 && career.shifts.slice(-2).every(item => item.complaints === 0)) candidates.push('clean_record');
  return candidates;
}

function appendCareerShift(record, shift, context){
  const career = JSON.parse(JSON.stringify(record));
  const previousStage = career.stage;
  career.shifts.push(shift);
  if (career.shifts.length > 30) career.shifts = career.shifts.slice(-30);
  const previousDays = career.totals.days;
  career.totals.days = previousDays + 1;
  career.totals.averageCsat = (career.totals.averageCsat * previousDays + shift.scores.csat) / career.totals.days;
  career.totals.complaints += shift.complaints;
  career.stage = promotedCareerStage(career.stage, career.totals.days, career.shifts);
  const earned = earnedBadgeIds(career, shift, context);
  const newBadges = earned.filter(id => !career.badges.includes(id));
  career.badges = [...new Set(career.badges.concat(newBadges))];
  career.solvedScenarios = [...new Set(career.solvedScenarios.concat(context.solvedScenarioIds || []))];
  const endingQueue = careerEndingQueue(career);
  return {
    career,
    previousStage,
    promoted:career.stage !== previousStage,
    newBadges,
    endingQueue,
  };
}

/* ---------- 時刻 ---------- */

function fmtClock(min){
  const h = Math.floor(min / 60) % 24;
  const m = min % 60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}
function localClock(t){
  return fmtClock(((state.clock + t.s.localOffset * 60) % 1440 + 1440) % 1440);
}

  const callbackTurn = handover ? s.handoverCallbackTurn : null;
  return {

    workOrigin:handover ? 'handover' : 'inbound', handover, handoverAttempted:false,
    facts:[], asked:new Set(), askCounts:new Map(), questionCount:0, lookedUp:new Set(), tested:new Set(), testCounts:new Map(),
    transcript:[], callTranscriptStart:0, greeted:handover, identified:handover, nameKnown:handover, destinationKnown:handover,
    stress:TYPES[s.type].stressStart, maxStress:TYPES[s.type].stressStart, soothed:new Map(), smalltalkCounts:new Map(),
    speechTurns:{ irritated:0, angry:0, furious:0 }, callMinutes:0, inboundMinutes:0, outboundMinutes:0, callSegmentMinutes:0, callDirection:'inbound', holdMinutes:0,
    callChargeConcerned:false, callChargeThresholdPassed:false,
    callbackCount:0, callbackDue:handover ? SHIFT_START + callbackTurn : null, callbackLate:false, callbackKind:handover ? 'handover' : null, callbackDestination:handover ? 'direct' : null, callbackPenalty:0, callbackLookupCount:0, callbackWaitStressApplied:false, callbackReliefApplied:false, stayHintDelivered:false, carrierLookupStarted:false,
    callbackReason:handover ? 'handover' : null, callbackStage:handover ? 'scheduled' : null, callbackPromised:handover ? 'day_shift' : null, returnTimeKnown:handover, frontDeskAttempts:0,
    carrierReplyStatus:null, carrierRestored:false, carrierRequestAttempts:0,
    stayAddress:null, stayHotelName:null, stayDaysKnown:false, replacementConsentKnown:false, deliveryAddressConfirmed:false, shipment:null, apologies:new Map(),
    misdiagnoses:0, damage:0, wasted:0, symptomResolved:false, refundProposalRejected:false, result:null, pendingResult:null, pendingInterruption:false, pendingConversation:null,
