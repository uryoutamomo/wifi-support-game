  state.desk = null;
  state.slogan = SLOGANS[Math.floor(state.random() * SLOGANS.length)];
  state.report = null;
  state.careerUpdate = null;
  state.officeEvents = [];
}

function recordOfficeEvent(kind, text){
  state.officeEvents.push({ kind, text });
  if (state.officeEvents.length > 6) state.officeEvents.shift();
}

function carrierReplyProbability(flags = GAME_FLAGS){
  return flags.luckRate === 1 ? 1 : CARRIER_REPLY_RATE;
}

function carrierReference(t){
  const match = t && t.s && t.s.contractId && String(t.s.contractId.text).match(/GDW-\d+/);
  return match ? match[0] : (t && t.s ? t.s.id : '番号不明');
}

function resolveCarrierRequest(t){
  if (!t || !t.carrierLookupStarted || t.carrierReplyStatus !== 'pending' || state.clock < t.callbackDue) return false;
  const arrived = state.random() < carrierReplyProbability();
  t.carrierReplyStatus = arrived ? 'arrived' : 'missing';
  if (arrived){
    recordOfficeEvent('carrier', '[現地キャリア] 回線の再開通を完了しました（' + carrierReference(t) + '）');
  } else {
    recordOfficeEvent('carrier', '[現地キャリア] 30分経過しましたが完了連絡は届いていません（' + carrierReference(t) + '）');
  }
  return true;
}

/* ---------- ターン進行 ---------- */

function activateDueInbound(){
  let activated = 0;
  state.tickets.forEach(t => {
    if (t.state === 'inbound' && t.arrivedTurn <= state.turn){
      t.state = 'waiting';
      activated++;
    }
  });
  return activated;
}

function advance(turns){
  if (turns === 0) activateDueInbound();
  for (let i = 0; i < turns; i++){
    state.turn++;
    state.clock += TURN_MIN;

    state.tickets.forEach(t => resolveCarrierRequest(t));

    // すでに待っている呼だけが、この1分の待ち時間を消費する
    state.tickets.forEach(t => {
      if (t.state === 'waiting') t.patience -= 100 / t.s.abandonAfter;
      else if (t.state === 'callback' && state.clock > t.callbackDue) t.patience -= 100 / CALLBACK_OVERDUE_MIN;
      if (t.patience <= 0 && (t.state === 'waiting' || t.state === 'callback')){
        t.patience = 0;
        t.state = 'closed';
        t.result = { kind:'abandoned', csat:0, label:'放棄呼', firstCallResolved:false };
        playCloseJingle(t.result);
        recordOfficeEvent('abandoned', t.s.id + '：応答前に切断され、放棄呼になりました。');
      }
    });

    // この分に到着した呼は、次の1分から待ち時間を消費する
    activateDueInbound();
  }
}

function addFact(t, fact, src){
  t.facts.push({ text:fact.text, src:src, out:fact.out || [], hot:fact.hot || [] });
  if (t === state.focus) playClueSound();
}

/* ---------- 広域障害の判明（シフトの山場） ---------- */

function triggerOutage(origin){
  if (state.outageKnown) return;
  state.outageKnown = true;
  state.outageRegion = origin.s.regionName || origin.s.country;
  origin.transcript.push({ who:'note', text:'[全社通知] ' + state.outageRegion + ' 提携キャリアの広域障害を確認。同一エリアの他チケットにも当てはまります。' });

  state.tickets.forEach(t => {
    if (t === origin) return;
    if (t.s.trueCause !== 'carrier') return;
    if (t.state === 'closed') return;
    t.transcript.push({ who:'sys', text:'[全社通知] ' + state.outageRegion + ' 提携キャリアの広域障害を確認。同一エリアからの入電はこの障害による可能性が高い。' });
    addFact(t, { text:'同じエリアで広域障害が確認された', hot:['carrier'], out:['sim','coverage','provision','device_side','device_net'] }, '全社通知');
  });
}

/* ---------- プレイヤーの行動 ---------- */

function pickup(t){
  if (state.focus) return;
  playPickupSound();
  t.state = 'open';
  t.callDirection = 'inbound';
  t.callSegmentMinutes = 0;
  t.callbackStage = null;
  t.callTranscriptStart = t.transcript.length;
  deliverCustomerOpening(t, true);
  state.focus = t;
  state.ui = defaultUi();
  enterCall();
}

function greetCurrentCustomer(){
  const t = state.focus;
  if (!t || t.greeted) return;
  t.greeted = true;
  t.transcript.push({
    who:'me',
    text:t.redialGreeting ? CALL_FLOW_LINES.redialGreeting : 'お電話ありがとうございます。グローバルデスクでございます',
  });
  t.redialGreeting = false;
  deliverCustomerOpening(t, false);
  render();
}

function resumeCallback(t){
  if (state.focus || !t || t.state !== 'callback' || state.clock < t.callbackDue) return;
  playPickupSound();
  t.callbackLate = state.clock > t.callbackDue;
  t.state = 'open';
  t.callDirection = 'outbound';
  t.callSegmentMinutes = 0;
  t.callbackStage = 'front_desk';
  t.frontDeskAttempts = 0;
  t.callTranscriptStart = t.transcript.length;
  state.focus = t;
  resolveCarrierRequest(t);
  t.transcript.push({ who:'front', text:CALL_FLOW_LINES.frontDesk.greeting + (isLateLocalTime(t) ? ' ' + CALL_FLOW_LINES.frontDesk.lateQuestion : '') });
  state.ui = defaultUi();
  enterCall();
}

function callbackCustomerReply(t){
  const carrierResult = (t.s.lookups || {}).l_carrier;
  if (t.callbackReason === 'carrier' && t.carrierReplyStatus === 'arrived' && carrierResult && carrierResult.restores) return CALL_FLOW_LINES.carrier.reopenedReplies[t.s.type];
  if (t.callbackReason === 'carrier' && t.carrierReplyStatus === 'missing') return CALL_FLOW_LINES.carrier.pendingReplies[t.s.type];
  return CALL_FLOW_LINES.callback.replies[t.s.type];
}

function handleFrontDeskChoice(choice){
  const t = state.focus;
  if (!t || t.callbackStage !== 'front_desk' || !['guest','room','callback'].includes(choice)) return;
  if (choice === 'guest' && !t.nameKnown) return;
  if (choice === 'room' && !hotelRoom(t)) return;
  const option = CALL_FLOW_LINES.frontDesk.options[choice]
    .replace('{name}', t.s.nameEn)
    .replace('{room}', hotelRoom(t) || 'the guest room');
  t.transcript.push({ who:'me', text:option });
  const late = isLateLocalTime(t);
  const direct = choice === 'callback';
  t.frontDeskAttempts++;
  if (!spendOnCall(t, late && !direct ? 2 : 1, 0)){ render(); return; }
  const frontReply = late && !direct ? CALL_FLOW_LINES.frontDesk.delayedConnect : CALL_FLOW_LINES.frontDesk.connect;
  pushFlowLines(t, [
    { who:'front', text:frontReply },
    { who:'cust', text:callbackCustomerReply(t) },
  ]);
  t.callbackStage = 'connected';
  finishCarrierLookup(t);
  state.ui = defaultUi();
  render();
}

function callbackOperatorLine(t){
  const wrong = t.callbackDestination !== t.s.callbackTo;
  if (t.callbackLate && wrong) return t.callbackDestination === 'hotel' ? CALL_FLOW_LINES.callback.lateWrongHotel : CALL_FLOW_LINES.callback.lateWrongMobile;
  if (wrong) return t.callbackDestination === 'hotel' ? CALL_FLOW_LINES.callback.wrongHotel : CALL_FLOW_LINES.callback.wrongMobile;
  return t.callbackLate ? CALL_FLOW_LINES.callback.late : CALL_FLOW_LINES.callback.normal;
}

function spendOnCall(t, minutes, holdMinutes){
  const before = t.callMinutes;
  const inboundBefore = t.inboundMinutes || 0;
  t.callMinutes += minutes;
  t.callSegmentMinutes = (t.callSegmentMinutes || 0) + minutes;
  if (t.callDirection === 'outbound') t.outboundMinutes = (t.outboundMinutes || 0) + minutes;
  else t.inboundMinutes = inboundBefore + minutes;
  t.holdMinutes += holdMinutes || 0;
  advance(minutes);
  if (!t.callChargeConcerned && t.callDirection === 'inbound' && inboundBefore <= 5 && t.inboundMinutes > 5 && t.state === 'open' && !t.pendingResult){
    t.callChargeConcerned = true;
    pushCustomerLine(t, CALL_FLOW_LINES.callChargeConcern[t.s.type], { plain:true });
    if (!changeStress(t, 4, true)) return false;
  }
  const longMinutes = Math.max(0, t.callMinutes - 10) - Math.max(0, before - 10);
  if (longMinutes && t.state === 'open') addStress(t, longMinutes * 2);
  return t.state === 'open' && !t.pendingResult;
}

function addStress(t, base, miss, expectedOutcome){
  const type = TYPES[t.s.type];
  return changeStress(t, base * type.stressRate * (miss ? type.missRate : 1), expectedOutcome);
}
function changeStress(t, delta, expectedOutcome = rollLuck()){
  const previousStress = t.stress;
  if (!expectedOutcome) delta = 0;
  t.stress = clamp(t.stress + delta, 0, 100);
  t.maxStress = Math.max(t.maxStress, t.stress);
  if (previousStress <= 80 && t.stress > 80) playStressWarning();
  if (t.stress >= 100 && t.state === 'open' && !t.pendingResult){
    endAngryCall(t, 'stress');
  }
  return t.state === 'open' && !t.pendingResult;
}

function angryOutcomeKind(t){
  const normal = ANGRY_DEFAULT_OUTCOMES[t.s.type];
  if (rollLuck()) return normal;
  return normal === 'complaint' ? 'hangup' : 'complaint';
}

function endAngryCall(t, reason){
  const kind = angryOutcomeKind(t);
  pushFlowLines(t, [
    { who:'cust', text:ANGRY_END_LINES[t.s.type][kind] },
    { who:'me', text:CALL_FLOW_LINES.ending[kind] },
  ]);
  t.transcript.push({
    who:'note',
    text:kind === 'complaint'
      ? 'お客様は強い苦情を述べて通話を終えました。'
      : 'お客様は一方的に通話を切りました。',
  });
  t.pendingResult = {
    kind,
    reason,
    csat:kind === 'complaint' ? 1.0 : 0.5,
    label:kind === 'complaint' ? 'クレーム終話' : '一方的な切断',
    firstCallResolved:false,
  };
  t.pendingConversation = null;
  state.ui = defaultUi();
  render();
  return false;
}
function stressPenalty(v){ return v <= 25 ? 0 : v <= 50 ? .3 : v <= 70 ? .8 : v <= 90 ? 1.5 : 2.2; }

function stressSpeechStage(value){
  if (value <= 50) return null;
  if (value <= 70) return 'irritated';
  if (value <= 90) return 'angry';
  return 'furious';
}

function stressLeadIn(t){
  const stage = stressSpeechStage(t.stress);
  if (!stage) return '';
  const turn = t.speechTurns[stage] || 0;
  t.speechTurns[stage] = turn + 1;
  if (stage === 'irritated' && turn % 2 === 1) return '';
  const lines = TYPES[t.s.type][stage];
  const index = stage === 'irritated' ? Math.floor(turn / 2) : turn;
  return lines[index % lines.length];
}

function pushCustomerLine(t, text, options){
  const lead = options && options.plain ? '' : stressLeadIn(t);
  t.transcript.push({ who:'cust', text:lead ? lead + ' ' + text : text });
}

function pushFlowLines(t, lines){
  if (lines.length > 2) throw new Error('追加会話は1操作につき最大2行です');
  lines.forEach(line => {
    if (line.who === 'cust') pushCustomerLine(t, line.text, { plain:true });
    else t.transcript.push({ who:line.who, text:line.text });
  });
}

function advanceConversationFlow(t){
  if (!t || pendingTypedLine(t) || !t.pendingConversation) return false;
  if (t.pendingConversation.kind === 'second_misdiagnosis'){
    const reason = t.pendingConversation.reason;
    t.pendingConversation = null;
    endAngryCall(t, reason);
    return true;
  }
  return false;
}

function customerHasSpoken(t){
  const start = Number.isInteger(t.callTranscriptStart) ? t.callTranscriptStart : 0;
  return t.transcript.slice(start).some(line => line.who === 'cust');
}

function askStressBase(t, base){
  const count = t.questionCount || t.asked.size;
  return base + Math.max(0, count - 1) * 2;
}

function customerSpeaksBeforeGreeting(t){
  return t.s.type === 'hurried';
}

function deliverCustomerOpening(t, beforeGreeting){
  if (t.redialOpening){
    if (!beforeGreeting || customerSpeaksBeforeGreeting(t)){
      pushCustomerLine(t, t.redialOpening, { plain:true });
      t.redialOpening = null;
      t.redialSpoken = beforeGreeting;
    }
    return;
  }
  if (beforeGreeting){
    if (customerSpeaksBeforeGreeting(t)){
      pushCustomerLine(t, t.s.opening);
      t.destinationKnown = DESTINATION_IN_OPENING.has(t.s.id);
    }
    return;
  }
  if (t.redialSpoken){ t.redialSpoken = false; return; }
  if (customerSpeaksBeforeGreeting(t)){
    pushCustomerLine(t, t.s.rushedReply, { plain:true });
    return;
  }
  pushCustomerLine(t, t.s.opening);
  t.destinationKnown = DESTINATION_IN_OPENING.has(t.s.id);
}

function identificationReady(t){
  return t.identified || (t.nameKnown && t.destinationKnown);
}

function requireIdentification(t){
  if (identificationReady(t)) return true;
  state.ui = defaultUi('identity_denied');
  render();
  return false;
}

function identityQuestionStress(t, qid, normalBase){
  if (!['q_name','q_contract'].includes(qid) || t.stress < 50) return addStress(t, normalBase);
  const delta = IDENTITY_CALMING_EFFECTS[t.s.type];
  if (delta === 0) return changeStress(t, 0, true);
  const expectedOutcome = rollLuck();
  return expectedOutcome
    ? changeStress(t, delta, true)
    : addStress(t, normalBase, false, true);
}

function repeatedQuestionReply(t){
  return {
    anxious:'先ほどお答えした内容では足りませんでしたか…？',
    novice:'あら、さっきも同じことをお話ししたと思うのですが。',
    expert:'それは回答済みです。記録を確認してください。',
    hurried:'同じ質問はもう答えました。先に進めてください。',
  }[t.s.type];
}

function topicAvailable(t, topic){
  if (topic.reveal === 'opening') return customerHasSpoken(t);
  return t.asked.has(topic.reveal);
}

function smalltalkResult(t, topic, mode, times){
  const scaled = t.stress >= 40;
  let delta = scaled ? 8 : SMALLTALK_EFFECTS[t.s.type];
  if (times > 0) delta = delta / 2 + 5;
  if (mode === 'ask') delta *= 1.5;
  const reply = scaled
    ? 'あの、それより通信のほうを…'
    : delta < 0 ? topic.goodReply : topic.badReply;
  return flipReaction({ delta, scaled, reply }, topic.goodReply, topic.badReply);
}

function flipReaction(result, goodReply, badReply){
  if (rollLuck()) return result;
  const reversed = {
    delta:result.delta === 0 ? 0 : -result.delta,
    reply:result.delta < 0 ? badReply : goodReply,
  };
  if (typeof result.csat === 'number') reversed.csat = -result.csat;
  return Object.assign({}, result, reversed);
}

function applyReactionStress(t, result){
  return result.scaled
    ? addStress(t, result.delta, false, true)
    : changeStress(t, result.delta, true);
}

function doSmalltalk(topicId, mode){
  const t = state.focus;
  const topic = t && (t.s.smalltalk || []).find(item => item.id === topicId);
  if (!t || !topic || !['ask','tell'].includes(mode) || !topicAvailable(t, topic)) return;
  const times = t.smalltalkCounts.get(topicId) || 0;
  t.smalltalkCounts.set(topicId, times + 1);
  t.transcript.push({ who:'me', text:mode === 'ask' ? topic.askLabel : topic.tellLabel });
  const result = smalltalkResult(t, topic, mode, times);
  pushCustomerLine(t, result.reply);
  if (!applyReactionStress(t, result)) return;
  if (!spendOnCall(t, 1, 0)) return;
  state.ui = defaultUi();
  render();
}

function sootheResult(t, id, times){
  const goodReply = TYPES[t.s.type].sootheReply;
  const badReply = TYPES[t.s.type].sootheMissReply;
  if (t.stress < 40) return flipReaction({ delta:8, scaled:true, reply:badReply }, goodReply, badReply);
  let delta = SOOTHE_EFFECTS[t.s.type][id];
  if (times) return flipReaction({ delta:delta / 2 + 5, scaled:false, reply:TYPES[t.s.type].sootheRepeatReply }, goodReply, badReply);
  return flipReaction({ delta, scaled:false, reply:delta < 0 ? goodReply : badReply }, goodReply, badReply);
}

function doSoothe(id){
  const t = state.focus, s = SOOTHES.find(x => x.id === id); if (!t || !s) return;
  const times = t.soothed.get(id) || 0; t.soothed.set(id, times + 1);
  t.transcript.push({ who:'me', text:s.label });
  const result = sootheResult(t, id, times);
  pushCustomerLine(t, result.reply);
  if (!applyReactionStress(t, result)) return;
  if (!spendOnCall(t, 1, 0)) return;
  state.ui = defaultUi(); render();
}

function doApologize(id){
  const t = state.focus;
  const apology = APOLOGIES.find(item => item.id === id);
  if (!t || !apology) return;
  const previous = t.apologies.get(id) || 0;
  t.apologies.set(id, previous + 1);
  t.transcript.push({ who:'me', text:apology.label });
  let delta = 0;
  const replies = APOLOGY_REPLIES[t.s.type];
  let reply = replies.brief;
  if (apology.kind === 'brief'){
    if (t.stress > 50){ delta = -6; reply = replies.brief; }
  } else if (previous > 0){
    delta = 10;
    reply = replies.repeated;
  } else if (t.stress >= 40){
    delta = -20;
    reply = replies.accepted;
  } else {
    delta = 12;
    reply = replies.excessive;
  }
  const goodReply = replies.accepted;
  const badReply = replies.excessive;
  const result = flipReaction({ delta, scaled:false, reply }, goodReply, badReply);
  pushCustomerLine(t, result.reply);
  if (!applyReactionStress(t, result)) return;
  if (!spendOnCall(t, apology.minutes, 0)) return;
  state.ui = defaultUi(); render();
}

function openLookup(){
  const t = state.focus;
  if (!t || !requireIdentification(t)) return;
  state.ui = defaultUi('lookup');
  render();
}

/* ---------- 折り返し待ちのあいだ、デスク端末で調べる ----------
   相手を待たせているのは通話ではないので、ストレスは増えない。
   ただし時間は進むので、折り返しが約束の時刻に遅れる危険はそのまま残る。 */

function deskTickets(){
  return state.tickets.filter(t => t.state === 'callback').sort((a, b) => a.callbackDue - b.callbackDue);
}

function deskTicket(){
  if (!state.desk || !state.desk.ticketId) return null;
  return deskTickets().find(t => t.s.id === state.desk.ticketId) || null;
}

function openDeskLookup(){
  const list = deskTickets();
  if (!list.length || state.focus) return;
  state.desk = { ticketId:list.length === 1 ? list[0].s.id : null };
  enterDesk();
}

function selectDeskTicket(id){
  if (!state.desk) return;
  state.desk.ticketId = (id === '__back') ? null : id;
  renderDesk();
}

function closeDeskLookup(){
  state.desk = null;
  enterOffice();
}

function doDeskLookup(lid){
  const t = deskTicket();
  if (!t || state.busy) return;
  const l = LOOKUPS.find(x => x.id === lid);
  if (!l || l.external || t.lookedUp.has(lid) || !identificationReady(t)) return;
  t.lookedUp.add(lid);
  const r = (t.s.lookups || {})[lid];
  if (r){
    t.transcript.push(lookupSystemLine(l, r));
    if (r.fact) addFact(t, r.fact, 'デスク端末で照会');
    if (r.outage) triggerOutage(t);
  } else {
    t.transcript.push(lookupSystemLine(l, null));
    if (l.missFact) addFact(t, l.missFact, 'デスク端末で照会');
    else t.wasted++;
  }
  advance(DESK_LOOKUP_MINUTES);
  // 時間を進めた結果、折り返しの相手が待ちきれずに切っていることがある。
  if (t.state !== 'callback'){ closeDeskLookup(); return; }
  renderDesk();
}

function openRecord(){
  const t = state.focus;
  if (!t || !requireIdentification(t)) return;
  pushFlowLines(t, [{ who:'me', text:CALL_FLOW_LINES.recordStart }]);
  t.transcript.push({ who:'note', text:'ログを1分かけて確認しました。' });
  if (!addStress(t, 4)) return;
  if (!spendOnCall(t, 1, 0)) return;
  state.ui = defaultUi('record');
  render();
}

function refundResponsibility(causeId){
  return ['company','neutral','customer'].find(group => REFUND_POLICY[group].causes.includes(causeId));
}

function refundSatisfied(causeId){
  const group = refundResponsibility(causeId);
  if (GAME_FLAGS.luckRate === 1) return group === 'company';
  return state.random() < REFUND_POLICY[group].satisfactionRate;
}

function refundProposalRejected(causeId){
  const group = refundResponsibility(causeId);
  if (GAME_FLAGS.luckRate === 1) return false;
  return state.random() < REFUND_POLICY[group].rejectionRate;
}

function doRefund(){
  const t = state.focus;
  if (!t || state.ui.tab !== 'refund_confirm' || t.refundProposalRejected) return;
  if (refundProposalRejected(t.s.trueCause)){
    t.refundProposalRejected = true;
    t.transcript.push({ who:'me', text:'ご不便のお詫びとして、今回のご利用料金から2,400円の返金をご提案いたします。' });
    pushCustomerLine(t, TYPES[t.s.type].refundRejectReply, { plain:true });
    if (!spendOnCall(t, 2, 0)){ render(); return; }
    if (!addStress(t, 18)){ render(); return; }
    state.ui = defaultUi();
    render();
    return;
  }
  const satisfied = refundSatisfied(t.s.trueCause);
  state.cost += REFUND_POLICY.amount;
  t.transcript.push({ who:'me', text:'ご不便のお詫びとして、今回のご利用料金から2,400円を返金いたします。' });
  if (satisfied){
    pushCustomerLine(t, '返金の件、分かりました。それなら今回は受け取ります。', { plain:true });
    pushCustomerLine(t, farewellLine(t.s, 'partial'), { plain:true });
  } else {
    pushCustomerLine(t, 'お金の話ではなく、いま使えないことに困っているんです。これで終わりには納得できません。', { plain:true });
  }
  pushFlowLines(t, [{
    who:'me',
    text:satisfied ? CALL_FLOW_LINES.ending.refundSatisfied : CALL_FLOW_LINES.ending.refundDissatisfied,
  }]);
  t.pendingResult = {
    kind:'refunded', satisfied, csat:satisfied ? 3.0 : 1.0,
    label:satisfied ? '返金で終結（満足）' : '返金で終結（不満）', firstCallResolved:false,
  };
  state.ui = defaultUi();
  render();
}

function doAsk(qid){
  const t = state.focus;
  const q = QUESTIONS.find(x => x.id === qid);
  if (!t || !q || (q.needsDevice && !t.s.deviceInHand)) return;
  const previous = t.askCounts.get(qid) || 0;
  t.askCounts.set(qid, previous + 1);
  t.questionCount++;
  t.asked.add(qid);
  t.transcript.push({ who:'me', text:q.label });
  if (previous > 0){
    pushCustomerLine(t, repeatedQuestionReply(t));
    t.wasted++;
    if (!addStress(t, askStressBase(t, 10), true)) return;
    if (!spendOnCall(t, 1, 0)) return;
    state.ui = defaultUi(); render(); return;
  }
  if (qid === 'q_contract'){
    pushCustomerLine(t, t.s.contractId.text);
    t.identified = true; t.nameKnown = true; t.destinationKnown = true;
    if (!identityQuestionStress(t, qid, t.s.contractId.minutes * 3)) return;
    if (!spendOnCall(t, t.s.contractId.minutes, 0)) return;
    state.ui = defaultUi(); render(); return;
  }

  if (qid === 'q_name'){
    pushCustomerLine(t, t.s.name + 'です。');
    t.nameKnown = true;
    if (!identityQuestionStress(t, qid, askStressBase(t, 3))) return;
  } else if (qid === 'q_destination'){
    if (t.destinationKnown){
      pushCustomerLine(t, q.miss); t.wasted++; if (!addStress(t, askStressBase(t, 14), true)) return;
    } else {
      pushCustomerLine(t, t.s.city + 'です。'); t.destinationKnown = true; if (!addStress(t, askStressBase(t, 3))) return;
    }
  } else {
  const r = (t.s.replies || {})[qid];
  if (r){
    pushCustomerLine(t, r.text);
    if (r.fact) addFact(t, r.fact, '聞き取り');
    if (qid === 'q_stay') t.stayAddress = r.text;
    if (qid === 'q_stay_length') t.stayDaysKnown = true;
    if (qid === 'q_replacement') t.replacementConsentKnown = true;
  } else {
    pushCustomerLine(t, q.miss);
    t.wasted++;
  }
    if (!addStress(t, askStressBase(t, r ? 3 : 9), !r)) return;
    if (t.s.techPenalty && !r) t.wasted++;
  }
  t.identified = identificationReady(t);

  if (!spendOnCall(t, 1, 0)) return;
  state.ui = defaultUi();
  render();
}

function doLookup(lid, mode){
  const t = state.focus;
  if (!t || state.busy || !['hold','talk'].includes(mode)) return;
  const l = LOOKUPS.find(x => x.id === lid);
  if (!l || t.lookedUp.has(lid)) return;
  if (l.external) return;
  if (!t.identified) return;
  const minutes = mode === 'hold' ? 2 : 3;
  const hold = mode === 'hold' ? 2 : 0;
  if (!addStress(t, mode === 'hold' ? 7 : 3)) return;

  state.busy = true;
  state.holdVisual = mode === 'hold';
  pushFlowLines(t, [{ who:'me', text:mode === 'hold' ? CALL_FLOW_LINES.lookup.holdStart : CALL_FLOW_LINES.lookup.talkStart }]);
  t.transcript.push({ who:'note', text:mode === 'hold' ? 'お客さまを保留にして社内照会を始めました。' : 'お客さまと話しながら社内照会を始めました。' });
  render();

  setTimeout(() => finishLookup(t, l, minutes, hold), mode === 'hold' ? 420 : 0);
}

function lookupSystemLine(lookup, result){
  return {
    who:'sys',
    typed:true,
    text:result ? result.text : lookup.defaultResult,
    viz:result && result.viz ? result.viz : null,
    lookupId:lookup.id,
    lookupTitle:lookup.title,
    external:Boolean(lookup.external),
  };
}

function finishLookup(t, l, minutes, hold){
  if (state.focus !== t || t.state !== 'open'){
    state.busy = false;
    state.holdVisual = false;
    return;
  }
  const lid = l.id;
  t.lookedUp.add(lid);

  const r = (t.s.lookups || {})[lid];
  if (r){
    t.transcript.push(lookupSystemLine(l, r));
    if (r.fact) addFact(t, r.fact, '社内照会');
    if (r.outage) triggerOutage(t);
  } else {
    t.transcript.push(lookupSystemLine(l, null));
    if (l.missFact) addFact(t, l.missFact, '社内照会');
    else t.wasted++;
  }

  const continued = spendOnCall(t, minutes, hold);
  state.busy = false;
  state.holdVisual = false;
  if (!continued){ render(); return; }
  // 照会しただけで結果を客へ読み上げない。何をどう伝えるかは「伝える」で選ぶ。
  pushFlowLines(t, [{ who:'me', text:hold ? CALL_FLOW_LINES.lookup.holdComplete : CALL_FLOW_LINES.lookup.talkComplete }]);
  if (r && r.customerReply){
    pushCustomerLine(t, r.customerReply);
    if (!addStress(t, r.stressDelta || 0, false, true)){ render(); return; }
  }
  state.ui = defaultUi();
  render();
}

function finishCarrierLookup(t){
  if (!t || !t.carrierLookupStarted || t.lookedUp.has('l_carrier') || !['arrived','missing'].includes(t.carrierReplyStatus)) return false;
  const l = LOOKUPS.find(item => item.id === 'l_carrier');
  if (!l) return false;
  t.carrierLookupStarted = false;
  const result = (t.s.lookups || {})[l.id];
  if (t.carrierReplyStatus === 'arrived' && result){
    t.lookedUp.add(l.id);
    t.transcript.push(lookupSystemLine(l, result));
    if (result.fact) addFact(t, result.fact, '現地キャリア照会');
    if (result.restores){
      t.carrierRestored = true;
      t.symptomResolved = true;
    }
  } else if (t.carrierReplyStatus === 'arrived') {
    t.lookedUp.add(l.id);
    t.transcript.push(lookupSystemLine(l, null));
    if (l.missFact) addFact(t, l.missFact, '現地キャリア照会');
    else t.wasted++;
  } else {
    t.transcript.push({ who:'sys', text:'[現地キャリア] 完了連絡なし。回線はまだ再開通されていません。' });
  }
  return true;
}

function doTest(tid){
  const t = state.focus;
  const risky = RISKY.find(x => x.id === tid);
  const test = risky || TESTS.find(x => x.id === tid);
  if (!t || !test || (test.needsDevice && !t.s.deviceInHand)) return;
  const previous = t.testCounts.get(tid) || 0;
  const attempt = previous + 1;
  t.testCounts.set(tid, attempt);
  t.tested.add(tid);
  t.transcript.push({ who:'me', text:test.label });
  t.transcript.push({ who:'note', text:test.wait + '（所要' + test.turns + '分。通話はつないだままです）' });
  if (!addStress(t, (risky ? 25 : test.turns * 3) + previous * 4)) return;

  const testDef = risky ? null : (t.s.tests || {})[tid];
  const sequence = testDef && testDef.sequence;
  const def = sequence ? sequence[Math.min(previous, sequence.length - 1)] : testDef;
  const redundant = previous > 0 && (!sequence || previous >= sequence.length);
  if (!spendOnCall(t, test.turns, 0)) return;

  if (risky){
    pushCustomerLine(t, risky.result);
    t.transcript.push({ who:'note', text:'【まずい対応】' + risky.note });
    t.damage += risky.damage;
    playBadActionSound();
  } else if (def && !redundant){
    pushCustomerLine(t, def.solves ? TYPES[t.s.type].solvedReply : def.text);
    t.transcript.push({ who:'note', text:'操作結果：' + def.text });
    if (def.fact) addFact(t, def.fact, '操作の結果');
    if (def.solves) t.symptomResolved = true;
  } else {
    pushCustomerLine(t, previous > 0 ? '同じ操作はもう行いました。もう一度やっても変わりません。' : 'やってみましたが、変わりませんでした。');
    t.transcript.push({ who:'note', text:'操作結果：症状に変化はありませんでした。' });
    t.wasted++;
  }
  state.ui = defaultUi();
  render();
}

function startCarrierCallback(destination){
  const t = state.focus;
  const lookup = LOOKUPS.find(item => item.id === 'l_carrier');
  if (!t || !lookup || state.ui.tab !== 'lookup' || state.ui.lookup !== lookup.id || t.carrierLookupStarted || t.lookedUp.has(lookup.id)) return;
  if (destination !== 'hotel' || !t.asked.has('q_stay')){ render(); return; }
  pushFlowLines(t, [
    { who:'me', text:CALL_FLOW_LINES.carrier.promise },
    { who:'cust', text:CALL_FLOW_LINES.carrier.consent },
  ]);
  t.transcript.push({ who:'note', text:'ホテルへ30分後に折り返す約束と、現地キャリアへの再開通依頼を記録しました。' });
  t.callbackCount++;
  t.callbackDestination = 'hotel';
  t.callbackReason = 'carrier';
  t.callbackStage = null;
  t.carrierLookupStarted = true;
  t.carrierReplyStatus = 'pending';
  t.carrierRequestAttempts++;
  if (!spendOnCall(t, 1, 0)) return;
  t.callbackDue = state.clock + lookup.minutes;
  t.state = 'callback';
  state.focus = null;
  state.ui = defaultUi();
  playDisconnectSound();
  enterOffice();
}

function startHotelCallback(){
  const t = state.focus;
  if (!t || t.pendingResult || t.pendingInterruption || t.callbackStage === 'front_desk') return;
  pushFlowLines(t, [
    { who:'me', text:CALL_FLOW_LINES.callback.promise },
    { who:'cust', text:CALL_FLOW_LINES.callback.consent },
  ]);
  // 滞在先を聞かずに切ると、折り返す先がない。客が自分から掛け直してきて責める。
  if (!t.asked.has('q_stay') || !t.stayAddress){ blindCallbackRedial(t); return; }
  t.transcript.push({ who:'note', text:'お客様の国際通話料を止め、ホテルへ折り返す約束を記録しました。' });
  t.callbackCount++;
  t.callbackDestination = 'hotel';
  t.callbackReason = 'general';
  t.callbackStage = null;
  if (!spendOnCall(t, 1, 0)) return;
  t.callbackDue = state.clock;
  t.state = 'callback';
  state.focus = null;
  state.ui = defaultUi();
  playDisconnectSound();
  enterOffice();
}

/* 折り返しを約束しながら滞在先を持たずに切った場合。折り返せないので、客から掛かってくる。 */
function blindCallbackRedial(t){
  t.transcript.push({ who:'note', text:CALL_FLOW_LINES.callback.noAddressNote });
  t.callbackPenalty = (t.callbackPenalty || 0) + BLIND_CALLBACK_CSAT_PENALTY;
  if (!spendOnCall(t, 1, 0)) return;
  if (!addStress(t, BLIND_CALLBACK_STRESS)){ render(); return; }
  t.redialCount++;
  t.state = 'waiting';
  t.arrivedTurn = state.turn;
  t.greeted = false;
  t.redialOpening = CALL_FLOW_LINES.callback.blameOpenings[t.s.type];
  t.redialSpoken = false;
  t.redialGreeting = true;
  state.focus = null;
  state.ui = defaultUi();
  playDisconnectSound();
  recordOfficeEvent('redial', customerLabel(t, true) + 'から再着信しています。');
  enterOffice();
}

/* ---------- TGX 国際配送 ---------- */

function shipLevel(id){ return SHIP_LEVELS.find(x => x.id === id); }
function remedyNeedsShipping(id){ return SHIPPING_REMEDIES.has(id); }
function remedyBlockReason(t, remedy){
  if (remedy.kind === 'escalate' && state.escLeft <= 0) return 'エスカレーション枠を使い切っています';
  if (remedy.needsOutage && !state.outageKnown) return '障害の裏付けが取れていないため、この案内はできません';
  if (remedy.needsCarrierRestored && !t.carrierRestored) return '現地キャリアから再開通完了の連絡がまだ届いていません';
  if (remedy.needsTest){
    const required = remedy.needsTestCount || 1;
    const count = t.testCounts.get(remedy.needsTest) || 0;
    if (count < required) return '先に「伝える」→「やってみてもらう」を ' + required + '回行ってください（現在 ' + count + '回）';
  }
  const missing = (remedy.requiresQuestions || []).filter(id => !t.asked.has(id));
  if (missing.length) return '配送判断に必要な聞き取りが不足しています';
  if (remedyNeedsShipping(remedy.id) && !t.stayAddress) return '配送先が未確認です。先に滞在先を確認してください';
  if (remedy.requiresLongStay && (!t.stayDaysKnown || t.s.stayDays < remedy.requiresLongStay)) return '残り滞在期間が短く、到着後に使える期間が足りません';
  if (remedy.requiresConsent && (!t.replacementConsentKnown || !t.s.wantsReplacement)) return 'お客様の代替機配送希望を確認できていません';
  return '';
}

function chooseRemedy(remedyId){
  const t = state.focus;
  const remedy = (REMEDIES[state.ui.cause] || []).find(item => item.id === remedyId);
  const blocked = remedy && remedyBlockReason(t, remedy);
  if (blocked){ render(); return; }
  state.ui.remedy = remedyId;
  if (remedyNeedsShipping(remedyId)) startShipping(remedyId);
  else render();
}

function startShipping(remedyId){
  const t = state.focus;
  if (!t) return;
  if (t.shipment && t.shipment.remedyId === remedyId){
    state.ui.shipping = null;
    render();
    return;
  }
  if (!t.stayAddress){
    t.transcript.push({ who:'note', text:'配送先が未確認です。手配を中断して滞在先を確認します。' });
    if (!spendOnCall(t, 2, 0)) return;
    state.ui = defaultUi('ask');
    render();
    return;
  }
  state.ui.shipping = { remedyId, level:null };
  render();
}

function shipmentEta(t, level){
  const local = state.clock + t.s.localOffset * 60;
  const day = Math.floor(local / 1440) * 1440;
  if (level.id === 'fast'){
    let eta = day + 8 * 60;
    if (eta <= local) eta += 1440;
    return eta;
  }
  if (level.id === 'next') return day + 1440 + 18 * 60;
  return local + 60 * 60;
}

function shipmentAwb(t){
  return 'TGX-' + String(Number(t.s.id.slice(1))).padStart(4,'0') + '-' + String(state.clock % 10000).padStart(4,'0');
}

function chooseShipLevel(id){
  const level = shipLevel(id);
  if (!state.ui.shipping || !level) return;
  state.ui.shipping.level = id;
  render();
}

function confirmShipment(){
  const t = state.focus;
  const ship = state.ui.shipping;
  const level = ship && shipLevel(ship.level);
  if (!t || !ship || !level) return;
  const need = shipLevel(t.s.shipNeed);
  const eta = shipmentEta(t, level);
  t.shipment = { remedyId:ship.remedyId, level:level.id, label:level.label, fee:level.fee, awb:shipmentAwb(t), eta, tooSlow:need ? level.rank < need.rank : false };
  state.cost += level.fee;
  t.transcript.push({ who:'me', text:'TGX の追跡番号 ' + t.shipment.awb + ' で手配しました。現地時間の' + fmtClock(eta) + 'までにホテルへお届けします。' });
  t.transcript.push({ who:'note', text:'TGX ' + level.label + 'の手配を確定しました。追跡番号：' + t.shipment.awb });
  state.ui.shipping = null;
  render();
}

/* ---------- クローズ判定 ---------- */

function toneLabel(id){ const x = TONES.find(t => t.id === id); return x ? x.name : id; }

function doClose(causeId, remedyId, toneId){
  const t = state.focus;
  const s = t.s;
  const remedy = (REMEDIES[causeId] || []).find(r => r.id === remedyId);
  if (!remedy) return;
  const blocked = remedyBlockReason(t, remedy);
  if (blocked){ render(); return; }

  t.transcript.push({ who:'me', text:'【' + toneLabel(toneId) + '】' + remedy.label });
  if (!spendOnCall(t, 2, 0)) return;

  const causeMatched = causeId === s.trueCause;
  if (causeMatched) playClueSound();
  const treatmentWorked = remedy.reportsRestored ? causeMatched && t.carrierRestored : treatmentSucceeds(causeMatched);
  // 見立て違いのやり直し時間は選択内容で決まり、抽選結果では揺らさない。
  if (!causeMatched) advance(2);

  // ---- 対処後も解決しない ----
  if (!treatmentWorked){
    if (!causeMatched){
      t.misdiagnoses++;
    }
    if (remedy.cost) state.cost += remedy.cost;
    if (remedy.kind === 'escalate'){ state.escLeft--; t.escUsed = true; }

    if (!causeMatched && t.misdiagnoses >= 2){
      pushFlowLines(t, [
        { who:'cust', text:CALL_FLOW_LINES.misdiagnosis.failure },
        { who:'me', text:CALL_FLOW_LINES.misdiagnosis.apology },
      ]);
      t.pendingConversation = { kind:'second_misdiagnosis', reason:'misdiagnosis' };
      state.ui = defaultUi();
    } else {
      pushCustomerLine(t, causeMatched ? '試してみましたが、変わりません…。まだ繋がらないです。' : '言われたとおりにしましたが、やっぱり直りません。まだ繋がらないんですけど。');
      if (!causeMatched) t.transcript.push({ who:'note', text:'原因の見立てが外れていました。もう一度切り分けをやり直せます。' });
      if (!addStress(t, 30)){ render(); return; }
      t.patience -= 20;
      t.state = 'open';
      state.ui = defaultUi();
    }
    render();
    return;
  }

  // ---- 解決する ----
  if (remedy.cost) state.cost += remedy.cost;
  if (remedy.kind === 'escalate'){ state.escLeft--; t.escUsed = true; }

  let bestId = s.best;
  if (s.bestNoOutage && !state.outageKnown) bestId = s.bestNoOutage;

  let base, grade;
  if (!causeMatched){ base = 5.0; grade = 'best'; }
  else if (remedyId === bestId){ base = 5.0; grade = 'best'; }
  else if ((s.partial || []).includes(remedyId)){ base = 3.5; grade = 'partial'; }
  else { base = 2.2; grade = 'poor'; }

  const wantTone = TYPES[s.type].tone;
  const toneOk = (toneId === wantTone);
  if (!toneOk) base -= 1.0;

  base -= t.damage;
  base -= t.misdiagnoses * 1.2;
  base -= Math.min(0.6, t.wasted * 0.1);
  base -= patiencePenalty(t.patience);
  base -= holdPenalty(t.holdMinutes);
  base -= stressPenalty(t.stress);
  if (t.callbackCount > 0) base -= t.callbackLate ? 1.5 : 0.2;
  base -= t.callbackPenalty || 0;
  if (t.shipment && t.shipment.remedyId === remedyId && t.shipment.tooSlow) base -= 1.0;

  const csat = clamp(Math.round(base * 10) / 10, 1.0, 5.0);

  const result = { kind:'closed', csat, grade, toneOk, remedyId, causeId, toneId,
    causeMatched, firstCallResolved:grade === 'best' && t.callbackCount === 0 && t.misdiagnoses === 0, label:gradeLabel(grade) };
  const resolutionReply = remedy.reportsRestored
    ? '原因まで分かって安心しました。回線を戻していただき、ありがとうございました。'
    : causeMatched
      ? closingLine(s, grade, toneOk)
    : 'あ、繋がりました。これで使えそうです。';
  pushCustomerLine(t, resolutionReply, { plain:true });
  pushFlowLines(t, [{ who:'me', text:resolutionOperatorClosing(grade, causeMatched) }]);
  pushCustomerLine(t, farewellLine(s, grade), { plain:true });
  t.pendingResult = result;
  t.transcript.push({ who:'note', text:'対応結果が確定しました。電話を切って終話してください。' });
  state.ui = defaultUi();
  render();
}

function resolutionOperatorClosing(grade, causeMatched){
  if (!causeMatched) return CALL_FLOW_LINES.resolved.recovered;
  return grade === 'best' ? CALL_FLOW_LINES.resolved.best : CALL_FLOW_LINES.resolved.partial;
}

function treatmentSucceeds(causeMatched){
  return rollLuck() ? causeMatched : !causeMatched;
}

function holdPenalty(minutes){
  if (minutes <= 0) return 0;
  if (minutes <= 4) return 0.2;
  if (minutes <= 8) return 0.5;
  return 1.0;
}

function patiencePenalty(p){
  if (p >= 80) return 0;
  if (p >= 60) return 0.3;
  if (p >= 40) return 0.7;
  if (p >= 20) return 1.2;
  return 1.8;
}

function gradeLabel(g){
  return g === 'best' ? '解決' : (g === 'partial' ? '暫定対応' : '不適切な対処');
}

function closingLine(s, grade, toneOk){
  if (grade === 'best'){
    if (!toneOk){
      const t = TYPES[s.type].tone;
      if (t === 'warm')      return s.type === 'anxious' ? '戻った…よかった。でも説明が難しくて、途中で本当に怖かったです。' : '直りました。でも次は、押す所を一つずつ教えてくださいね。';
      if (t === 'technical') return '復旧は確認しました。ただ、説明の粒度は次回見直してください。';
      return '直った。ありがとう。でも説明は半分でよかった。急ぎます。';
    }
    return {
      anxious:'繋がった…！ よかった、もう駄目かと思いました…。最後までいてくださって、本当にありがとうございます。',
      novice:'まあ、直りました！ 私にもできたんですね。ゆっくり一つずつ、本当にありがとうございました。',
      expert:'復旧を確認しました。仮説と検証の順序も妥当です。ありがとうございます。',
      hurried:'繋がった。間に合う。ありがとう、切ります。',
    }[s.type];
  }
  if (grade === 'partial') return s.type === 'expert' ? '暫定策としては理解しました。恒久対応は記録してください。' : (s.type === 'hurried' ? '一旦それで行く。続きは後で。' : '…分かりました。まだ心配ですが、その方法で様子を見ます。');
  return s.type === 'expert' ? 'その対処は原因仮説と整合しません。実施は保留します。' : (s.type === 'hurried' ? 'それで直る根拠は？ 時間がない。' : 'それ、本当に大丈夫ですか…？ 怖いですが、言われたとおりにします。');
}

function farewellLine(s, grade){
  return grade === 'best' ? FAREWELL_LINES.best[s.type] : FAREWELL_LINES[grade];
}

function finishResolvedCall(t){
  if (!t || !t.pendingResult) return;
  const result = t.pendingResult;
  t.pendingResult = null;
  closeTicket(t, result);
  render();
}

function redialOpening(t){
  return (t.s.type === 'anxious' || t.s.type === 'novice') ? REDIAL_OPENINGS.calm : REDIAL_OPENINGS.direct;
}

function interruptCall(t){
  if (!t || t.state !== 'open' || t.pendingResult) return;
  pushFlowLines(t, [{ who:'me', text:CALL_FLOW_LINES.interrupt }]);
  if (!addStress(t, REDIAL_STRESS)){ render(); return; }
  t.transcript.push({ who:'note', text:'オペレーターが対応途中で切断しました。' });
  t.pendingInterruption = true;
  state.ui = defaultUi();
  render();
}

function finishInterruptedCall(t){
  if (!t || !t.pendingInterruption) return;
  t.pendingInterruption = false;
  t.redialCount++;
  t.state = 'waiting';
  t.arrivedTurn = state.turn;
  t.greeted = false;
  t.redialOpening = redialOpening(t);
  t.redialSpoken = false;
  t.redialGreeting = true;
  state.focus = null;
  state.ui = defaultUi();
  playDisconnectSound();
  recordOfficeEvent('redial', customerLabel(t, true) + 'から再着信しています。');
  enterOffice();
}

function closeTicket(t, result){
  t.complaintEmail = complaintEmailArrives(result);
  t.state = 'closed';
  t.result = result;
  playDisconnectSound();
  playCloseJingle(result);
  recordOfficeEvent('closed', t.s.id + '：' + result.label + ' CSAT ' + result.csat.toFixed(1));
  if (state.focus === t) state.focus = null;
  state.ui = defaultUi();
  checkShiftEnd();
  if (state.phase === 'office') return;
}

function complaintEmailArrives(result){
  if (result.kind === 'complaint' || result.kind === 'hangup') return true;
  return (result.kind === 'closed' || result.kind === 'refunded') && result.csat < 2 ? rollLuck() : false;
}

function causeName(id){
  const c = CAUSES.find(x => x.id === id);
  return c ? c.label : id;
}

function checkShiftEnd(){
  const live = state.tickets.some(t => t.state !== 'closed');
  if (!live){ playShiftEndSound(); state.phase = 'report'; renderReport(); }
  else { enterOffice(); }
}

function nextInboundDelta(tickets, turn){
  const future = tickets.filter(t => t.state === 'inbound').map(t => t.arrivedTurn);
  if (!future.length) return null;
  return Math.max(0, Math.min(...future) - turn);
}

function advanceIdleOffice(){
  if (state.focus) return 0;
  activateDueInbound();
  const actionable = state.tickets.some(t => t.state === 'waiting' || (t.state === 'callback' && t.callbackDue <= state.clock));
  if (actionable) return 0;
  const inboundDelta = nextInboundDelta(state.tickets, state.turn);
  const callbackDeltas = state.tickets.filter(t => t.state === 'callback' && t.callbackDue > state.clock).map(t => t.callbackDue - state.clock);
  const callbackDelta = callbackDeltas.length ? Math.min(...callbackDeltas) : null;
  const delta = [inboundDelta, callbackDelta].filter(value => value !== null && value > 0).sort((a,b) => a - b)[0] || null;
  if (delta && delta > 0) advance(delta);
  return delta || 0;
}

    makeSound(audioContext, clamp(GAME_FLAGS.soundVolume, 0, 1));

function synthTone(ctx, volume, frequency, delay, duration, options = {}){
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();
  const start = ctx.currentTime + delay;
  const end = start + duration;
  oscillator.type = options.type || 'sine';
  oscillator.frequency.setValueAtTime(frequency, start);
  if (options.endFrequency) oscillator.frequency.exponentialRampToValueAtTime(options.endFrequency, end);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume * (options.level || 0.12)), start + Math.min(0.02, duration / 3));
  gain.gain.exponentialRampToValueAtTime(0.0001, end);
  oscillator.connect(gain); gain.connect(ctx.destination);
  oscillator.start(start); oscillator.stop(end + 0.02);
}

function typewriterOff(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

function finishTyping(skipEndingBeat = true){
  if (!typingLine) return;
  if (state.phase === 'ending' && endingTapGuard){
    return;
  }
  clearTimeout(typeTimer);
  typingLine.typed = true;
  typingLine = null;
  document.body.classList.remove('typing');
  if (state.phase === 'ending'){ renderCareerEndingComplete(skipEndingBeat); return; }
  const t = state.focus;
  if (t && advanceConversationFlow(t)) return;
  renderCall();
}

function startTyping(t){
  if (typingLine) return;
  const line = pendingTypedLine(t);
  if (!line) return;
  if (typewriterOff()){
    line.typed = true;
    if (state.phase === 'ending'){ renderCareerEndingComplete(true); return; }
    if (advanceConversationFlow(t)) return;
    renderCall();
    return;
  }
  typingLine = line;
  document.body.classList.add('typing');
  const say = document.querySelector('.line.typing .say');
  if (!say) return finishTyping(false);
  let pos = 0;
  const step = () => {
    if (typingLine !== line) return;
    pos++;
    say.textContent = line.text.slice(0, pos);
    playTypeSound(pos);
    if (pos >= line.text.length){ finishTyping(false); return; }
    typeTimer = setTimeout(step, /[、。！？!?]/.test(line.text[pos - 1]) ? 175 : 25);
  };
  typeTimer = setTimeout(step, 25);
}

function render(){
  if (state.phase === 'office'){ renderOffice(); return; }
  if (state.phase === 'desk'){ renderDesk(); return; }
  if (state.phase !== 'call') return;
  $('clock').textContent = fmtClock(state.clock);
  renderWorldStrip();
  renderQueue();
  renderCall();
  renderBoard();
}

function metrics(){
  const finished = state.tickets.filter(t => t.result);
  const answered = finished.filter(t => t.result.kind !== 'abandoned');
  const abandoned = finished.filter(t => t.result.kind === 'abandoned').length;
  const csats = answered.map(t => t.result.csat);
  const csat = csats.length ? csats.reduce((a,b) => a+b, 0) / csats.length : null;
  const fcrCount = answered.filter(t => t.result.firstCallResolved).length;
  const fcr = answered.length ? fcrCount / answered.length : null;
  const answerRate = (state.tickets.length - abandoned) / state.tickets.length;
  const handled = state.tickets.filter(t => t.callMinutes > 0);
  const aht = handled.length ? handled.reduce((n,t) => n + t.callMinutes, 0) / handled.length : null;
  return { finished, answered, abandoned, csat, fcrCount, fcr, answerRate, aht };
}

function renderWorldStrip(){
  const strip = $('world-strip');
  if (!strip) return;

  const stops = [];
  for (let i = 0; i <= 48; i++){
    const offset = -12 + i / 2;
    const pos = i / 48 * 100;
    stops.push('color-mix(in srgb, var(--amber) ' + daylightMix(offset) + '%, var(--panel-3)) ' + pos.toFixed(2) + '%');
  }

  const seen = new Map();
  const pins = state.tickets.filter(t => t.destinationKnown).map(t => {
    const utcOffset = 9 + t.s.localOffset;
    const pos = clamp((utcOffset + 12) / 24 * 100, 0, 100);
    const key = pos.toFixed(3);
    const stack = seen.get(key) || 0;
    seen.set(key, stack + 1);

    let cls = 'closed';
    if (t.state === 'waiting') cls = 'waiting';
    else if (t.state === 'open') cls = 'active';
    else if (t.state === 'callback') cls = 'callback';
    else if (t.result && t.result.kind === 'abandoned') cls = 'abandoned';

    const status = cls === 'waiting' ? '待ち中' : cls === 'active' ? '通話中' : cls === 'callback' ? '現地キャリア照会中' : cls === 'abandoned' ? '放棄呼' : '完了';
    return '<span class="world-pin ' + cls + '" style="left:' + pos.toFixed(2) + '%;--stack:' + stack + '" ' +
      'title="' + esc(t.s.city) + ' ' + esc(localClock(t)) + ' ' + status + '" aria-label="' + esc(t.s.city) + ' ' + status + '">' +
      '<i class="world-pin-dot"></i><span class="world-pin-label">' + esc(t.s.id) + '</span></span>';
  }).join('');

  strip.innerHTML =
    '<div class="world-sky" style="background:linear-gradient(90deg,' + stops.join(',') + ')"></div>' +
    '<div class="world-axis">' +
      '<span class="world-zone-label first">UTC−12</span>' +
      '<span class="world-zone-label mid">UTC</span>' +
      '<span class="world-zone-label last">UTC+12</span>' +
      '<span class="world-jst"><span>JST</span></span>' + pins +
    '</div>';
}

function renderQueue(){
  const q = state.tickets.filter(t => t.state === 'waiting')
    .sort((a,b) => a.arrivedTurn - b.arrivedTurn);

  $('queue-hint').innerHTML = '終話後はオフィスで、新しい電話を取るか、照会結果が出た相手へ電話をかけます。';
}

function pixelRect(ctx, color, x, y, width, height){
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(width), Math.round(height));
}

function drawCeilingLights(ctx, p){
  pixelRect(ctx, p.navy, 0, 0, 192, 34);
  for (let x = 0; x < 192; x += 48) pixelRect(ctx, p.blue, x, 0, 2, 34);
  pixelRect(ctx, p.blue, 0, 16, 192, 2);
  for (const y of [4, 21]){
    for (const x of [7, 55, 103, 151]){
      pixelRect(ctx, p.silver, x, y, 32, 9);
      pixelRect(ctx, p.white, x + 3, y + 2, 26, 5);
    }
  }
}

function drawBackWall(ctx, p){
  pixelRect(ctx, p.silver, 0, 34, 192, 35);
  pixelRect(ctx, p.gray, 0, 66, 192, 3);
  for (const x of [7, 36, 65, 94]){
    pixelRect(ctx, p.charcoal, x, 39, 25, 24);
    pixelRect(ctx, p.blue, x + 2, 41, 21, 20);

  ctx.imageSmoothingEnabled = false;
  const p = palette;
  pixelRect(ctx, p.ink, 0, 0, canvas.width, canvas.height);

  drawBackWall(ctx, p);

function stopOfficeRing(){
  if (officeRingTimer !== null) clearInterval(officeRingTimer);
  officeRingTimer = null;
  officeRingLit = false;
}

function syncOfficeRing(ringing){
  stopOfficeRing();
  officeRingLit = Boolean(ringing);
  drawOfficePixelArt(officeRingLit);
  if (officeRingLit) playOfficeRing();
  if (!ringing) return;
  officeRingTimer = setInterval(() => {
    officeRingLit = !officeRingLit;
    if (state.phase !== 'office'){ stopOfficeRing(); return; }
    drawOfficePixelArt(officeRingLit);
    if (officeRingLit) playOfficeRing();
  }, 420);
}

function renderOffice(){
  document.body.classList.add('office-view');
  document.body.classList.remove('call-view');
  $('clock').textContent = fmtClock(state.clock);
  $('office-clock').textContent = fmtClock(state.clock);
  $('office-slogan').textContent = state.slogan;
  renderWorldStrip();
  const waiting = state.tickets.filter(t => t.state === 'waiting').sort((a,b) => a.arrivedTurn - b.arrivedTurn);
  const callbacks = state.tickets.filter(t => t.state === 'callback').sort((a,b) => a.callbackDue - b.callbackDue);
  const readyCallbacks = callbacks.filter(t => t.callbackDue <= state.clock);
  const redials = waiting.filter(t => t.redialOpening);
  const shipments = state.tickets.filter(t => t.shipment).length;
  $('office-phone').classList.toggle('ringing', waiting.length > 0);
  $('office-phone-status').textContent = redials.length
    ? '再着信 ' + redials.length + '件 ／ 着信 ' + waiting.length + '件'
    : waiting.length ? '着信 ' + waiting.length + '件' : '着信待ち';
  syncOfficeRing(waiting.length > 0);
  $('office-sv').classList.toggle('busy', state.escLeft === 0);
  $('office-sv-status').textContent = state.escLeft ? 'ESC枠 ' + state.escLeft + ' / ' + ESCALATIONS : '別件対応中';
  $('office-ship-status').textContent = '手配 ' + shipments + '件 ／ 費用 ¥' + state.tickets.reduce((n,t) => n + (t.shipment ? t.shipment.fee : 0), 0).toLocaleString('ja-JP');
  $('office-tray-status').textContent = callbacks.length ? '折り返し待ち ' + callbacks.length + '件 ／ 最短 ' + fmtClock(callbacks[0].callbackDue) : '折り返し待ち 0件';
  const officeNotices = [];
  if (state.outageKnown) officeNotices.push(esc(state.outageRegion) + '：提携キャリアの広域障害<br>復旧見込み 未定');
  state.officeEvents.slice(-3).forEach(event => officeNotices.push(esc(event.text)));
  $('office-notice').innerHTML = officeNotices.length
    ? officeNotices.map(text => '<div class="notice">' + text + '</div>').join('')
    : '<div class="blank">特記事項なし</div>';
  $('office-answer').disabled = !waiting.length;
  $('office-answer-status').textContent = '待ち ' + waiting.length + '件';
  $('office-callback').disabled = !readyCallbacks.length;
  $('office-callback-status').textContent = callbacks.length
    ? (readyCallbacks.length ? '折り返し可能 ' + readyCallbacks.length + '件' : '照会中 ' + callbacks.length + '件 ／ ' + fmtClock(callbacks[0].callbackDue))
    : '折り返し 0件';
  $('office-desk').disabled = !callbacks.length;
  $('office-desk-status').textContent = callbacks.length ? '調査可能 ' + callbacks.length + '件' : '調査可能 0件';
}

function stressDisplayStage(value){
  if (value <= 50) return { label:'平静', className:'calm' };
  if (value <= 70) return { label:'苛立ち', className:'irritated' };
  if (value <= 90) return { label:'怒り', className:'angry' };
  return { label:'限界', className:'limit' };
}

function renderStressPanel(t){
  if (!customerHasSpoken(t)){
    return '<section class="stress-panel unknown" aria-label="顧客の苛立ちはまだ分かりません">' +
      '<div class="stress-panel-head"><span>顧客の苛立ち</span><b>—</b><strong>まだ不明</strong></div>' +
      '<i class="stress-track"><b class="stress-fill" style="width:0%"></b></i></section>';

  return '<section class="stress-panel ' + stage.className + (t.stress > 80 ? ' alert' : '') + '" aria-label="顧客の苛立ち ' + Math.round(t.stress) + 'パーセント ' + stage.label + '">' +
    '<div class="stress-panel-head"><span>顧客の苛立ち</span><b>' + Math.round(t.stress) + '%</b><strong>' + stage.label + '</strong></div>' +
    '<i class="stress-track"><b class="stress-fill" style="width:' + t.stress + '%"></b></i></section>';
}

function recentTranscriptLines(t){
  const pending = pendingTypedLine(t);
  const end = pending ? t.transcript.indexOf(pending) + 1 : t.transcript.length;
  const delivered = t.transcript.slice(0, end);
  let latestLookupIndex = -1;
  for (let i = delivered.length - 1; i >= 0; i--){
    if (delivered[i].who === 'sys' && delivered[i].lookupTitle){ latestLookupIndex = i; break; }
  }
  if (latestLookupIndex >= 0){
    const afterLookup = delivered.slice(latestLookupIndex + 1);
    const customerAfter = afterLookup.some(line => line.who === 'cust');
    const playerAfter = afterLookup.slice().reverse().find(line => line.who === 'me');
    if (!customerAfter && playerAfter) return [delivered[latestLookupIndex], playerAfter];
  }
  const spoken = t.transcript.slice(0, end).filter(line => line.who === 'cust' || line.who === 'front' || line.who === 'me');
  if (spoken.length && spoken[spoken.length - 1].who === 'me'){
    const player = spoken[spoken.length - 1];
    const customer = spoken.slice(0, -1).reverse().find(line => line.who === 'cust' || line.who === 'front');
    return customer ? [customer, player] : [player];
  }
  let customerIndex = -1;
  for (let i = spoken.length - 1; i >= 0; i--){
    if (spoken[i].who === 'cust' || spoken[i].who === 'front'){ customerIndex = i; break; }
  }
  if (customerIndex < 0) return spoken.slice(-1);
  const customer = spoken[customerIndex];
  const player = spoken.slice(0, customerIndex).reverse().find(line => line.who === 'me');
  return player ? [player, customer] : [customer];
}

function renderTranscript(t, full){
  const pending = pendingTypedLine(t);
  const lines = full ? t.transcript : recentTranscriptLines(t);
  return lines.map(l => {
    if ((l.who === 'cust' || l.who === 'front' || l.who === 'sys') && !l.typed && l !== pending) return '';
    const who = { cust:'客', front:'Front Desk', me:'あなた', sys:'社内システム', note:'メモ' }[l.who];
    const typing = l === pending;
    const lookupResult = l.who === 'sys' && l.lookupTitle;
    const roleClass = l.who === 'front' ? 'front cust' : l.who;
    const content = typing ? '' : lookupResult ? renderLookupSystemScreen(l) : esc(l.text) + (l.viz ? renderLookupViz(l.viz) : '');
    return '<div class="line ' + roleClass + (lookupResult ? ' lookup-result' : '') + (typing ? ' typing' : '') + '"><span class="who">' + who + '</span>' +
      '<span class="say">' + content + '</span></div>';
  }).join('');
}

function renderActions(t){
  if (state.busy){
    return '<div class="actions"><div class="pending-note">社内照会中です。通話はつながったまま、時間が自動で進みます。</div></div>';
  }
  if (state.ui.shipping) return '<div class="actions">' + renderCommandHead('国際配送の手配', '配送方法を選んでください。') + renderShipping(t) + renderHangupButton() + '</div>';

  if (t.pendingResult){
    if (pendingTypedLine(t)) return '<div class="actions"><div class="pending-note">お客様の最後の言葉を聞いています。</div></div>';
    return '<div class="actions">' + renderHangupButton('お客様との会話が終わりました。終話してください。', pendingResultButtonLabel(t.pendingResult)) + '</div>';
  }
  if (t.pendingInterruption) return '<div class="actions">' + renderHangupButton('こちらから通話を切ります。', 'オフィスへ戻る') + '</div>';
  if (state.ui.tab === 'hangup_confirm') return '<div class="actions">' + renderHangupConfirmation(t) + '</div>';
  if (state.ui.tab === 'refund_confirm') return '<div class="actions">' + renderRefundConfirmation() + '</div>';
  if (t.callbackStage === 'front_desk') return '<div class="actions">' + renderFrontDeskOptions(t) + '</div>';

  if (!t.greeted && !customerHasSpoken(t)) return '<div class="actions"><div class="command-box"><div class="command-title"><span>CALL</span><b>まず名乗ってください</b></div><button class="command-choice" data-greet="1"><span class="command-no">1</span><span class="command-copy"><b>名乗る</b><small>お電話ありがとうございます。グローバルデスクでございます</small></span></button></div>' + renderHangupButton() + '</div>';

  const tab = state.ui.tab || 'command';
  const actionClass = 'actions' + (pendingTypedLine(t) ? ' is-typing' : '');
  if (tab === 'command') return renderCommandMenu(t, actionClass);
  if (tab === 'ask'){
    const group = QUESTION_GROUPS.find(item => item.id === state.ui.askGroup);
    return '<div class="' + actionClass + '">' +
      renderCommandHead('聞く', group ? group.label : '何について聞きますか？', group ? 'ask' : 'command') +
      (group ? renderAskOptions(t, group) : renderAskGroups(t)) + renderHangupButton() + '</div>';
  }
  if (tab === 'tell'){
    return '<div class="' + actionClass + '">' + renderCommandHead('伝える', '何を伝えますか？') + renderTellOptions(t) + renderHangupButton() + '</div>';
  }

  const bodyByCommand = {
    lookup: () => renderLookupOptions(t),
    try: () => renderTestOptions(t),
    soothe: () => renderSootheOptions(t),
    apologize: () => renderApologyOptions(t),
    smalltalk: () => renderSmalltalkOptions(t, 'tell'),
    record: () => renderRecord(t),
    identity_denied: () => renderIdentityDenied(),
    close: () => renderCloseFlow(t),
  };
  const renderBody = bodyByCommand[tab] || bodyByCommand.close;
  const [command, prompt] = commandPrompt(tab);
  const backTarget = ['close','try','soothe','apologize'].includes(tab) ? 'tell' : 'command';
  return '<div class="' + actionClass + '">' + renderCommandHead(command, prompt, backTarget) + renderBody() + renderHangupButton() + '</div>';
}

function pendingResultButtonLabel(result){
  return result.kind === 'complaint' || result.kind === 'hangup' ? 'オフィスへ戻る' : '電話を切る';

function renderHangupButton(note, label = '電話を切る'){

function unresolvedHangupGuide(t){
  const causeNarrowed = hotCauses(t).size === 1;
  const next = t.symptomResolved
    ? '症状は復旧しました。「伝える」→「対処を伝える」で原因をご説明すると、この電話を終われます。'
    : causeNarrowed
    ? 'まだ対処をお伝えしていません。「伝える」→「対処を伝える」で原因と対処を案内すると、この電話を終われます。'
    : 'まだ原因を絞れていません。「聞く」「調べる」で手がかりを集めると、対処を案内できるようになります。';
  return '<b>' + next + '</b><p>このまま切ると、お客様から再入電になります。</p>';
}

function renderHangupConfirmation(t){
  return '<div class="hangup-confirm">' + unresolvedHangupGuide(t) + '<div><button class="hangup-button" data-hangup-confirm="1">電話を切る</button><button class="command-back" data-hangup-cancel="1">対応に戻る</button></div></div>';
}

function renderRefundConfirmation(){
  return '<div class="hangup-confirm"><b>¥' + REFUND_POLICY.amount.toLocaleString('ja-JP') + 'の返金をご提案します。受け入れていただければ、この電話は終わります。よろしいですか？</b><div><button class="hangup-button" data-refund-confirm="1">返金を提案する</button><button class="command-back" data-refund-cancel="1">対応に戻る</button></div></div>';
}

function renderCommandMenu(t, actionClass){
  const choices = COMMAND_DEFS.map(c =>
    '<button class="command-choice" data-command="' + c.id + '" ' + (c.disabled ? 'disabled' : '') + '>' +
      '<span class="command-no">' + c.no + '</span><span class="command-copy"><b>' + c.label + '</b></span>' + (c.meta ? '<span class="command-meta">' + c.meta + '</span>' : '') +
    '</button>'
  ).join('');
  const optionalGreeting = !t.greeted && customerHasSpoken(t)
    ? '<button class="command-choice optional-greeting" data-greet="1"><span class="command-no">任意</span><span class="command-copy"><b>名乗る</b><small>急いでいるお客様には省略できます</small></span></button>'
    : '';

    ? '<p class="hint-bar">お客様が国際通話料を気にしています。「伝える」→「ホテルへ折り返す」で通話料を止められます。</p>'
    : '';
  return '<div class="' + actionClass + '"><div class="command-box"><div class="command-title"><span>COMMAND</span><b>コマンドを選んでください</b></div>' + optionalGreeting + '<div class="command-grid">' + choices + '</div></div>' + chargeHint + renderHangupButton() + '</div>';

/* 折り返しはこちらから掛け直す行為なので、折り返し中の通話には出さない。 */
function hotelCallbackOffered(t){
  return t.callDirection !== 'outbound';
}

function hotelCallbackSub(t){
  if (!t.asked.has('q_stay') || !t.stayAddress) return '滞在先はまだ伺っていません。';
  return t.callChargeConcerned ? 'お客様が国際通話料を気にしています。' : '5分を超えそうなら、お客様の通話料を止められます。';
}

function renderFrontDeskOptions(t){
  const room = hotelRoom(t);
  const options = CALL_FLOW_LINES.frontDesk.options;
  const latestFront = t.transcript.slice().reverse().find(line => line.who === 'front');
  const frontContext = latestFront && latestFront.typed
    ? '<div class="line front cust front-desk-context"><span class="who">Front Desk</span><span class="say">' + esc(latestFront.text) + '</span></div>'
    : '';
  const roomChoice = room
    ? '<button class="opt" data-front-desk="room"><span class="opt-label">' + esc(options.room.replace('{room}', room)) + '</span></button>'
    : '';
  return frontContext + renderCommandHead('Front Desk', 'Please choose what to say in English.') + '<div class="opts front-desk-options">' +
    '<button class="opt" data-front-desk="guest" ' + (t.nameKnown ? '' : 'disabled') + '><span class="opt-label">' + esc(options.guest.replace('{name}', t.s.nameEn)) + '</span></button>' +
    roomChoice +
    '<button class="opt" data-front-desk="callback"><span class="opt-label">' + esc(options.callback) + '</span></button></div>';
}

function renderAskGroups(t){
  const groups = QUESTION_GROUPS.filter(group => group.questionIds.some(id => {
    const question = QUESTIONS.find(item => item.id === id);
    return question && (!question.needsDevice || t.s.deviceInHand);
  }));
  return '<div class="opts ask-groups">' + groups.map(group => {
    const availableIds = group.questionIds.filter(id => {
      const question = QUESTIONS.find(item => item.id === id);
      return question && (!question.needsDevice || t.s.deviceInHand);
    });
    const complete = availableIds.every(id => t.asked.has(id));
    return '<button class="command-choice ask-group-choice" data-ask-group="' + group.id + '" ' + (complete ? 'disabled' : '') + '><span class="command-copy"><b>' + esc(group.label) + '</b></span></button>';
  }).join('') + '</div>';
}

function renderAskOptions(t, group){
  const questions = group.questionIds.map(id => QUESTIONS.find(q => q.id === id)).filter(q => q && (!q.needsDevice || t.s.deviceInHand));
  return '<div class="opts">' + questions.map(q =>
    '<button class="opt" data-ask="' + q.id + '"><span class="opt-label">' + esc(q.label) + ((t.askCounts.get(q.id) || 0) ? '<span class="opt-sub">確認済み ' + t.askCounts.get(q.id) + '回</span>' : '') + '</span><span class="cost">' + (q.id === 'q_contract' && !t.asked.has(q.id) ? t.s.contractId.minutes : 1) + '分</span></button>'
  ).join('') + (group.id === 'customer' ? renderSmalltalkChoices(t, 'ask') : '') + '</div><p class="hint-bar">同じ質問もできますが、時間を使い、回答済みならお客様のストレスが大きく増えます。</p>';
}

function renderTellOptions(t){
  const entries = [
    { attrs:'data-tell="close"', body:'<span class="opt-label">対処を伝える<span class="opt-sub">原因を見立てて、対処をご案内します。</span></span>' },
    t.s.deviceInHand
      ? { attrs:'data-tell="try"', body:'<span class="opt-label">やってみてもらう<span class="opt-sub">機器や端末で試していただくことを選びます。</span></span>' }
      : null,
    t.refundProposalRejected
      ? null
      : { attrs:'data-refund="refund"', body:'<span class="opt-label">返金をご案内する</span><span class="cost">¥' + REFUND_POLICY.amount.toLocaleString('ja-JP') + '</span>' },
    hotelCallbackOffered(t)
      ? { attrs:'data-hotel-callback="1"', body:'<span class="opt-label">ホテルへ折り返す<span class="opt-sub">' + esc(hotelCallbackSub(t)) + '</span></span>' }
      : null,
    { attrs:'data-tell="soothe"', body:'<span class="opt-label">気持ちを落ち着ける</span>' },
    { attrs:'data-tell="apologize"', body:'<span class="opt-label">お詫びする</span>' },
    { attrs:'data-tell="smalltalk"', body:'<span class="opt-label">一言かける</span>' },
  ].filter(Boolean);
  return '<div class="opts">' + entries.map((entry, index) =>
    '<button class="opt" ' + entry.attrs + '><span class="command-no">' + (index + 1) + '</span>' + entry.body + '</button>'
  ).join('') + '</div>';
}

function availableSmalltalkTopics(t){
  return (t.s.smalltalk || []).filter(topic => topicAvailable(t, topic));
}

function renderSmalltalkChoices(t, mode){
  return availableSmalltalkTopics(t).map(topic =>
    '<button class="opt smalltalk-choice" data-smalltalk="' + topic.id + '" data-smalltalk-mode="' + mode + '"><span class="opt-label">' + esc(mode === 'ask' ? topic.askLabel : topic.tellLabel) + '</span><span class="cost">1分</span></button>'
  ).join('');
}

function renderSmalltalkOptions(t, mode){
  const choices = renderSmalltalkChoices(t, mode);
  return choices
    ? '<div class="opts smalltalk-options">' + choices + '</div>'
    : '<p class="hint-bar">お客様が会話で触れた話題は、まだありません。</p>';
}

function renderLookupOptions(t){
  if (!state.ui.lookup){
    return '<div class="opts">' + LOOKUPS.map(l =>
      '<button class="opt" data-lookup="' + l.id + '" ' + (t.lookedUp.has(l.id) || t.carrierLookupStarted ? 'disabled' : '') + '><span class="opt-label">' + esc(l.label) + (l.external ? '<span class="opt-sub">社外へ再開通を依頼。通話を切り、30分後に折り返します</span>' : '') + '</span>' + (l.external ? '<span class="cost">30分</span>' : '') + '</button>'
    ).join('') + '</div><p class="hint-bar">照会項目を選んだあと、保留にするか話しながら調べるかを選びます。</p>';
  }
  const lookup = LOOKUPS.find(x => x.id === state.ui.lookup);
  if (lookup && lookup.external) return renderCarrierLookupOptions(t, lookup);
  return '<div class="opts"><button class="opt" data-lookup-back="1"><span class="opt-label">← 照会項目の選び直し</span></button>' +
    '<button class="opt" data-lookup-mode="hold"><span class="opt-label">保留にして調べる<span class="opt-sub">相手を待たせるが速い</span></span><span class="cost">2分</span></button>' +
    '<button class="opt" data-lookup-mode="talk"><span class="opt-label">話しながら調べる<span class="opt-sub">相手を待たせないが通話が長引く</span></span><span class="cost">3分</span></button></div><p class="hint-bar">照会: ' + esc(lookup.label) + '</p>';
}

function renderCarrierLookupOptions(t, lookup){
  const hotelReady = t.asked.has('q_stay');
  return '<div class="opts"><button class="opt" data-lookup-back="1"><span class="opt-label">← 照会項目の選び直し</span></button>' +
    '<button class="opt" disabled><span class="opt-label">保留にして調べる<span class="opt-sub">30分かかるため、通話をつないだままでは実行できません</span></span><span class="cost">不可</span></button>' +
    '<button class="opt" disabled><span class="opt-label">話しながら調べる<span class="opt-sub">社外への再開通依頼のため、通話継続では実行できません</span></span><span class="cost">不可</span></button></div>' +
    '<p class="hint-bar"><b>現地キャリアへ再開通を依頼します。30分ほどお時間をいただき、完了状況が分かり次第折り返します。</b><br>折り返し先を選ぶと、通話を終えて再開通依頼を始めます。</p>' +
    '<div class="opts"><button class="opt" data-callback-destination="hotel" ' + (hotelReady ? '' : 'disabled') + '><span class="opt-label">ホテルへ折り返す<span class="opt-sub">滞在先へ電話し、フロントを通して客室につないでもらいます</span></span><span class="cost">' + lookup.minutes + '分</span></button></div>' +
    (hotelReady ? '' : '<p class="hint-bar">ホテル客室は滞在先が未確認です。「聞く」で確認してください。</p>');
}

function simCleaningRecommended(t){
  return t.asked.has('q_lamp') && t.s.panel && t.s.panel.sim === 'none' && (t.testCounts.get('t_simout') || 0) < 2;
}

function renderTestOptions(t){
  const recommendCleaning = simCleaningRecommended(t);
  const availableTests = TESTS.filter(test => !test.needsDevice || t.s.deviceInHand);
  const availableRisky = RISKY.filter(test => !test.needsDevice || t.s.deviceInHand);
  const safe = availableTests.map(test => {
    const recommended = test.id === 't_simout' && recommendCleaning;
    const count = t.testCounts.get(test.id) || 0;
    return '<button class="opt ' + (recommended ? 'recommended' : '') + '" data-test="' + test.id + '">' +
      '<span class="opt-label">' + (recommended ? '● 推奨：' : '') + esc(test.label) + (test.sub ? '<span class="opt-sub">' + esc(test.sub) + '</span>' : '') + (count ? '<span class="opt-sub">実施済み ' + count + '回</span>' : '') + '</span><span class="cost">' + test.turns + '分</span></button>';
  }).join('');
  const risky = availableRisky.map(test =>
    '<button class="opt danger" data-test="' + test.id + '"><span class="opt-label">' + esc(test.label) + ((t.testCounts.get(test.id) || 0) ? '<span class="opt-sub">実施済み ' + t.testCounts.get(test.id) + '回</span>' : '') + '</span><span class="cost">' + test.turns + '分</span></button>'
  ).join('');
  return '<div class="opts">' + safe + (availableRisky.length ? '<p class="hint-bar" style="margin:6px 0 2px">— 以下は本体や端末の設定を壊しうる操作です —</p>' + risky : '') + '</div>' +
    '<p class="hint-bar">操作が終わるまで通話をつないだまま待ち、所要時間は自動で進みます。</p>';
}
function renderSootheOptions(t){
  return '<div class="opts">' + SOOTHES.map(s => '<button class="opt" data-soothe="' + s.id + '" ' + (s.needsFacts && t.facts.length < s.needsFacts ? 'disabled' : '') + '><span class="opt-label">' + esc(s.label) + '</span><span class="cost">1分</span></button>').join('') + '</div>';
}
function renderApologyOptions(t){
  return '<div class="opts">' + APOLOGIES.map(apology => {
    const count = t.apologies.get(apology.id) || 0;
    const sub = apology.kind === 'brief'
      ? '時間は使うが、不要でもストレスは増やさない'
      : '強く苛立っている相手には有効。平静な相手には大げさで逆効果';
    return '<button class="opt" data-apology="' + apology.id + '"><span class="opt-label">' + esc(apology.label) + '<span class="opt-sub">' + sub + (count ? ' ／ 実施済み ' + count + '回' : '') + '</span></span><span class="cost">' + apology.minutes + '分</span></button>';
  }).join('') + '</div>';
}
function renderRecord(t){
  const ty = TYPES[t.s.type];
  const facts = t.facts.length
    ? '<ul>' + t.facts.map(fact => '<li>' + esc(fact.text) + '</li>').join('') + '</ul>'
    : '<p>まだ手がかりはありません。</p>';
  const remaining = remainingCauseCandidates(t);
  const candidateText = remaining.length
    ? remaining.map(cause => esc(cause.label)).join(' ／ ')
    : '候補なし';
  return '<div class="log-view"><p class="hint-bar">1分かけてログを確認しています。お客様は通話口で待っています。</p>' +
    '<section class="system-screen record-system-screen"><header><span>GLOBALDESK OPS</span><b>通話記録</b><em>社内システム</em></header><div class="record-system-body">' +
    '<section class="record-system-block"><h3>お客様</h3><div class="log-customer">' +
      '<p><b>お名前</b><span>' + esc(t.nameKnown ? t.s.name : '未特定') + '</span></p>' +
      '<p><b>渡航先・現地時刻</b><span>' + (t.destinationKnown ? esc(t.s.city) + ' ／ ' + localClock(t) : '未確認') + '</span></p>' +
      '<p><b>機種・プラン</b><span>' + (t.identified ? esc(t.s.device) + ' ／ ' + esc(t.s.plan) : '本人特定後に確認できます') + '</span></p>' +
      '<p><b>タイプ・対応メモ</b><span>' + esc(ty.label) + ' ／ ' + esc(ty.note) + '</span></p>' +
    '</div></section>' +
    '<section class="record-system-block"><h3>ここまでの状況</h3>' + facts + '<p class="log-candidates"><b>残っている原因の候補</b><span>' + candidateText + '</span></p></section>' +
    '<section class="record-system-block"><h3>次にできること</h3><p>' + esc(nextActionGuide(t)) + '</p></section>' +
    '<section class="record-system-block"><h3>会話の全履歴</h3><div class="record-system-transcript">' + renderRecordTranscript(t) + '</div></section>' +
    '</div><footer>RECORD ／ VERIFIED</footer></section></div>';
}

function renderIdentityDenied(){
  return '<div class="log-view"><section class="system-screen record-system-screen identity-denied-screen denied"><header>' +
    '<span>GLOBALDESK OPS</span><b>本人確認</b><em>アクセス拒否</em></header>' +
    '<div class="record-denied-message"><b>本人確認が完了していません。</b>' +
    '<p>フルネームと渡航先、または契約IDを確認してください。</p></div>' +
    '<footer>ACCESS ／ DENIED</footer></section></div>';
}

function renderRecordTranscript(t){
  return t.transcript.map(line => {
    const who = { cust:'客', me:'あなた', sys:'社内システム', note:'メモ' }[line.who];
    const content = line.who === 'sys' && line.lookupTitle
      ? renderLookupSystemScreen(line)
      : esc(line.text) + (line.viz ? renderLookupViz(line.viz) : '');
    return '<div class="record-system-entry ' + line.who + '"><b>' + who + '</b><span>' + content + '</span></div>';
  }).join('');
}

function remainingCauseCandidates(t){
  const excluded = ruledOut(t);
  return CAUSES.filter(cause => !excluded.has(cause.id));
}

function nextActionGuide(t){
  const remaining = remainingCauseCandidates(t).length;
  if (!t.facts.length) return 'まだ手がかりがありません。まず「聞く」コマンドから始めてください。';
  if (remaining <= 2) return '候補が' + remaining + 'つまで絞れています。診断に進めます。';
  return '手がかりをもとに候補を絞り込み中です。聞き取りか社内照会を続けてください。';
}

function commandPrompt(tab){
  return {
    lookup:['調べる', state.ui.lookup ? 'どの方法で調べますか？' : '何を調べますか？'],
    try:['やってみてもらう', '何を試していただきますか？'],
    soothe:['気持ちを落ち着ける', 'どの言葉をかけますか？'],
    apologize:['お詫びする', 'どの深さでお詫びしますか？'],
    smalltalk:['一言かける', '会話に出た話題から選んでください'],
    record:['ログ', 'この通話の状況と全履歴'],
    identity_denied:['本人確認', '本人確認が必要です'],
    close:['対処を伝える', state.ui.cause ? 'どのように対処を伝えますか？' : '原因を選んでください'],
  }[tab] || ['コマンド', '次の行動を選んでください'];
}

function renderCommandHead(command, prompt, backTarget = 'command'){
  return '<div class="command-panel-head"><button class="command-back" data-command="' + backTarget + '">← もどる</button>' +
    '<div><span>COMMAND ／ ' + esc(command) + '</span><b>' + esc(prompt) + '</b></div></div>';
}

function renderCloseFlow(t){
  const ruled = ruledOut(t);
  const hot = hotCauses(t);

  if (!state.ui.cause){
    return '<div class="opts">' + CAUSES.map(c => {
      const out = ruled.has(c.id);
      const isHot = hot.has(c.id);
      return '<button class="opt ' + (out ? 'used' : '') + '" data-cause="' + c.id + '">' +
        '<span class="opt-label">' + (isHot ? '● ' : '') + esc(c.label) +
        '<span class="opt-sub">' + c.tier + (out ? ' ／ 集めた情報とは噛み合いません' : (isHot ? ' ／ 手がかりが指しています' : '')) + '</span></span>' +
        '</button>';
    }).join('') + '</div>' +
    '<p class="hint-bar">原因を選ぶと、その原因に対する対処が出ます。</p>';
  }

  const cause = CAUSES.find(c => c.id === state.ui.cause);
  const list = REMEDIES[state.ui.cause] || [];

  if (!state.ui.remedy){
    return '<div class="opts">' +
      '<button class="opt" data-cause="__back"><span class="opt-label">← 原因の選び直し</span></button>' +
      list.map(r => {
        const block = remedyBlockReason(t, r);
        const dis = Boolean(block);
        const sub = block || r.sub || '';
        return '<button class="opt ' + (r.kind === 'escalate' ? 'esc ' : '') + (dis ? 'has-block-reason' : '') + '" data-remedy="' + r.id + '" ' + (dis ? 'disabled' : '') + '>' +
          '<span class="opt-label">' + esc(r.label) + '<span class="opt-sub' + (dis ? ' remedy-block-reason' : '') + '">' + (dis ? '<b>前提不足</b>' : '') + esc(sub) + '</span></span>' +
          '<span class="cost">' + (r.cost ? '¥' + r.cost.toLocaleString('ja-JP') : '—') + '</span></button>';
      }).join('') + '</div>' +
      '<p class="hint-bar">診断: ' + esc(cause.label) + '</p>';
  }

  if (state.ui.remedy && remedyNeedsShipping(state.ui.remedy) && (!t.shipment || t.shipment.remedyId !== state.ui.remedy)){
    return '<div class="pending-note">配送手配を完了してから、客への案内を選びます。</div>';
  }

  const ty = TYPES[t.s.type];
  return '<div class="tone-row">' + TONES.map(tn =>
    '<button class="tone" data-tone="' + tn.id + '"><span class="tname">' + tn.name + '</span>' + esc(tn.sub) + '</button>'
  ).join('') + '</div>' +
  '<p class="hint-bar">相手は「' + esc(ty.label) + '」タイプです。' + esc(ty.note) + ' 相手に合わせて伝え方を選んでください。</p>';
}

function renderShipping(t){
  const ship = state.ui.shipping;
  const level = ship && shipLevel(ship.level);
  if (!level){
    return '<div class="shipment"><p class="eyebrow">TRANSGLOBE EXPRESS ／ TGX</p><h3>国際配送の手配</h3><p class="shipment-address">届け先：' + esc(t.stayAddress) + '</p><div class="opts">' + SHIP_LEVELS.map(x =>
      '<button class="opt" data-ship-level="' + x.id + '"><span class="opt-label">' + x.label + '<span class="opt-sub">' + x.eta + '</span></span><span class="cost">¥' + x.fee.toLocaleString('ja-JP') + '</span></button>'
    ).join('') + '</div></div>';
  }
  const eta = shipmentEta(t, level), awb = shipmentAwb(t);
  return '<div class="shipment"><p class="eyebrow">TRANSGLOBE EXPRESS ／ TGX</p><h3>送り状を確認</h3><div class="waybill"><div><b>AWB No.</b><span>' + awb + '</span></div><div><b>発送元</b><span>現地デポ（' + esc(t.s.city) + '）</span></div><div><b>届け先</b><span>' + esc(t.stayAddress) + '</span></div><div><b>内容品</b><span>レンタル用モバイルWiFiルーター 1台（返送予定品）</span></div><div><b>サービス</b><span>' + esc(level.label) + ' ／ ' + esc(level.eta) + '</span></div><div><b>到着目安</b><span>現地 ' + fmtClock(eta) + '</span></div></div><button class="btn-primary shipment-confirm" data-ship-confirm="1">TGXへ手配を確定する</button></div>';
}

function ruledOut(t){
  const s = new Set();
  t.facts.forEach(f => (f.out || []).forEach(c => s.add(c)));
  return s;
}
function hotCauses(t){
  const s = new Set();
  t.facts.forEach(f => (f.hot || []).forEach(c => s.add(c)));
  return s;
}

function renderLookupViz(v){
  const unlimited = v.max === null;
  const ratio = unlimited ? 72 : clamp(v.value / Math.max(v.max, 1) * 100, 0, 100);
  const over = !unlimited && v.value > v.max;
  const value = v.value.toLocaleString('ja-JP') + (v.unit ? ' ' + v.unit : '');
  const ceiling = unlimited ? '上限なし' : v.max.toLocaleString('ja-JP') + (v.unit ? ' ' + v.unit : '');
  return '<span class="lookup-viz">' +
    '<span class="lookup-viz-head"><span>' + esc(v.label) + '</span><b>' + esc(value) + ' / ' + esc(ceiling) + '</b></span>' +
    '<span class="lookup-viz-track"><i class="lookup-viz-fill ' + (over ? 'over' : unlimited ? 'unlimited' : '') + '" style="width:' + ratio + '%"></i></span>' +
    '<span class="lookup-viz-note">' + esc(v.note || '') + '</span></span>';
}

function lookupResultRows(text){
  const body = String(text || '').replace(/^\[[^\]]+\]\s*/, '').trim();
  return body.split(/\s*／\s*|\s*。\s*(?=\S)/).map(part => part.trim()).filter(Boolean).map(part => {
    const split = part.search(/[:：]/);
    if (split < 0) return { label:'', value:part.replace(/。$/, '') };
    return { label:part.slice(0, split).trim(), value:part.slice(split + 1).trim().replace(/。$/, '') };
  });
}

function renderLookupSystemScreen(line){
  const rows = lookupResultRows(line.text).map(row =>

  const external = line.external

function renderBoard(){
  const t = state.focus;
  if (!t){
    $('fact-count').textContent = '0件';
    $('board').innerHTML = '<p class="empty-note">案件を開くと、ここに原因の候補と<br>集まった手がかりが並びます。</p>';
    return;
  }
  const ruled = ruledOut(t);
  const hot = hotCauses(t);
  $('fact-count').textContent = t.facts.length + '件';

  const causeRow = c => {
    const out = ruled.has(c.id) && !hot.has(c.id);
    const isHot = hot.has(c.id);
    return '<div class="cause ' + (out ? 'out' : '') + ' ' + (isHot ? 'hot' : '') + '">' +
      '<span class="tick">' + (out ? '×' : isHot ? '●' : '·') + '</span>' +
      '<span>' + esc(c.label) + '</span>' +
      '<span class="tier">' + c.tier + '</span></div>';
  };
  const remainingCauses = CAUSES.filter(c => !(ruled.has(c.id) && !hot.has(c.id)));
  const excludedCauses = CAUSES.filter(c => ruled.has(c.id) && !hot.has(c.id));
  const causes = remainingCauses.map(causeRow).join('');
  const excluded = excludedCauses.length
    ? '<button class="board-toggle" data-board-excluded="1" aria-expanded="' + !!state.ui.boardExcludedOpen + '">除外済み（' + excludedCauses.length + '件）<span>' + (state.ui.boardExcludedOpen ? '閉じる' : '開く') + '</span></button>' +
      (state.ui.boardExcludedOpen ? '<div class="board-excluded">' + excludedCauses.map(causeRow).join('') + '</div>' : '')
    : '';

  const facts = t.facts.length
    ? t.facts.map(f => '<div class="fact"><span class="src">' + esc(f.src) + '</span>' + esc(f.text) + '</div>').join('')
    : '<p class="empty-note" style="padding:10px 0">まだ手がかりがありません。</p>';

  $('board').innerHTML =
    renderDevicePanel(t) +
    '<p class="eyebrow" style="margin:0 0 6px">残っている候補 ' + remainingCauses.length + ' / ' + CAUSES.length + '</p>' +
    causes + excluded +
    '<p class="eyebrow" style="margin:20px 0 8px">集まった手がかり</p>' +
    '<div class="facts">' + facts + '</div>' +
    '<p class="eyebrow" style="margin:20px 0 8px">この案件のここまで</p>' +
    '<div class="mini-list">' +
      mini('通話時間', t.callMinutes + '分') +
      mini('うち保留', t.holdMinutes + '分') +
      mini('聞き取り', t.asked.size + '回') +
      mini('社内照会', t.lookedUp.size + '回') +
      mini('見立て違い', t.misdiagnoses + '回') +
    '</div>';
}

function drawArtifactQr(){
  const canvas = $('artifact-qr-canvas');
  if (!canvas) return;
  const size = ARTIFACT_QR.length;
  const quietZone = ARTIFACT_QR_QUIET_ZONE;
  const moduleSize = 4;
  canvas.width = (size + quietZone * 2) * moduleSize;
  canvas.height = (size + quietZone * 2) * moduleSize;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#000';
  ARTIFACT_QR.forEach((row, y) => {
    [...row].forEach((module, x) => {
      if (module === '1') ctx.fillRect((x + quietZone) * moduleSize, (y + quietZone) * moduleSize, moduleSize, moduleSize);
    });
  });
}

function getCareerStorage(){
  try { return window.localStorage; }

function readCareerRecord(storage = getCareerStorage()){
  try {
    if (!storage) return freshCareerRecord();
    const raw = storage.getItem(CAREER_STORAGE_KEY);
    if (!raw) return freshCareerRecord();
    const parsed = normalizeCareerRecord(JSON.parse(raw));
    return validCareerRecord(parsed) ? parsed : freshCareerRecord();
  } catch (error){ return freshCareerRecord(); }
}

function writeCareerRecord(record, storage = getCareerStorage()){
  try {
    if (!storage) return false;
    storage.setItem(CAREER_STORAGE_KEY, JSON.stringify(record));
    return true;
  } catch (error){ return false; }
}
